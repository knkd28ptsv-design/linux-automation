---
# ================================================================
# LINUX SERVER HEALTH CHECK
# AWX / ANSIBLE
#
# Checks:
#   - Ansible connectivity
#   - SSH port/service
#   - CPU quantity and usage
#   - Memory quantity and usage
#   - Root disk quantity and usage
#   - Network interfaces and traffic
#   - Uptime
#   - Logged-in users
#   - Linux user count
#   - Running/failed services
#   - Service PID / command / start time
#   - SAP processes / instances
#   - SSL certificate expiry
#   - Overall PASS / WARNING / FAIL
#
# Designed to avoid:
#   - AnsibleUnsafeText arithmetic errors
#   - Undefined certificate dictionary errors
#   - AWX localhost sudo errors
#   - Broken Jinja if/endif blocks
# ================================================================

- name: Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ------------------------------------------------------------
    # THRESHOLDS
    # ------------------------------------------------------------

    cpu_warning: 80
    cpu_critical: 90

    memory_warning: 80
    memory_critical: 90

    disk_warning: 80
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 7

    # ------------------------------------------------------------
    # SERVICES TO CHECK
    #
    # Add/remove services as required.
    # SSH is checked separately.
    # ------------------------------------------------------------

    required_services:
      - ssh
      - nginx
      - docker
      - containerd

    # ------------------------------------------------------------
    # SAP
    #
    # SAP checks are automatically skipped when SAPCONTROL is
    # not installed.
    # ------------------------------------------------------------

    sap_enabled: true

    # ------------------------------------------------------------
    # SSL CERTIFICATES
    #
    # IMPORTANT:
    # Certificate checks are executed on the target Linux server,
    # NOT on AWX localhost.
    #
    # Add more certificates as required.
    # ------------------------------------------------------------

    ssl_certificates:
      - name: "Local HTTPS"
        host: "10.15.4.90"
        port: 443

    # ------------------------------------------------------------
    # NETWORK INTERFACE
    #
    # Set to ens5 for your current server.
    # Change to eth0/ens160/etc. for another server if required.
    # ------------------------------------------------------------

    network_interface: "ens5"

  tasks:

    # ============================================================
    # BASIC SYSTEM INFORMATION
    # ============================================================

    - name: Collect hostname
      ansible.builtin.set_fact:
        server_hostname: "{{ ansible_hostname | default(inventory_hostname) }}"
      no_log: true

    - name: Collect operating system
      ansible.builtin.set_fact:
        server_os: >-
          {{
            ansible_distribution
            | default('Unknown')
          }}
          {{
            ansible_distribution_version
            | default('')
          }}
      no_log: true

    - name: Collect kernel
      ansible.builtin.set_fact:
        server_kernel: "{{ ansible_kernel | default('Unknown') }}"
      no_log: true

    - name: Collect architecture
      ansible.builtin.set_fact:
        server_architecture: "{{ ansible_architecture | default('Unknown') }}"
      no_log: true

    # ============================================================
    # ANSIBLE CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ansible_ping_result
      changed_when: false
      no_log: true

    - name: Set Ansible ping status
      ansible.builtin.set_fact:
        ansible_ping_status: >-
          {{
            'PASS'
            if ansible_ping_result.ping | default('') == 'pong'
            else 'FAIL'
          }}
      no_log: true

    # ============================================================
    # SSH PORT
    # ============================================================

    - name: Check SSH port 22
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        timeout: 5
        state: started
      delegate_to: localhost
      become: false
      register: ssh_port_result
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set SSH port status
      ansible.builtin.set_fact:
        ssh_port_status: >-
          {{
            'PASS'
            if ssh_port_result.failed | default(true) | bool == false
            else 'FAIL'
          }}
      no_log: true

    # ============================================================
    # SSH SERVICE
    # ============================================================

    - name: Check SSH service
      ansible.builtin.service_facts:
      no_log: true

    - name: Determine SSH service status
      ansible.builtin.set_fact:
        ssh_service_status: >-
          {{
            'PASS'
            if
            (
              ansible_facts.services['ssh.service'].state | default('')
              == 'running'
            )
            or
            (
              ansible_facts.services['sshd.service'].state | default('')
              == 'running'
            )
            or
            (
              ansible_facts.services['ssh'].state | default('')
              == 'running'
            )
            or
            (
              ansible_facts.services['sshd'].state | default('')
              == 'running'
            )
            else 'FAIL'
          }}
      no_log: true

    # ============================================================
    # CPU
    # ============================================================

    - name: Collect CPU information
      ansible.builtin.shell: |
        set -o pipefail

        CPU_COUNT=$(nproc)

        CPU_IDLE=$(top -bn1 | \
          awk -F',' '/Cpu\(s\)/ {
            for(i=1;i<=NF;i++) {
              if ($i ~ /id/) {
                gsub(/[^0-9.]/,"",$i)
                print $i
                exit
              }
            }
          }')

        if [ -z "$CPU_IDLE" ]; then
          CPU_IDLE=$(awk '/^cpu / {
            idle=$5
            total=0
            for(i=2;i<=NF;i++) total+=$i
            printf "%.2f", (idle/total)*100
          }' /proc/stat)
        fi

        CPU_USAGE=$(awk -v idle="$CPU_IDLE" \
          'BEGIN {printf "%.2f", 100-idle}')

        echo "$CPU_COUNT|$CPU_USAGE"
      args:
        executable: /bin/bash
      register: cpu_result
      changed_when: false
      no_log: true

    - name: Set CPU quantity and usage
      ansible.builtin.set_fact:
        cpu_count: "{{ (cpu_result.stdout.split('|')[0] | default('0')) | int }}"
        cpu_usage: "{{ (cpu_result.stdout.split('|')[1] | default('0')) | float }}"
      no_log: true

    - name: Determine CPU status
      ansible.builtin.set_fact:
        cpu_status: >-
          {{
            'FAIL'
            if (cpu_usage | float) >= (cpu_critical | float)
            else
            'WARNING'
            if (cpu_usage | float) >= (cpu_warning | float)
            else
            'PASS'
          }}
      no_log: true

    # ============================================================
    # MEMORY
    # ============================================================

    - name: Collect memory information
      ansible.builtin.shell: |
        set -o pipefail

        free -b | awk '
        /^Mem:/ {
          total=$2
          available=$7
          used=total-available

          printf "%.0f|%.0f|%.0f|%.2f\n",
          total,
          used,
          available,
          (used/total)*100
        }'
      args:
        executable: /bin/bash
      register: memory_result
      changed_when: false
      no_log: true

    - name: Set memory values
      ansible.builtin.set_fact:
        memory_total_bytes: "{{ (memory_result.stdout.split('|')[0] | default('0')) | int }}"
        memory_used_bytes: "{{ (memory_result.stdout.split('|')[1] | default('0')) | int }}"
        memory_free_bytes: "{{ (memory_result.stdout.split('|')[2] | default('0')) | int }}"
        memory_usage: "{{ (memory_result.stdout.split('|')[3] | default('0')) | float }}"
      no_log: true

    - name: Calculate memory GB
      ansible.builtin.set_fact:
        memory_total_gb: "{{ ((memory_total_bytes | int) / 1073741824) | round(2) }}"
        memory_used_gb: "{{ ((memory_used_bytes | int) / 1073741824) | round(2) }}"
        memory_free_gb: "{{ ((memory_free_bytes | int) / 1073741824) | round(2) }}"
      no_log: true

    - name: Determine memory status
      ansible.builtin.set_fact:
        memory_status: >-
          {{
            'FAIL'
            if (memory_usage | float) >= (memory_critical | float)
            else
            'WARNING'
            if (memory_usage | float) >= (memory_warning | float)
            else
            'PASS'
          }}
      no_log: true

    # ============================================================
    # DISK
    # ============================================================

    - name: Collect root disk information
      ansible.builtin.shell: |
        df -Pk / | awk 'NR==2 {
          gsub("%","",$5)
          printf "%s|%s|%s|%s\n",$2,$3,$4,$5
        }'
      args:
        executable: /bin/bash
      register: disk_result
      changed_when: false
      no_log: true

    - name: Set disk values
      ansible.builtin.set_fact:
        root_disk_total_kb: "{{ (disk_result.stdout.split('|')[0] | default('0')) | int }}"
        root_disk_used_kb: "{{ (disk_result.stdout.split('|')[1] | default('0')) | int }}"
        root_disk_free_kb: "{{ (disk_result.stdout.split('|')[2] | default('0')) | int }}"
        root_disk_usage: "{{ (disk_result.stdout.split('|')[3] | default('0')) | float }}"
      no_log: true

    - name: Calculate disk GB
      ansible.builtin.set_fact:
        root_disk_total_gb: "{{ ((root_disk_total_kb | int) / 1048576) | round(2) }}"
        root_disk_used_gb: "{{ ((root_disk_used_kb | int) / 1048576) | round(2) }}"
        root_disk_free_gb: "{{ ((root_disk_free_kb | int) / 1048576) | round(2) }}"
      no_log: true

    - name: Determine disk status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'FAIL'
            if (root_disk_usage | float) >= (disk_critical | float)
            else
            'WARNING'
            if (root_disk_usage | float) >= (disk_warning | float)
            else
            'PASS'
          }}
      no_log: true

    # ============================================================
    # UPTIME
    # ============================================================

    - name: Get uptime seconds
      ansible.builtin.shell: |
        awk '{print int($1)}' /proc/uptime
      args:
        executable: /bin/bash
      register: uptime_result
      changed_when: false
      no_log: true

    - name: Convert uptime to integer
      ansible.builtin.set_fact:
        uptime_seconds: "{{ uptime_result.stdout | trim | int }}"
      no_log: true

    - name: Format uptime
      ansible.builtin.set_fact:
        uptime_display: >-
          {{
            ((uptime_seconds | int) // 86400)
          }} days
          {{
            (((uptime_seconds | int) % 86400) // 3600)
          }} hours
          {{
            (((uptime_seconds | int) % 3600) // 60)
          }} minutes
      no_log: true

    # ============================================================
    # NETWORK INTERFACES
    # ============================================================

    - name: Collect network interface information
      ansible.builtin.shell: |
        ip -br addr
      args:
        executable: /bin/bash
      register: network_interfaces_result
      changed_when: false
      no_log: true

    - name: Set network interfaces
      ansible.builtin.set_fact:
        network_interfaces: "{{ network_interfaces_result.stdout_lines | default([]) }}"
      no_log: true

    # ============================================================
    # NETWORK TRAFFIC
    # ============================================================

    - name: Collect network traffic
      ansible.builtin.shell: |
        if [ -f "/sys/class/net/{{ network_interface }}/statistics/rx_bytes" ]; then
          RX=$(cat "/sys/class/net/{{ network_interface }}/statistics/rx_bytes")
          TX=$(cat "/sys/class/net/{{ network_interface }}/statistics/tx_bytes")

          echo "$RX|$TX"
        else
          echo "0|0"
        fi
      args:
        executable: /bin/bash
      register: network_traffic_result
      changed_when: false
      no_log: true

    - name: Set network traffic bytes
      ansible.builtin.set_fact:
        network_rx_bytes: "{{ (network_traffic_result.stdout.split('|')[0] | default('0')) | int }}"
        network_tx_bytes: "{{ (network_traffic_result.stdout.split('|')[1] | default('0')) | int }}"
      no_log: true

    - name: Calculate network traffic GB
      ansible.builtin.set_fact:
        network_rx_gb: "{{ ((network_rx_bytes | int) / 1073741824) | round(2) }}"
        network_tx_gb: "{{ ((network_tx_bytes | int) / 1073741824) | round(2) }}"
      no_log: true

    - name: Determine network status
      ansible.builtin.set_fact:
        network_status: >-
          {{
            'PASS'
            if network_interface in ansible_facts.interfaces | default([])
            else 'WARNING'
          }}
      no_log: true

    # ============================================================
    # LOGGED-IN USERS
    # ============================================================

    - name: Collect logged-in users
      ansible.builtin.shell: |
        who | awk '{print $1}' | sort -u | paste -sd ',' -
      args:
        executable: /bin/bash
      register: logged_users_result
      changed_when: false
      no_log: true

    - name: Set logged-in users
      ansible.builtin.set_fact:
        logged_in_users: >-
          {{
            logged_users_result.stdout | trim
            if logged_users_result.stdout | trim | length > 0
            else 'None'
          }}
      no_log: true

    # ============================================================
    # LINUX USER COUNT
    # ============================================================

    - name: Count Linux users
      ansible.builtin.shell: |
        awk -F: 'END {print NR}' /etc/passwd
      args:
        executable: /bin/bash
      register: linux_user_count_result
      changed_when: false
      no_log: true

    - name: Set Linux user count
      ansible.builtin.set_fact:
        linux_user_count: "{{ linux_user_count_result.stdout | trim | int }}"
      no_log: true

    # ============================================================
    # SERVICE FACTS
    # ============================================================

    - name: Collect service facts
      ansible.builtin.service_facts:
      no_log: true

    # ============================================================
    # REQUIRED SERVICES
    # ============================================================

    - name: Initialize service status report
      ansible.builtin.set_fact:
        required_service_report: []
      no_log: true

    - name: Build required service report
      ansible.builtin.set_fact:
        required_service_report: >-
          {{
            required_service_report +
            [
              {
                'name': item,
                'state': (
                  ansible_facts.services[item + '.service'].state
                  | default(
                    ansible_facts.services[item].state
                    | default('NOT FOUND')
                  )
                )
              }
            ]
          }}
      loop: "{{ required_services }}"
      no_log: true

    # ============================================================
    # RUNNING / FAILED SERVICES
    # ============================================================

    - name: Count running services
      ansible.builtin.set_fact:
        running_service_count: >-
          {{
            ansible_facts.services
            | dict2items
            | selectattr('value.state', 'defined')
            | selectattr('value.state', 'equalto', 'running')
            | list
            | length
          }}
      no_log: true

    - name: Count failed services
      ansible.builtin.set_fact:
        failed_service_count: >-
          {{
            ansible_facts.services
            | dict2items
            | selectattr('value.state', 'defined')
            | selectattr('value.state', 'equalto', 'failed')
            | list
            | length
          }}
      no_log: true

    # ============================================================
    # SERVICE DETAILS
    # PID / COMMAND / START TIME
    # ============================================================

    - name: Collect running service details
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager |
        awk '{print $1}' |
        head -50 |
        while read svc; do

          PID=$(systemctl show "$svc" \
            -p MainPID --value 2>/dev/null)

          CMD="N/A"

          if [ "$PID" != "0" ] && [ -n "$PID" ]; then
            if [ -r "/proc/$PID/cmdline" ]; then
              CMD=$(tr '\0' ' ' < "/proc/$PID/cmdline")
            fi
          fi

          START=$(systemctl show "$svc" \
            -p ActiveEnterTimestamp --value 2>/dev/null)

          echo "$svc|$PID|$START|$CMD"

        done
      args:
        executable: /bin/bash
      register: running_service_details_result
      changed_when: false
      no_log: true

    - name: Set running service details
      ansible.builtin.set_fact:
        running_service_details: >-
          {{
            running_service_details_result.stdout_lines
            | default([])
          }}
      no_log: true

    # ============================================================
    # SAP DETECTION
    # ============================================================

    - name: Check for SAPCONTROL
      ansible.builtin.shell: |
        command -v sapcontrol || true
      args:
        executable: /bin/bash
      register: sapcontrol_result
      changed_when: false
      no_log: true
      when: sap_enabled | bool

    - name: Determine SAPCONTROL availability
      ansible.builtin.set_fact:
        sapcontrol_available: >-
          {{
            (
              sapcontrol_result.stdout | default('')
            ) | trim | length > 0
          }}
      no_log: true

    - name: Set SAP unavailable
      ansible.builtin.set_fact:
        sapcontrol_available: false
      when: not (sap_enabled | bool)
      no_log: true

    # ============================================================
    # SAP PROCESSES
    # ============================================================

    - name: Collect SAP processes
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,lstart,cmd --sort=user |
        grep -E '[s]apstartsrv|[s]apstart|[h]dbnameserver|[h]dbindexserver|[h]dbxsengine' ||
        true
      args:
        executable: /bin/bash
      register: sap_process_result
      changed_when: false
      no_log: true
      when: sap_enabled | bool

    - name: Set SAP process display
      ansible.builtin.set_fact:
        sap_process_display: >-
          {{
            sap_process_result.stdout_lines
            | default([])
            | join(' ; ')
            if
            (
              sap_process_result.stdout_lines
              | default([])
              | length > 0
            )
            else 'N/A'
          }}
      no_log: true

    - name: Set SAP process display when disabled
      ansible.builtin.set_fact:
        sap_process_display: "N/A"
      when: not (sap_enabled | bool)
      no_log: true

    # ============================================================
    # SAP SYSTEM INSTANCES
    # ============================================================

    - name: Find SAP system instances
      ansible.builtin.shell: |
        ps -eo user,pid,cmd |
        grep -E '[s]apstartsrv' |
        sed 's/^[[:space:]]*//' ||
        true
      args:
        executable: /bin/bash
      register: sap_instance_result
      changed_when: false
      no_log: true
      when: sap_enabled | bool

    - name: Set SAP instance display
      ansible.builtin.set_fact:
        sap_instance_display: >-
          {{
            sap_instance_result.stdout_lines
            | default([])
            | join(' ; ')
            if
            (
              sap_instance_result.stdout_lines
              | default([])
              | length > 0
            )
            else 'N/A'
          }}
      no_log: true

    - name: Set SAP instance display when disabled
      ansible.builtin.set_fact:
        sap_instance_display: "N/A"
      when: not (sap_enabled | bool)
      no_log: true

    # ============================================================
    # SAP STATUS
    # ============================================================

    - name: Determine SAP status
      ansible.builtin.set_fact:
        sap_status: >-
          {{
            'PASS'
            if
            (
              sap_process_display | default('N/A')
            ) != 'N/A'
            else 'N/A'
          }}
      no_log: true

    # ============================================================
    # SSL CERTIFICATE CHECK
    #
    # IMPORTANT:
    # This runs ON THE TARGET SERVER.
    #
    # There is NO:
    #   delegate_to: localhost
    #   sudo
    #
    # Therefore the previous:
    #   "/bin/sh: sudo: command not found"
    #
    # error is avoided.
    # ============================================================

    - name: Check SSL certificates
      ansible.builtin.shell: |
        set -o pipefail

        EXPIRY=$(
          echo |
          openssl s_client \
            -connect "{{ item.host }}:{{ item.port }}" \
            -servername "{{ item.host }}" \
            2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$EXPIRY" ]; then
          echo "ERROR"
        else
          echo "$EXPIRY"
        fi
      args:
        executable: /bin/bash
      loop: "{{ ssl_certificates | default([]) }}"
      register: certificate_results
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - ssl_certificates | default([]) | length > 0

    # ============================================================
    # INITIALIZE CERTIFICATE REPORT
    # ============================================================

    - name: Initialize certificate report
      ansible.builtin.set_fact:
        certificate_report: []
        certificate_status: "N/A"
      no_log: true

    # ============================================================
    # BUILD CERTIFICATE REPORT
    #
    # Every dictionary attribute uses default().
    # This prevents:
    #   'dict object' has no attribute 'name'
    # ============================================================

    - name: Build certificate report
      ansible.builtin.set_fact:
        certificate_report: >-
          {{
            certificate_report +
            [
              {
                'name': item.item.name | default('Unnamed Certificate'),
                'host': item.item.host | default('Unknown'),
                'port': item.item.port | default('Unknown'),
                'expiry': item.stdout | default('ERROR')
              }
            ]
          }}
      loop: "{{ certificate_results.results | default([]) }}"
      when:
        - item.item is defined
      no_log: true

    # ============================================================
    # CERTIFICATE EXPIRY DAYS
    # ============================================================

    - name: Calculate certificate expiry days
      ansible.builtin.shell: |
        EXPIRY="{{ item.expiry }}"

        if [ "$EXPIRY" = "ERROR" ] || [ -z "$EXPIRY" ]; then
          echo "ERROR"
          exit 0
        fi

        EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null || echo "0")
        NOW_EPOCH=$(date +%s)

        if [ "$EXPIRY_EPOCH" = "0" ]; then
          echo "ERROR"
        else
          echo $(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
        fi
      args:
        executable: /bin/bash
      loop: "{{ certificate_report | default([]) }}"
      register: certificate_days_result
      changed_when: false
      failed_when: false
      no_log: true

    # ============================================================
    # BUILD FINAL CERTIFICATE REPORT
    # ============================================================

    - name: Initialize final certificate report
      ansible.builtin.set_fact:
        certificate_final_report: []
      no_log: true

    - name: Build final certificate report
      ansible.builtin.set_fact:
        certificate_final_report: >-
          {{
            certificate_final_report +
            [
              {
                'name': item.item.name | default('Unnamed Certificate'),
                'host': item.item.host | default('Unknown'),
                'port': item.item.port | default('Unknown'),
                'expiry': item.item.expiry | default('ERROR'),
                'days': (
                  item.stdout | default('ERROR')
                ),
                'status':
                  'FAIL'
                  if (item.stdout | default('ERROR')) == 'ERROR'
                  else
                  'FAIL'
                  if (item.stdout | int) < (certificate_critical_days | int)
                  else
                  'WARNING'
                  if (item.stdout | int) < (certificate_warning_days | int)
                  else
                  'PASS'
              }
            ]
          }}
      loop: "{{ certificate_days_result.results | default([]) }}"
      when:
        - item.item is defined
      no_log: true

    # ============================================================
    # DETERMINE OVERALL CERTIFICATE STATUS
    # ============================================================

    - name: Determine certificate overall status
      ansible.builtin.set_fact:
        certificate_status: >-
          {{
            'FAIL'
            if
            (
              certificate_final_report
              | selectattr('status', 'equalto', 'FAIL')
              | list
              | length
            ) > 0
            else
            'WARNING'
            if
            (
              certificate_final_report
              | selectattr('status', 'equalto', 'WARNING')
              | list
              | length
            ) > 0
            else
            'PASS'
            if certificate_final_report | length > 0
            else 'N/A'
          }}
      no_log: true

    # ============================================================
    # CERTIFICATE DISPLAY
    #
    # This deliberately avoids a complex if/endif block.
    # ============================================================

    - name: Initialize certificate display
      ansible.builtin.set_fact:
        certificate_display_lines: []
      no_log: true

    - name: Build certificate display
      ansible.builtin.set_fact:
        certificate_display_lines: >-
          {{
            certificate_display_lines +
            [
              (
                item.name | default('Unnamed')
              )
              ~ " | "
              ~
              (
                item.host | default('Unknown')
              )
              ~ ":"
              ~
              (
                item.port | string
              )
              ~ " | Expiry: "
              ~
              (
                item.expiry | default('ERROR')
              )
              ~ " | Days: "
              ~
              (
                item.days | default('ERROR')
              )
              ~ " | Status: "
              ~
              (
                item.status | default('UNKNOWN')
              )
            ]
          }}
      loop: "{{ certificate_final_report | default([]) }}"
      no_log: true

    - name: Set certificate display
      ansible.builtin.set_fact:
        certificate_display: >-
          {{
            certificate_display_lines
            if certificate_display_lines | length > 0
            else
            ['No SSL certificates configured for checking.']
          }}
      no_log: true

    # ============================================================
    # REQUIRED SERVICE STATUS
    # ============================================================

    - name: Determine required service status
      ansible.builtin.set_fact:
        required_service_status: >-
          {{
            'FAIL'
            if
            (
              required_service_report
              | selectattr('state', 'equalto', 'NOT FOUND')
              | list
              | length
            ) > 0
            or
            (
              required_service_report
              | selectattr('state', 'equalto', 'failed')
              | list
              | length
            ) > 0
            else
            'PASS'
          }}
      no_log: true

    # ============================================================
    # OVERALL HEALTH
    # ============================================================

    - name: Determine overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'FAIL'
            if
            (
              ansible_ping_status == 'FAIL'
              or ssh_port_status == 'FAIL'
              or ssh_service_status == 'FAIL'
              or cpu_status == 'FAIL'
              or memory_status == 'FAIL'
              or disk_status == 'FAIL'
              or required_service_status == 'FAIL'
              or certificate_status == 'FAIL'
            )
            else
            'WARNING'
            if
            (
              cpu_status == 'WARNING'
              or memory_status == 'WARNING'
              or disk_status == 'WARNING'
              or network_status == 'WARNING'
              or certificate_status == 'WARNING'
            )
            else
            'PASS'
          }}
      no_log: true

    # ============================================================
    # CLEAN REPORT
    #
    # Only this task produces the human-readable report.
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - "Server              : {{ inventory_hostname }}"
          - "Hostname            : {{ server_hostname | default('N/A') }}"
          - "OS                  : {{ server_os | default('N/A') }}"
          - "Kernel              : {{ server_kernel | default('N/A') }}"
          - "Architecture        : {{ server_architecture | default('N/A') }}"
          - "Overall Health      : {{ overall_health | default('UNKNOWN') }}"
          - "======================================================================"
          - ""
          - "[ AVAILABILITY ]"
          - "----------------------------------------------------------------------"
          - "Ansible Ping        : {{ ansible_ping_status | default('UNKNOWN') }}"
          - "SSH Port 22         : {{ ssh_port_status | default('UNKNOWN') }}"
          - "SSH Service         : {{ ssh_service_status | default('UNKNOWN') }}"
          - "Uptime              : {{ uptime_display | default('N/A') }}"
          - ""
          - "[ CPU ]"
          - "----------------------------------------------------------------------"
          - "CPU Quantity        : {{ cpu_count | default(0) }}"
          - "CPU Usage           : {{ cpu_usage | default(0) }} %"
          - "CPU Status          : {{ cpu_status | default('UNKNOWN') }}"
          - ""
          - "[ MEMORY ]"
          - "----------------------------------------------------------------------"
          - "Memory Total        : {{ memory_total_gb | default(0) }} GB"
          - "Memory Used         : {{ memory_used_gb | default(0) }} GB"
          - "Memory Free         : {{ memory_free_gb | default(0) }} GB"
          - "Memory Usage        : {{ memory_usage | default(0) }} %"
          - "Memory Status       : {{ memory_status | default('UNKNOWN') }}"
          - ""
          - "[ DISK ]"
          - "----------------------------------------------------------------------"
          - "Disk Total          : {{ root_disk_total_gb | default(0) }} GB"
          - "Disk Used           : {{ root_disk_used_gb | default(0) }} GB"
          - "Disk Free           : {{ root_disk_free_gb | default(0) }} GB"
          - "Disk Usage          : {{ root_disk_usage | default(0) }} %"
          - "Disk Status         : {{ disk_status | default('UNKNOWN') }}"
          - ""
          - "[ NETWORK ]"
          - "----------------------------------------------------------------------"
          - "Interface Checked   : {{ network_interface | default('N/A') }}"
          - "Network Status      : {{ network_status | default('UNKNOWN') }}"
          - "RX Traffic          : {{ network_rx_gb | default(0) }} GB"
          - "TX Traffic          : {{ network_tx_gb | default(0) }} GB"
          - "Interfaces:"
          - "{{ network_interfaces | default([]) }}"
          - ""
          - "[ USERS ]"
          - "----------------------------------------------------------------------"
          - "Logged-in Users     : {{ logged_in_users | default('None') }}"
          - "Linux Users Count   : {{ linux_user_count | default(0) }}"
          - ""
          - "[ SERVICES ]"
          - "----------------------------------------------------------------------"
          - "Running Services    : {{ running_service_count | default(0) }}"
          - "Failed Services     : {{ failed_service_count | default(0) }}"
          - "Required Services   : {{ required_service_status | default('UNKNOWN') }}"
          - "Required Service Details:"
          - "{{ required_service_report | default([]) }}"
          - ""
          - "Running Service Details:"
          - "{{ running_service_details | default([]) }}"
          - ""
          - "[ SAP ]"
          - "----------------------------------------------------------------------"
          - "SAP Status          : {{ sap_status | default('N/A') }}"
          - "SAP Processes       : {{ sap_process_display | default('N/A') }}"
          - "SAP Instances       : {{ sap_instance_display | default('N/A') }}"
          - ""
          - "[ SSL CERTIFICATES ]"
          - "----------------------------------------------------------------------"
          - "Certificate Status  : {{ certificate_status | default('N/A') }}"
          - "Certificate Details:"
          - "{{ certificate_display | default(['N/A']) }}"
          - ""
          - "======================================================================"
          - "                         END OF REPORT"
          - "======================================================================"

      changed_when: false
