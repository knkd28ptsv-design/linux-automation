---
- name: Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ============================================================
    # THRESHOLDS
    # ============================================================

    cpu_warning: 70
    cpu_critical: 90

    memory_warning: 75
    memory_critical: 90

    disk_warning: 75
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 15

    ssh_port: 22

    # Services to monitor
    # Add/remove services according to your environment.
    monitored_services:
      - ssh
      - docker
      - containerd
      - nginx

    # SSL certificates to check
    certificate_checks:
      - name: "Local HTTPS"
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 443


  tasks:

    # ============================================================
    # INITIALIZE VARIABLES
    # ============================================================

    - name: Initialize health variables
      ansible.builtin.set_fact:
        cpu_usage: 0.0
        cpu_status: "UNKNOWN"

        memory_total_mb: 0.0
        memory_used_mb: 0.0
        memory_free_mb: 0.0
        memory_usage: 0.0
        memory_status: "UNKNOWN"

        disk_status: "PASS"
        disk_report: []

        network_status: "PASS"
        network_interfaces: []
        network_rx_mb: 0.0
        network_tx_mb: 0.0

        ssh_status: "FAIL"
        ssh_service_status: "UNKNOWN"

        service_status: "PASS"
        service_report: []

        sap_status: "NOT DETECTED"
        sap_processes: []

        certificate_status: "PASS"
        certificate_report: []

        health_reasons: []


    # ============================================================
    # CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Check SSH port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ssh_port }}"
        timeout: 5
        state: started
      delegate_to: localhost
      register: ssh_port_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Check SSH service
      ansible.builtin.command:
        cmd: systemctl is-active ssh
      register: ssh_service_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set availability status
      ansible.builtin.set_fact:
        ssh_status: >-
          {{
            'PASS'
            if not ssh_port_result.failed | default(true)
            else 'FAIL'
          }}

        ssh_service_status: >-
          {{
            'RUNNING'
            if (ssh_service_result.stdout | default('') | trim) == 'active'
            else 'NOT RUNNING'
          }}


    # ============================================================
    # UPTIME
    # ============================================================

    # IMPORTANT:
    # Do not store uptime as AnsibleUnsafeText and then use //
    # directly against it.
    # Calculate the display value in shell instead.

    - name: Get formatted uptime
      ansible.builtin.shell: |
        set -o pipefail

        uptime_seconds=$(awk '{print int($1)}' /proc/uptime)

        days=$(( uptime_seconds / 86400 ))
        hours=$(( (uptime_seconds % 86400) / 3600 ))
        minutes=$(( (uptime_seconds % 3600) / 60 ))

        echo "${days} days ${hours} hours ${minutes} minutes"
      args:
        executable: /bin/bash
      register: uptime_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set uptime display
      ansible.builtin.set_fact:
        uptime_display: "{{ uptime_result.stdout | default('N/A') | trim }}"


    # ============================================================
    # CPU
    # ============================================================

    - name: Get CPU count
      ansible.builtin.command:
        cmd: nproc
      register: cpu_count_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Collect CPU usage
      ansible.builtin.shell: |
        set -o pipefail

        top -bn2 |
        grep "Cpu(s)" |
        tail -1 |
        awk '{print 100 - $8}'
      args:
        executable: /bin/bash
      register: cpu_usage_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Get CPU load
      ansible.builtin.command:
        cmd: awk '{print $1","$2","$3}' /proc/loadavg
      register: cpu_load_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set CPU statistics
      ansible.builtin.set_fact:
        cpu_count: "{{ cpu_count_result.stdout | default('0') | int }}"
        cpu_usage: "{{ cpu_usage_result.stdout | default('0') | trim | float }}"
        cpu_load: "{{ cpu_load_result.stdout | default('0,0,0') | trim }}"


    - name: Determine CPU status
      ansible.builtin.set_fact:
        cpu_status: >-
          {{
            'FAIL'
            if (cpu_usage | float) >= (cpu_critical | float)
            else
            'WARNING'
            if (cpu_usage | float) >= (cpu_warning | float)
            else
            'PASS'
          }}


    # ============================================================
    # MEMORY
    # ============================================================

    - name: Collect memory information
      ansible.builtin.shell: |
        set -o pipefail

        free -m |
        awk '/^Mem:/ {
          total=$2;
          available=$7;
          used=total-available;

          if (total > 0) {
            usage=(used/total)*100
          }
          else {
            usage=0
          }

          printf "%.0f %.0f %.0f %.2f\n",
                 total,
                 used,
                 available,
                 usage
        }'
      args:
        executable: /bin/bash
      register: memory_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set memory values
      ansible.builtin.set_fact:
        memory_values: >-
          {{
            memory_result.stdout |
            default('0 0 0 0') |
            trim |
            split()
          }}


    - name: Set memory statistics
      ansible.builtin.set_fact:
        memory_total_mb: "{{ memory_values[0] | default('0') | float }}"
        memory_used_mb: "{{ memory_values[1] | default('0') | float }}"
        memory_free_mb: "{{ memory_values[2] | default('0') | float }}"
        memory_usage: "{{ memory_values[3] | default('0') | float }}"


    - name: Determine memory status
      ansible.builtin.set_fact:
        memory_status: >-
          {{
            'FAIL'
            if (memory_usage | float) >= (memory_critical | float)
            else
            'WARNING'
            if (memory_usage | float) >= (memory_warning | float)
            else
            'PASS'
          }}


    # ============================================================
    # DISK
    # ============================================================

    - name: Collect disk usage
      ansible.builtin.shell: |
        df -Pk -x tmpfs -x devtmpfs |
        awk 'NR>1 {
          gsub("%","",$5);
          printf "%s|%s|%s|%s|%s\n",
                 $6,$2,$3,$4,$5
        }'
      register: disk_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Initialize disk report
      ansible.builtin.set_fact:
        disk_report: []


    - name: Build disk report
      ansible.builtin.set_fact:
        disk_report: >-
          {{
            disk_report +
            [{
              'filesystem': item.split('|')[0],
              'total_kb': item.split('|')[1] | float,
              'used_kb': item.split('|')[2] | float,
              'free_kb': item.split('|')[3] | float,
              'usage': item.split('|')[4] | float
            }]
          }}
      loop: "{{ disk_result.stdout_lines | default([]) }}"
      when:
        - item | length > 0


    - name: Determine disk status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'FAIL'
            if (
              disk_report |
              selectattr('usage', 'ge', disk_critical | float) |
              list |
              length > 0
            )
            else
            'WARNING'
            if (
              disk_report |
              selectattr('usage', 'ge', disk_warning | float) |
              list |
              length > 0
            )
            else
            'PASS'
          }}


    # ============================================================
    # NETWORK
    # ============================================================

    - name: Get network interfaces
      ansible.builtin.shell: |
        ip -o -4 addr show |
        awk '{print $2 "|" $4}'
      register: network_interfaces_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Get network traffic
      ansible.builtin.shell: |
        awk '
        BEGIN {
          rx=0;
          tx=0
        }

        /:/ {
          gsub(":","",$1)

          if ($1 != "lo") {
            rx += $2
            tx += $10
          }
        }

        END {
          printf "%.2f %.2f\n",
                 rx/1024/1024,
                 tx/1024/1024
        }' /proc/net/dev
      register: network_traffic_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set network traffic values
      ansible.builtin.set_fact:
        network_traffic_values: >-
          {{
            network_traffic_result.stdout |
            default('0 0') |
            trim |
            split()
          }}


    - name: Set network statistics
      ansible.builtin.set_fact:
        network_rx_mb: "{{ network_traffic_values[0] | default('0') | float }}"
        network_tx_mb: "{{ network_traffic_values[1] | default('0') | float }}"


    - name: Build network interface report
      ansible.builtin.set_fact:
        network_interfaces: >-
          {{
            network_interfaces +
            [{
              'interface': item.split('|')[0],
              'address': item.split('|')[1]
            }]
          }}
      loop: "{{ network_interfaces_result.stdout_lines | default([]) }}"
      when:
        - item | length > 0


    # ============================================================
    # LOGGED-IN USERS
    # ============================================================

    - name: Get logged-in users
      ansible.builtin.shell: |
        who |
        awk '{print $1 "|" $2 "|" $5}' || true
      register: logged_users_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set logged-in users
      ansible.builtin.set_fact:
        logged_users: "{{ logged_users_result.stdout_lines | default([]) }}"


    # ============================================================
    # SERVICES
    # ============================================================

    - name: Check monitored services
      ansible.builtin.command:
        cmd: systemctl is-active {{ item }}
      loop: "{{ monitored_services }}"
      register: service_checks
      changed_when: false
      failed_when: false
      no_log: true


    - name: Initialize service report
      ansible.builtin.set_fact:
        service_report: []


    - name: Build service report
      ansible.builtin.set_fact:
        service_report: >-
          {{
            service_report +
            [{
              'name': item.item,
              'status':
                'RUNNING'
                if item.rc == 0
                else 'NOT RUNNING'
            }]
          }}
      loop: "{{ service_checks.results | default([]) }}"


    - name: Determine service status
      ansible.builtin.set_fact:
        service_status: >-
          {{
            'WARNING'
            if (
              service_report |
              selectattr('status', 'equalto', 'NOT RUNNING') |
              list |
              length > 0
            )
            else 'PASS'
          }}


    # ============================================================
    # SAP
    # ============================================================

    - name: Check SAPCONTROL
      ansible.builtin.shell: |
        command -v sapcontrol || true
      register: sapcontrol_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Detect SAP processes
      ansible.builtin.shell: |
        ps -eo user,pid,cmd |
        grep -E '[s]apstartsrv|[h]dbnameserver|[h]dbindexserver|[h]dbdaemon' ||
        true
      register: sap_process_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Set SAP process list
      ansible.builtin.set_fact:
        sap_processes: "{{ sap_process_result.stdout_lines | default([]) }}"


    - name: Determine SAP status
      ansible.builtin.set_fact:
        sap_status: >-
          {{
            'RUNNING'
            if (sap_processes | length) > 0
            else 'NOT DETECTED'
          }}


    # ============================================================
    # SSL CERTIFICATES
    # ============================================================

    - name: Check SSL certificates
      ansible.builtin.shell: |
        set -o pipefail

        expiry=$(
          echo |
          timeout 8 openssl s_client \
            -connect "{{ item.host }}:{{ item.port }}" \
            -servername "{{ item.host }}" \
            2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then
          echo "ERROR"
        else
          echo "$expiry"
        fi
      args:
        executable: /bin/bash
      loop: "{{ certificate_checks }}"
      register: certificate_checks_result
      changed_when: false
      failed_when: false
      no_log: true


    - name: Initialize certificate report
      ansible.builtin.set_fact:
        certificate_report: []


    - name: Calculate certificate expiry
      ansible.builtin.shell: |
        expiry="{{ item.stdout | trim }}"

        if [ "$expiry" = "ERROR" ] || [ -z "$expiry" ]; then
          echo "ERROR|0"
          exit 0
        fi

        expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
        now_epoch=$(date +%s)

        if [ "$expiry_epoch" -eq 0 ]; then
          echo "ERROR|0"
          exit 0
        fi

        days=$(( (expiry_epoch - now_epoch) / 86400 ))

        echo "${expiry}|${days}"
      args:
        executable: /bin/bash
      loop: "{{ certificate_checks_result.results | default([]) }}"
      register: certificate_calculation
      changed_when: false
      failed_when: false
      no_log: true


    - name: Build certificate report
      ansible.builtin.set_fact:
        certificate_report: >-
          {{
            certificate_report +
            [{
              'name': item.item.name,

              'expiry':
                (
                  item.stdout.split('|')[0]
                  if '|' in item.stdout
                  else 'ERROR'
                ),

              'days':
                (
                  item.stdout.split('|')[1] | int
                  if '|' in item.stdout
                  else 0
                ),

              'status':
                (
                  'FAIL'
                  if (
                    ('|' in item.stdout) and
                    ((item.stdout.split('|')[1] | int) < (certificate_critical_days | int))
                  )
                  else
                  'WARNING'
                  if (
                    ('|' in item.stdout) and
                    ((item.stdout.split('|')[1] | int) < (certificate_warning_days | int))
                  )
                  else
                  'PASS'
                )
            }]
          }}
      loop: "{{ certificate_calculation.results | default([]) }}"


    - name: Determine certificate status
      ansible.builtin.set_fact:
        certificate_status: >-
          {{
            'FAIL'
            if (
              certificate_report |
              selectattr('status', 'equalto', 'FAIL') |
              list |
              length > 0
            )
            else
            'WARNING'
            if (
              certificate_report |
              selectattr('status', 'equalto', 'WARNING') |
              list |
              length > 0
            )
            else
            'PASS'
          }}


    # ============================================================
    # OVERALL HEALTH
    # ============================================================

    - name: Build health reasons
      ansible.builtin.set_fact:
        health_reasons: >-
          {{
            health_reasons

            +

            (
              ['CPU usage is critical']
              if cpu_status == 'FAIL'
              else
              ['CPU usage is high']
              if cpu_status == 'WARNING'
              else []
            )

            +

            (
              ['Memory usage is critical']
              if memory_status == 'FAIL'
              else
              ['Memory usage is high']
              if memory_status == 'WARNING'
              else []
            )

            +

            (
              ['Disk usage is critical']
              if disk_status == 'FAIL'
              else
              ['Disk usage is high']
              if disk_status == 'WARNING'
              else []
            )

            +

            (
              ['SSH port 22 is unavailable']
              if ssh_status == 'FAIL'
              else []
            )

            +

            (
              ['One or more monitored services are not running']
              if service_status == 'WARNING'
              else []
            )

            +

            (
              ['SSL certificate is critically close to expiry']
              if certificate_status == 'FAIL'
              else
              ['SSL certificate is nearing expiry']
              if certificate_status == 'WARNING'
              else []
            )
          }}


    - name: Determine overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'FAIL'
            if (
              cpu_status == 'FAIL'
              or memory_status == 'FAIL'
              or disk_status == 'FAIL'
              or ssh_status == 'FAIL'
              or certificate_status == 'FAIL'
            )
            else
            'WARNING'
            if (
              cpu_status == 'WARNING'
              or memory_status == 'WARNING'
              or disk_status == 'WARNING'
              or service_status == 'WARNING'
              or certificate_status == 'WARNING'
            )
            else
            'PASS'
          }}


    # ============================================================
    # CLEAN AWX REPORT
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - ""
          - "Server              : {{ ansible_host | default(inventory_hostname) }}"
          - "Hostname            : {{ ansible_hostname | default('N/A') }}"
          - "OS                  : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel              : {{ ansible_kernel }}"
          - "Architecture        : {{ ansible_architecture }}"
          - "Overall Health      : {{ overall_health }}"
          - ""
          - "======================================================================"
          - "[ AVAILABILITY ]"
          - "======================================================================"
          - ""
          - "Ansible Ping        : {{ 'PASS' if ping_result.ping is defined else 'FAIL' }}"
          - "SSH Port 22         : {{ ssh_status }}"
          - "SSH Service         : {{ ssh_service_status }}"
          - "Uptime              : {{ uptime_display }}"
          - ""
          - "======================================================================"
          - "[ CPU ]"
          - "======================================================================"
          - ""
          - "CPU Count           : {{ cpu_count }}"
          - "CPU Usage           : {{ '%.2f' | format(cpu_usage | float) }}%"
          - "Load Average        : {{ cpu_load }}"
          - "CPU Status          : {{ cpu_status }}"
          - ""
          - "======================================================================"
          - "[ MEMORY ]"
          - "======================================================================"
          - ""
          - "Total Memory        : {{ '%.2f' | format((memory_total_mb | float) / 1024) }} GB"
          - "Used Memory         : {{ '%.2f' | format((memory_used_mb | float) / 1024) }} GB"
          - "Free Memory         : {{ '%.2f' | format((memory_free_mb | float) / 1024) }} GB"
          - "Memory Usage        : {{ '%.2f' | format(memory_usage | float) }}%"
          - "Memory Status       : {{ memory_status }}"
          - ""
          - "======================================================================"
          - "[ DISK ]"
          - "======================================================================"
          - ""
          - "Filesystem          Total       Used       Free       Usage     Status"

          - >-
            {% for d in disk_report %}
            {{ '%-19s' | format(d.filesystem) }}
            {{ '%-12s' | format('%.2f GB' | format((d.total_kb | float) / 1024 / 1024)) }}
            {{ '%-11s' | format('%.2f GB' | format((d.used_kb | float) / 1024 / 1024)) }}
            {{ '%-11s' | format('%.2f GB' | format((d.free_kb | float) / 1024 / 1024)) }}
            {{ '%-10s' | format((d.usage | float) ~ '%') }}
            {{ 'FAIL' if (d.usage | float) >= (disk_critical | float) else 'WARNING' if (d.usage | float) >= (disk_warning | float) else 'PASS' }}
            {% endfor %}

          - ""
          - "Disk Status         : {{ disk_status }}"
          - ""
          - "======================================================================"
          - "[ NETWORK ]"
          - "======================================================================"
          - ""
          - "Interface           IP Address"

          - >-
            {% for n in network_interfaces %}
            {{ '%-19s' | format(n.interface) }}{{ n.address }}
            {% endfor %}

          - ""
          - "RX Traffic          : {{ '%.2f' | format((network_rx_mb | float) / 1024) }} GB"
          - "TX Traffic          : {{ '%.2f' | format((network_tx_mb | float) / 1024) }} GB"
          - "Network Status      : {{ network_status }}"
          - ""
          - "======================================================================"
          - "[ LOGGED-IN USERS ]"
          - "======================================================================"
          - ""

          - >-
            {% if logged_users | length > 0 %}
            Logged-in Users:
            {% for u in logged_users %}
            {{ u }}
            {% endfor %}
            Total Logged Users  : {{ logged_users | length }}
            {% else %}
            No interactive users currently logged in.
            Total Logged Users  : 0
            {% endif %}

          - ""
          - "======================================================================"
          - "[ SERVICES ]"
          - "======================================================================"
          - ""
          - "Service             Status"

          - >-
            {% for s in service_report %}
            {{ '%-20s' | format(s.name) }}{{ s.status }}
            {% endfor %}

          - ""
          - "Service Status      : {{ service_status }}"
          - ""
          - "======================================================================"
          - "[ SAP ]"
          - "======================================================================"
          - ""
          - "SAP Status          : {{ sap_status }}"

          - >-
            {% if sap_processes | length > 0 %}
            SAP Processes:
            {% for p in sap_processes %}
            {{ p }}
            {% endfor %}
            {% else %}
            SAP Processes       : N/A
            {% endif %}

          - ""
          - "======================================================================"
          - "[ SSL CERTIFICATES ]"
          - "======================================================================"
          - ""
          - "Certificate         Expiry Date              Days Left    Status"

          - >-
            {% for c in certificate_report %}
            {{ '%-20s' | format(c.name) }}
            {{ '%-26s' | format(c.expiry) }}
            {{ '%-13s' | format(c.days) }}
            {{ c.status }}
            {% endfor %}

          - ""
          - "Certificate Status  : {{ certificate_status }}"
          - ""
          - "======================================================================"
          - "[ FINAL RESULT ]"
          - "======================================================================"
          - ""
          - "Overall Health      : {{ overall_health }}"
          - ""

          - >-
            {% if health_reasons | length > 0 %}
            HEALTH REASONS:
            {% for reason in health_reasons %}
            - {{ reason }}
            {% endfor %}
            {% else %}
            HEALTH REASONS:
            - No issues detected
            {% endif %}

          - ""
          - "======================================================================"
          - "                    END OF HEALTH CHECK"
          - "======================================================================"
