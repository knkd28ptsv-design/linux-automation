---
- name: Linux Server Complete Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ============================================================
    # THRESHOLDS
    # ============================================================

    cpu_warning: 80
    cpu_critical: 90

    memory_warning: 80
    memory_critical: 90

    disk_warning: 80
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 7

    # ============================================================
    # SERVICES TO CHECK
    # Add/remove services according to your environment
    # ============================================================

    required_services:
      - ssh
      - sshd
      - nginx
      - docker
      - containerd
      - kubelet

    # ============================================================
    # SAP
    # ============================================================

    sap_sid: ""
    sap_instance: ""

    # ============================================================
    # CERTIFICATES
    #
    # IMPORTANT:
    # Use dictionaries with name/host/port.
    # The playbook also safely ignores incomplete entries.
    # ============================================================

    certificate_checks:
      - name: "Local HTTPS"
        host: "10.15.4.90"
        port: 443

    # ============================================================
    # INITIAL VALUES
    # ============================================================

    health_results: []

  tasks:

    # ============================================================
    # SERVER INFORMATION
    # ============================================================

    - name: Get hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Get OS information
      ansible.builtin.shell: |
        . /etc/os-release
        echo "${PRETTY_NAME:-Unknown}"
      args:
        executable: /bin/bash
      register: os_result
      changed_when: false

    - name: Get kernel
      ansible.builtin.command: uname -r
      register: kernel_result
      changed_when: false

    - name: Get architecture
      ansible.builtin.command: uname -m
      register: arch_result
      changed_when: false

    # ============================================================
    # ANSIBLE CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      ignore_errors: true

    # ============================================================
    # SSH PORT
    # ============================================================

    - name: Check SSH port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: 5
        state: started
      delegate_to: localhost
      become: false
      register: ssh_port_result
      ignore_errors: true

    # ============================================================
    # SSH SERVICE
    # ============================================================

    - name: Check SSH service
      ansible.builtin.shell: |
        if systemctl is-active --quiet ssh; then
          echo "RUNNING"
        elif systemctl is-active --quiet sshd; then
          echo "RUNNING"
        else
          echo "STOPPED"
        fi
      args:
        executable: /bin/bash
      register: ssh_service_result
      changed_when: false
      failed_when: false

    # ============================================================
    # UPTIME
    # ============================================================

    - name: Get uptime seconds
      ansible.builtin.shell: |
        awk '{print int($1)}' /proc/uptime
      args:
        executable: /bin/bash
      register: uptime_result
      changed_when: false

    - name: Convert uptime to integer
      ansible.builtin.set_fact:
        uptime_seconds: "{{ uptime_result.stdout | default('0', true) | trim | int }}"

    - name: Format uptime
      ansible.builtin.set_fact:
        uptime_formatted: >-
          {{
            (uptime_seconds // 86400) | int
          }} days
          {{
            ((uptime_seconds % 86400) // 3600) | int
          }} hours
          {{
            ((uptime_seconds % 3600) // 60) | int
          }} minutes

    # ============================================================
    # CPU
    # ============================================================

    - name: Get CPU quantity
      ansible.builtin.shell: |
        nproc
      args:
        executable: /bin/bash
      register: cpu_quantity_result
      changed_when: false

    - name: Get CPU usage
      ansible.builtin.shell: |
        top -bn1 | awk '/Cpu\(s\)/ {
          print 100 - $8
        }'
      args:
        executable: /bin/bash
      register: cpu_usage_result
      changed_when: false

    - name: Set CPU values safely
      ansible.builtin.set_fact:
        cpu_quantity: "{{ cpu_quantity_result.stdout | default('0', true) | trim | int }}"
        cpu_usage: "{{ cpu_usage_result.stdout | default('0', true) | trim | float }}"

    - name: Determine CPU status
      ansible.builtin.set_fact:
        cpu_status: >-
          {{
            'FAIL'
            if (cpu_usage | float) >= (cpu_critical | float)
            else
            'WARNING'
            if (cpu_usage | float) >= (cpu_warning | float)
            else
            'PASS'
          }}

    # ============================================================
    # MEMORY
    # ============================================================

    - name: Get memory information
      ansible.builtin.shell: |
        free -m | awk '/^Mem:/ {
          printf "%s %s %.2f\n", $2, $3, ($3/$2)*100
        }'
      args:
        executable: /bin/bash
      register: memory_result
      changed_when: false

    - name: Set memory values safely
      ansible.builtin.set_fact:
        memory_quantity_mb: "{{ (memory_result.stdout.split()[0] | default('0')) | int }}"
        memory_used_mb: "{{ (memory_result.stdout.split()[1] | default('0')) | int }}"
        memory_usage: "{{ (memory_result.stdout.split()[2] | default('0')) | float }}"

    - name: Determine memory status
      ansible.builtin.set_fact:
        memory_status: >-
          {{
            'FAIL'
            if (memory_usage | float) >= (memory_critical | float)
            else
            'WARNING'
            if (memory_usage | float) >= (memory_warning | float)
            else
            'PASS'
          }}

    # ============================================================
    # DISK
    # ============================================================

    - name: Get root disk information
      ansible.builtin.shell: |
        df -Pk / | awk 'NR==2 {
          printf "%s %s %s %.2f\n", $2, $3, $4, int($5)
        }'
      args:
        executable: /bin/bash
      register: disk_result
      changed_when: false

    - name: Set disk values safely
      ansible.builtin.set_fact:
        root_disk_total_kb: "{{ (disk_result.stdout.split()[0] | default('0')) | int }}"
        root_disk_used_kb: "{{ (disk_result.stdout.split()[1] | default('0')) | int }}"
        root_disk_available_kb: "{{ (disk_result.stdout.split()[2] | default('0')) | int }}"
        root_disk_usage: "{{ (disk_result.stdout.split()[3] | default('0')) | float }}"

    - name: Calculate disk quantities
      ansible.builtin.set_fact:
        root_disk_total_gb: "{{ ((root_disk_total_kb | int) / 1024 / 1024) | round(2) }}"
        root_disk_used_gb: "{{ ((root_disk_used_kb | int) / 1024 / 1024) | round(2) }}"
        root_disk_available_gb: "{{ ((root_disk_available_kb | int) / 1024 / 1024) | round(2) }}"

    - name: Determine disk status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'FAIL'
            if (root_disk_usage | float) >= (disk_critical | float)
            else
            'WARNING'
            if (root_disk_usage | float) >= (disk_warning | float)
            else
            'PASS'
          }}

    # ============================================================
    # ALL FILESYSTEMS
    # ============================================================

    - name: Get filesystem usage
      ansible.builtin.shell: |
        df -Ph -x tmpfs -x devtmpfs | tail -n +2
      args:
        executable: /bin/bash
      register: filesystem_result
      changed_when: false

    # ============================================================
    # NETWORK INTERFACES
    # ============================================================

    - name: Get network interfaces
      ansible.builtin.shell: |
        ip -br addr
      args:
        executable: /bin/bash
      register: network_interfaces_result
      changed_when: false

    # ============================================================
    # NETWORK TRAFFIC
    # ============================================================

    - name: Get network traffic
      ansible.builtin.shell: |
        awk '
        BEGIN {
          printf "INTERFACE RX_MB TX_MB\n"
        }
        /^[[:space:]]*[a-zA-Z0-9_.:-]+:/ {
          iface=$1
          gsub(":", "", iface)

          if (iface != "lo") {
            rx=$2
            tx=$10

            printf "%s %.2f %.2f\n",
              iface,
              rx/1024/1024,
              tx/1024/1024
          }
        }' /proc/net/dev
      args:
        executable: /bin/bash
      register: network_traffic_result
      changed_when: false

    # ============================================================
    # LOGGED-IN USERS
    # ============================================================

    - name: Get logged-in users
      ansible.builtin.shell: |
        who
      args:
        executable: /bin/bash
      register: logged_users_result
      changed_when: false

    - name: Count logged-in users
      ansible.builtin.shell: |
        who | wc -l
      args:
        executable: /bin/bash
      register: logged_users_count_result
      changed_when: false

    - name: Set logged-in user information
      ansible.builtin.set_fact:
        logged_users_count: "{{ logged_users_count_result.stdout | default('0', true) | trim | int }}"
        logged_users: "{{ logged_users_result.stdout_lines | default([]) }}"

    # ============================================================
    # CURRENT USER
    # ============================================================

    - name: Get current execution user
      ansible.builtin.shell: |
        whoami
      args:
        executable: /bin/bash
      register: current_user_result
      changed_when: false

    # ============================================================
    # RUNNING SERVICES
    # ============================================================

    - name: Get running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-pager \
          --no-legend \
          | awk '{print $1}'
      args:
        executable: /bin/bash
      register: running_services_result
      changed_when: false
      failed_when: false

    - name: Count running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-pager \
          --no-legend \
          | wc -l
      args:
        executable: /bin/bash
      register: running_services_count_result
      changed_when: false
      failed_when: false

    - name: Set running services
      ansible.builtin.set_fact:
        running_services_count: "{{ running_services_count_result.stdout | default('0', true) | trim | int }}"
        running_services: "{{ running_services_result.stdout_lines | default([]) }}"

    # ============================================================
    # REQUIRED SERVICE STATUS
    # ============================================================

    - name: Check required services
      ansible.builtin.shell: |
        if systemctl list-unit-files "{{ item }}.service" >/dev/null 2>&1; then
          if systemctl is-active --quiet "{{ item }}"; then
            echo "RUNNING"
          elif systemctl is-enabled --quiet "{{ item }}" 2>/dev/null; then
            echo "STOPPED"
          else
            echo "NOT_RUNNING"
          fi
        else
          echo "NOT_INSTALLED"
        fi
      args:
        executable: /bin/bash
      loop: "{{ required_services }}"
      register: required_services_result
      changed_when: false
      failed_when: false

    # ============================================================
    # SERVICE COMMAND / PROCESS INFORMATION
    # ============================================================

    - name: Get top CPU consuming processes
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,pcpu,pmem,etime,comm,args \
        --sort=-pcpu | head -16
      args:
        executable: /bin/bash
      register: top_cpu_processes_result
      changed_when: false

    - name: Get top memory consuming processes
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,pcpu,pmem,etime,comm,args \
        --sort=-pmem | head -16
      args:
        executable: /bin/bash
      register: top_memory_processes_result
      changed_when: false

    # ============================================================
    # SAP DETECTION
    # ============================================================

    - name: Check SAPCONTROL availability
      ansible.builtin.shell: |
        if command -v sapcontrol >/dev/null 2>&1; then
          echo "AVAILABLE"
        else
          echo "NOT_AVAILABLE"
        fi
      args:
        executable: /bin/bash
      register: sapcontrol_result
      changed_when: false
      failed_when: false

    - name: Find SAP processes
      ansible.builtin.shell: |
        ps -ef | grep -E \
        '[s]apstartsrv|[s]apstart|[d]isp\+work|[j]2ee|[m]sg_server|[e]nserver|[g]wrd' \
        || true
      args:
        executable: /bin/bash
      register: sap_process_result
      changed_when: false
      failed_when: false

    - name: Determine SAP status
      ansible.builtin.set_fact:
        sap_status: >-
          {{
            'RUNNING'
            if (sap_process_result.stdout | default('') | trim | length) > 0
            else 'NOT_RUNNING'
          }}

    # ============================================================
    # SAPCONTROL PROCESS LIST
    # ============================================================

    - name: Get SAP process list
      ansible.builtin.shell: |
        if command -v sapcontrol >/dev/null 2>&1; then
          sapcontrol -nr "{{ sap_instance }}" -function GetProcessList
        else
          echo "SAPCONTROL_NOT_AVAILABLE"
        fi
      args:
        executable: /bin/bash
      register: sap_process_list_result
      changed_when: false
      failed_when: false
      when: sap_instance | default('') | length > 0

    # ============================================================
    # SSL CERTIFICATE CHECK
    #
    # IMPORTANT:
    # This does NOT use item.name directly.
    # It uses safe dictionary access.
    # ============================================================

    - name: Check SSL certificates
      ansible.builtin.shell: |
        set -o pipefail

        expiry=$(
          echo |
          timeout 10 openssl s_client \
            -connect "{{ item.host | default('') }}:{{ item.port | default(443) }}" \
            -servername "{{ item.host | default('') }}" \
            2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then
          echo "ERROR"
        else
          echo "$expiry"
        fi
      args:
        executable: /bin/bash
      loop: "{{ certificate_checks | default([]) }}"
      register: certificate_results
      changed_when: false
      failed_when: false
      when:
        - item is mapping
        - (item.host | default('') | string | length) > 0

    # ============================================================
    # INITIALIZE CERTIFICATE REPORT
    # ============================================================

    - name: Initialize certificate report
      ansible.builtin.set_fact:
        certificate_report: []

    # ============================================================
    # CALCULATE CERTIFICATE EXPIRY
    # ============================================================

    - name: Calculate certificate expiry
      ansible.builtin.shell: |
        expiry="{{ item.stdout | default('ERROR', true) }}"

        if [ "$expiry" = "ERROR" ] || [ -z "$expiry" ]; then
          echo "ERROR"
          exit 0
        fi

        expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
        now_epoch=$(date +%s)

        if [ "$expiry_epoch" -eq 0 ]; then
          echo "ERROR"
        else
          echo $(( (expiry_epoch - now_epoch) / 86400 ))
        fi
      args:
        executable: /bin/bash
      loop: "{{ certificate_results.results | default([]) }}"
      register: certificate_days_results
      changed_when: false
      failed_when: false
      when:
        - item is mapping

    # ============================================================
    # BUILD CERTIFICATE REPORT
    #
    # SAFE:
    # No item.name assumption.
    # ============================================================

    - name: Build certificate report
      ansible.builtin.set_fact:
        certificate_report: >-
          {{
            certificate_report +
            [
              {
                'name': (
                  certificate_checks[idx].name
                  | default(
                      certificate_checks[idx].host
                      | default('Unknown Certificate')
                    )
                ),
                'host': (
                  certificate_checks[idx].host
                  | default('Unknown')
                ),
                'port': (
                  certificate_checks[idx].port
                  | default(443)
                ),
                'expiry': (
                  item.item.stdout
                  | default('ERROR')
                ),
                'days': (
                  item.stdout
                  | default('ERROR')
                  | trim
                ),
                'status':
                  (
                    'FAIL'
                    if (
                      (item.stdout | default('ERROR') | trim) == 'ERROR'
                      or
                      (item.stdout | default('ERROR') | trim | int) <=
                      (certificate_critical_days | int)
                    )
                    else
                    'WARNING'
                    if
                    (
                      (item.stdout | default('ERROR') | trim | int) <=
                      (certificate_warning_days | int)
                    )
                    else
                    'PASS'
                  )
              }
            ]
          }}
      loop: "{{ certificate_days_results.results | default([]) }}"
      loop_control:
        index_var: idx
      when:
        - item is mapping
        - idx < (certificate_checks | length)

    # ============================================================
    # DETERMINE OVERALL HEALTH
    # ============================================================

    - name: Determine overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'FAIL'
            if
            (
              (cpu_status | default('PASS')) == 'FAIL'
              or
              (memory_status | default('PASS')) == 'FAIL'
              or
              (disk_status | default('PASS')) == 'FAIL'
              or
              (ping_result.failed | default(true))
              or
              (ssh_port_result.failed | default(true))
              or
              (ssh_service_result.stdout | default('STOPPED') | trim) != 'RUNNING'
              or
              (
                certificate_report
                | selectattr('status', 'equalto', 'FAIL')
                | list
                | length
              ) > 0
            )
            else
            'WARNING'
            if
            (
              (cpu_status | default('PASS')) == 'WARNING'
              or
              (memory_status | default('PASS')) == 'WARNING'
              or
              (disk_status | default('PASS')) == 'WARNING'
              or
              (
                certificate_report
                | selectattr('status', 'equalto', 'WARNING')
                | list
                | length
              ) > 0
            )
            else
            'PASS'
          }}

    # ============================================================
    # CLEAN REPORT
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - "Server              : {{ inventory_hostname }}"
          - "Hostname            : {{ hostname_result.stdout | default('Unknown') | trim }}"
          - "OS                  : {{ os_result.stdout | default('Unknown') | trim }}"
          - "Kernel              : {{ kernel_result.stdout | default('Unknown') | trim }}"
          - "Architecture        : {{ arch_result.stdout | default('Unknown') | trim }}"
          - "Overall Health      : {{ overall_health }}"
          - "======================================================================"
          - ""
          - "[ AVAILABILITY ]"
          - "----------------------------------------------------------------------"
          - "Ansible Ping        : {{ 'PASS' if not (ping_result.failed | default(true)) else 'FAIL' }}"
          - "SSH Port 22         : {{ 'PASS' if not (ssh_port_result.failed | default(true)) else 'FAIL' }}"
          - "SSH Service         : {{ ssh_service_result.stdout | default('UNKNOWN') | trim }}"
          - "Uptime              : {{ uptime_formatted | default('Unknown') }}"
          - "======================================================================"
          - ""
          - "[ CPU ]"
          - "----------------------------------------------------------------------"
          - "CPU Quantity        : {{ cpu_quantity | int }} vCPU"
          - "CPU Usage           : {{ (cpu_usage | float) | round(2) }} %"
          - "CPU Status          : {{ cpu_status }}"
          - "======================================================================"
          - ""
          - "[ MEMORY ]"
          - "----------------------------------------------------------------------"
          - "Memory Total        : {{ memory_quantity_mb | int }} MB"
          - "Memory Used         : {{ memory_used_mb | int }} MB"
          - "Memory Usage        : {{ (memory_usage | float) | round(2) }} %"
          - "Memory Status       : {{ memory_status }}"
          - "======================================================================"
          - ""
          - "[ DISK - ROOT ]"
          - "----------------------------------------------------------------------"
          - "Disk Total          : {{ root_disk_total_gb | float | round(2) }} GB"
          - "Disk Used           : {{ root_disk_used_gb | float | round(2) }} GB"
          - "Disk Available      : {{ root_disk_available_gb | float | round(2) }} GB"
          - "Disk Usage          : {{ (root_disk_usage | float) | round(2) }} %"
          - "Disk Status         : {{ disk_status }}"
          - "======================================================================"
          - ""
          - "[ NETWORK INTERFACES ]"
          - "----------------------------------------------------------------------"
          - "{{ network_interfaces_result.stdout | default('No network information') }}"
          - ""
          - "[ NETWORK TRAFFIC - MB SINCE BOOT ]"
          - "----------------------------------------------------------------------"
          - "{{ network_traffic_result.stdout | default('No network traffic information') }}"
          - "======================================================================"
          - ""
          - "[ LOGGED-IN USERS ]"
          - "----------------------------------------------------------------------"
          - "Logged-in User Count : {{ logged_users_count | int }}"
          - "Execution User       : {{ current_user_result.stdout | default('Unknown') | trim }}"
          - "Users:"
          - "{{ logged_users | join('\n') if (logged_users | length) > 0 else 'No interactive users logged in' }}"
          - "======================================================================"
          - ""
          - "[ SERVICES ]"
          - "----------------------------------------------------------------------"
          - "Running Services     : {{ running_services_count | int }}"
          - ""
          - "Required Service Status:"
          - >-
            {{
              required_services_result.results
              | default([])
              | map(attribute='item')
              | list
              | zip(
                  required_services_result.results
                  | default([])
                  | map(attribute='stdout')
                  | map('trim')
                  | list
                )
              | map('join', ' : ')
              | join('\n')
            }}
          - "======================================================================"
          - ""
          - "[ TOP CPU PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ top_cpu_processes_result.stdout | default('No process information') }}"
          - "======================================================================"
          - ""
          - "[ TOP MEMORY PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ top_memory_processes_result.stdout | default('No process information') }}"
          - "======================================================================"
          - ""
          - "[ SAP ]"
          - "----------------------------------------------------------------------"
          - "SAPCONTROL         : {{ sapcontrol_result.stdout | default('UNKNOWN') | trim }}"
          - "SAP Status         : {{ sap_status | default('UNKNOWN') }}"
          - ""
          - "SAP Processes:"
          - "{{ sap_process_result.stdout | default('No SAP processes detected') }}"
          - ""
          - "SAP Instance:"
          - "{{ sap_process_list_result.stdout | default('Not configured / unavailable') }}"
          - "======================================================================"
          - ""
          - "[ SSL CERTIFICATES ]"
          - "----------------------------------------------------------------------"
          - >-
            {{
              certificate_report
              | map(attribute='name')
              | list
              | zip(
                  certificate_report
                  | map(attribute='host')
                  | list,
                  certificate_report
                  | map(attribute='port')
                  | list,
                  certificate_report
                  | map(attribute='expiry')
                  | list,
                  certificate_report
                  | map(attribute='days')
                  | list,
                  certificate_report
                  | map(attribute='status')
                  | list
                )
              | list
            }}
          - "======================================================================"
          - ""
          - "                    END OF HEALTH CHECK"
          - "======================================================================"

    # ============================================================
    # OPTIONAL MACHINE-READABLE SUMMARY
    # ============================================================

    - name: Export health summary as fact
      ansible.builtin.set_fact:
        linux_health_summary:
          server: "{{ inventory_hostname }}"
          hostname: "{{ hostname_result.stdout | default('Unknown') | trim }}"
          overall_health: "{{ overall_health }}"
          cpu:
            quantity: "{{ cpu_quantity | int }}"
            usage_percent: "{{ cpu_usage | float | round(2) }}"
            status: "{{ cpu_status }}"
          memory:
            total_mb: "{{ memory_quantity_mb | int }}"
            used_mb: "{{ memory_used_mb | int }}"
            usage_percent: "{{ memory_usage | float | round(2) }}"
            status: "{{ memory_status }}"
          disk:
            total_gb: "{{ root_disk_total_gb | float | round(2) }}"
            used_gb: "{{ root_disk_used_gb | float | round(2) }}"
            available_gb: "{{ root_disk_available_gb | float | round(2) }}"
            usage_percent: "{{ root_disk_usage | float | round(2) }}"
            status: "{{ disk_status }}"
          uptime: "{{ uptime_formatted }}"
          ssh:
            port: "{{ 'PASS' if not (ssh_port_result.failed | default(true)) else 'FAIL' }}"
            service: "{{ ssh_service_result.stdout | default('UNKNOWN') | trim }}"
          logged_in_users: "{{ logged_users_count | int }}"
          running_services: "{{ running_services_count | int }}"
          sap_status: "{{ sap_status | default('UNKNOWN') }}"
          certificates: "{{ certificate_report }}"
