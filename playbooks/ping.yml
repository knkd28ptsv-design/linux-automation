---
- name: Complete Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ============================================================
    # HEALTH THRESHOLDS
    # ============================================================

    cpu_warning: 80
    cpu_critical: 90

    memory_warning: 80
    memory_critical: 90

    disk_warning: 80
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 15


    # ============================================================
    # IMPORTANT SERVICES
    #
    # Change/add services according to your environment.
    # ============================================================

    important_services:
      - ssh
      - docker
      - containerd
      - kubelet


    # ============================================================
    # SAP CONFIGURATION
    #
    # For a non-SAP server:
    #
    # sap_enabled: false
    #
    # For an SAP server:
    #
    # sap_enabled: true
    # sap_sid: "PRD"
    # sap_instance_number: "00"
    # ============================================================

    sap_enabled: false

    sap_sid: "PRD"

    sap_instance_number: "00"


    # ============================================================
    # SSL CERTIFICATE CONFIGURATION
    #
    # Add more certificates if required.
    #
    # Example:
    #
    # - name: "SAP HTTPS"
    #   host: "10.15.4.90"
    #   port: 443
    #
    # ============================================================

    certificate_enabled: true

    certificate_endpoints:

      - name: "Local HTTPS"
        host: "10.15.4.90"
        port: 443


  tasks:

    # ============================================================
    # 1. ANSIBLE CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false


    # ============================================================
    # 2. SERVER INFORMATION
    # ============================================================

    - name: Set server information
      ansible.builtin.set_fact:

        server_ip: >-
          {{ ansible_default_ipv4.address | default(inventory_hostname) }}

        server_interface: >-
          {{ ansible_default_ipv4.interface | default('N/A') }}

        server_gateway: >-
          {{ ansible_default_ipv4.gateway | default('N/A') }}


    # ============================================================
    # 3. SSH PORT 22
    # ============================================================

    - name: Check SSH port 22
      ansible.builtin.wait_for:

        host: "{{ server_ip }}"

        port: 22

        timeout: 5

        state: started

      delegate_to: localhost

      become: false

      register: ssh_result

      changed_when: false

      failed_when: false


    # ============================================================
    # 4. UPTIME
    # ============================================================

    - name: Calculate server uptime
      ansible.builtin.set_fact:

        uptime_seconds: "{{ ansible_uptime_seconds | int }}"

        uptime_days: >-
          {{ ((ansible_uptime_seconds | int) / 86400) | int }}

        uptime_hours: >-
          {{ (((ansible_uptime_seconds | int) % 86400) / 3600) | int }}

        uptime_minutes: >-
          {{ (((ansible_uptime_seconds | int) % 3600) / 60) | int }}


    # ============================================================
    # 5. CPU QUANTITY
    # ============================================================

    - name: Get CPU information
      ansible.builtin.set_fact:

        cpu_cores: "{{ ansible_processor_vcpus | default(0) | int }}"

        cpu_threads: "{{ ansible_processor_nproc | default(0) | int }}"

        cpu_model: >-
          {{ ansible_processor[2] | default('Unknown') }}


    # ============================================================
    # 6. CPU USAGE
    # ============================================================

    - name: Collect CPU usage
      ansible.builtin.shell: |

        read -r _ user nice system idle iowait irq softirq steal guest guest_nice < /proc/stat

        total1=$((user+nice+system+idle+iowait+irq+softirq+steal))

        idle1=$((idle+iowait))

        sleep 1

        read -r _ user nice system idle iowait irq softirq steal guest guest_nice < /proc/stat

        total2=$((user+nice+system+idle+iowait+irq+softirq+steal))

        idle2=$((idle+iowait))

        total_delta=$((total2-total1))

        idle_delta=$((idle2-idle1))

        if [ "$total_delta" -gt 0 ]; then

          awk -v total="$total_delta" -v idle="$idle_delta" '
          BEGIN {
            printf "%.2f", (1 - idle/total) * 100
          }'

        else

          echo "0.00"

        fi

      args:
        executable: /bin/bash

      register: cpu_usage_result

      changed_when: false


    # ============================================================
    # 7. CPU NUMERIC VALUE
    # ============================================================

    - name: Set CPU usage numeric value
      ansible.builtin.set_fact:

        cpu_usage: >-
          {{ cpu_usage_result.stdout | trim | float }}


    # ============================================================
    # 8. CPU LOAD
    # ============================================================

    - name: Get CPU load
      ansible.builtin.set_fact:

        load_1m: >-
          {{ ansible_loadavg['1m'] | default(0) | float }}

        load_5m: >-
          {{ ansible_loadavg['5m'] | default(0) | float }}

        load_15m: >-
          {{ ansible_loadavg['15m'] | default(0) | float }}


    # ============================================================
    # 9. CPU STATUS
    # ============================================================

    - name: Determine CPU status
      ansible.builtin.set_fact:

        cpu_status: >-

          {{
            'FAIL'

            if (cpu_usage | float) >= (cpu_critical | float)

            else

            'WARNING'

            if (cpu_usage | float) >= (cpu_warning | float)

            else

            'PASS'
          }}


    # ============================================================
    # 10. MEMORY INFORMATION
    # ============================================================

    - name: Calculate memory information
      ansible.builtin.set_fact:

        memory_total_mb: >-
          {{ ansible_memtotal_mb | default(0) | int }}

        memory_available_mb: >-
          {{
            ansible_memory_mb.real.available
            | default(ansible_memory_mb.real.free)
            | default(0)
            | int
          }}

        memory_used_mb: >-
          {{
            (
              (ansible_memtotal_mb | default(0) | int)
              -
              (
                ansible_memory_mb.real.available
                | default(ansible_memory_mb.real.free)
                | default(0)
                | int
              )
            )
            | int
          }}

        memory_used_percent: >-
          {{
            (
              (
                (ansible_memtotal_mb | default(0) | float)
                -
                (
                  ansible_memory_mb.real.available
                  | default(ansible_memory_mb.real.free)
                  | default(0)
                  | float
                )
              )
              /
              (
                ansible_memtotal_mb
                | default(1)
                | float
              )
              *
              100
            )
            | float
            | round(2)
          }}


    # ============================================================
    # 11. MEMORY STATUS
    # ============================================================

    - name: Determine memory status
      ansible.builtin.set_fact:

        memory_status: >-

          {{
            'FAIL'

            if (memory_used_percent | float) >= (memory_critical | float)

            else

            'WARNING'

            if (memory_used_percent | float) >= (memory_warning | float)

            else

            'PASS'
          }}


    # ============================================================
    # 12. ROOT DISK USAGE
    # ============================================================

    - name: Get root filesystem usage
      ansible.builtin.shell: |

        df -Pk / |
        awk 'NR==2 {
          gsub("%","",$5);
          printf "%s|%s|%s|%s\n",$2,$3,$4,$5
        }'

      args:
        executable: /bin/bash

      register: root_disk_result

      changed_when: false


    # ============================================================
    # 13. ROOT DISK NUMERIC VALUES
    # ============================================================

    - name: Set root disk numeric values
      ansible.builtin.set_fact:

        root_disk_total_kb: >-
          {{ root_disk_result.stdout.split('|')[0] | trim | int }}

        root_disk_used_kb: >-
          {{ root_disk_result.stdout.split('|')[1] | trim | int }}

        root_disk_free_kb: >-
          {{ root_disk_result.stdout.split('|')[2] | trim | int }}

        disk_usage: >-
          {{ root_disk_result.stdout.split('|')[3] | trim | float }}


    # ============================================================
    # 14. DISK STATUS
    # ============================================================

    - name: Determine disk status
      ansible.builtin.set_fact:

        disk_status: >-

          {{
            'FAIL'

            if (disk_usage | float) >= (disk_critical | float)

            else

            'WARNING'

            if (disk_usage | float) >= (disk_warning | float)

            else

            'PASS'
          }}


    # ============================================================
    # 15. ALL FILESYSTEMS
    # ============================================================

    - name: Get all filesystem usage
      ansible.builtin.shell: |

        df -P \
          -x tmpfs \
          -x devtmpfs \
          -x overlay |
        awk 'NR > 1 {
          gsub("%","",$5);
          print $1 "|" $2 "|" $3 "|" $4 "|" $5 "|" $6
        }'

      args:
        executable: /bin/bash

      register: disk_result

      changed_when: false


    # ============================================================
    # 16. BUILD DISK REPORT
    # ============================================================

    - name: Build filesystem report
      ansible.builtin.set_fact:

        disk_report: >-

          {%- set disks = [] -%}

          {%- for line in disk_result.stdout_lines | default([]) -%}

            {%- set fields = line.split('|') -%}

            {%- if fields | length >= 6 -%}

              {%- set item = {
                'filesystem': fields[0],
                'total_kb': fields[1] | int,
                'used_kb': fields[2] | int,
                'free_kb': fields[3] | int,
                'usage_percent': fields[4] | float,
                'mount': fields[5]
              } -%}

              {%- set _ = disks.append(item) -%}

            {%- endif -%}

          {%- endfor -%}

          {{ disks }}


    # ============================================================
    # 17. NETWORK TRAFFIC
    # ============================================================

    - name: Get network traffic counters
      ansible.builtin.shell: |

        awk '

        NR > 2 {

          gsub(":", "", $1);

          if ($1 != "lo") {

            rx += $2;

            tx += $10;

          }

        }

        END {

          printf "%.0f %.0f\n", rx+0, tx+0

        }' /proc/net/dev

      args:
        executable: /bin/bash

      register: network_traffic

      changed_when: false


    # ============================================================
    # 18. NETWORK NUMERIC VALUES
    # ============================================================

    - name: Set network traffic values
      ansible.builtin.set_fact:

        network_rx_bytes: >-
          {{ network_traffic.stdout.split()[0] | default('0') | trim | int }}

        network_tx_bytes: >-
          {{ network_traffic.stdout.split()[1] | default('0') | trim | int }}


    # ============================================================
    # 19. NETWORK STATUS
    # ============================================================

    - name: Get default route
      ansible.builtin.command:

        cmd: ip route show default

      register: default_route

      changed_when: false

      failed_when: false


    - name: Determine network status
      ansible.builtin.set_fact:

        network_status: >-

          {{
            'PASS'

            if
            (
              (server_ip | string | length) > 0
              and
              (default_route.stdout | trim | length) > 0
            )

            else
            'FAIL'
          }}


    # ============================================================
    # 20. CURRENTLY LOGGED-IN USERS
    # ============================================================

    - name: Get logged-in users
      ansible.builtin.shell: |

        who

      args:
        executable: /bin/bash

      register: logged_in_users

      changed_when: false

      failed_when: false


    # ============================================================
    # 21. LOGGED-IN USER COUNT
    # ============================================================

    - name: Get logged-in user count
      ansible.builtin.shell: |

        who | wc -l

      args:
        executable: /bin/bash

      register: logged_user_count

      changed_when: false

      failed_when: false


    - name: Set logged-in user count
      ansible.builtin.set_fact:

        logged_in_user_count: >-
          {{ logged_user_count.stdout | trim | int }}


    # ============================================================
    # 22. ALL LINUX USERS
    # ============================================================

    - name: Get Linux users
      ansible.builtin.getent:

        database: passwd

      register: linux_users


    - name: Calculate Linux user count
      ansible.builtin.set_fact:

        linux_user_count: >-
          {{ ansible_facts.getent_passwd | default({}) | length | int }}


    # ============================================================
    # 23. RUNNING SERVICES COUNT
    # ============================================================

    - name: Get running services
      ansible.builtin.shell: |

        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager

      args:
        executable: /bin/bash

      register: running_services

      changed_when: false

      failed_when: false


    - name: Calculate running service count
      ansible.builtin.set_fact:

        running_service_count: >-
          {{ running_services.stdout_lines | default([]) | length | int }}


    # ============================================================
    # 24. IMPORTANT SERVICES
    # ============================================================

    - name: Check important services
      ansible.builtin.command:

        cmd: "systemctl is-active {{ item }}"

      loop: "{{ important_services }}"

      register: important_service_results

      changed_when: false

      failed_when: false


    # ============================================================
    # 25. IMPORTANT SERVICE STATUS
    # ============================================================

    - name: Determine important service status
      ansible.builtin.set_fact:

        important_services_status: >-

          {{
            'PASS'

            if
            (
              important_service_results.results
              |
              selectattr('stdout', 'equalto', 'active')
              |
              list
              |
              length
              ==
              important_services | length
            )

            else
            'FAIL'
          }}


    # ============================================================
    # 26. SERVICE DETAILS
    # ============================================================

    - name: Get important service details
      ansible.builtin.shell: |

        service="{{ item.item }}"

        status="{{ item.stdout | default('unknown') | trim }}"

        enabled=$(systemctl is-enabled "$service" 2>/dev/null || echo "unknown")

        pid=$(systemctl show "$service" \
          -p MainPID \
          --value 2>/dev/null || echo "0")

        echo "${service}|${status}|${enabled}|${pid}"

      args:
        executable: /bin/bash

      loop: "{{ important_service_results.results }}"

      register: important_service_details

      changed_when: false

      failed_when: false


    # ============================================================
    # 27. SAPCONTROL CHECK
    # ============================================================

    - name: Check SAPCONTROL executable
      ansible.builtin.stat:

        path: "/usr/sap/{{ sap_sid }}/SYS/exe/uc/linuxx86_64/sapcontrol"

      register: sapcontrol_file

      when: sap_enabled


    # ============================================================
    # 28. SAP PROCESS LIST
    # ============================================================

    - name: Get SAP process list
      ansible.builtin.command:

        cmd: >
          /usr/sap/{{ sap_sid }}/SYS/exe/uc/linuxx86_64/sapcontrol
          -nr {{ sap_instance_number }}
          -function GetProcessList

      register: sap_process_result

      changed_when: false

      failed_when: false

      when:
        - sap_enabled
        - sapcontrol_file.stat.exists


    # ============================================================
    # 29. SAP PROCESS STATUS
    # ============================================================

    - name: Determine SAP process status
      ansible.builtin.set_fact:

        sap_status: >-

          {{
            'PASS'

            if
            (
              (sap_process_result.rc | default(1) | int) == 0
              and
              'GREEN' in (sap_process_result.stdout | default(''))
            )

            else
            'FAIL'
          }}

      when:
        - sap_enabled
        - sap_process_result is defined


    # ============================================================
    # 30. SAP SYSTEM INSTANCE LIST
    # ============================================================

    - name: Get SAP system instance list
      ansible.builtin.command:

        cmd: >
          /usr/sap/{{ sap_sid }}/SYS/exe/uc/linuxx86_64/sapcontrol
          -nr {{ sap_instance_number }}
          -function GetSystemInstanceList

      register: sap_system_result

      changed_when: false

      failed_when: false

      when:
        - sap_enabled
        - sapcontrol_file.stat.exists


    # ============================================================
    # 31. SAP SYSTEM STATUS
    # ============================================================

    - name: Determine SAP system status
      ansible.builtin.set_fact:

        sap_system_status: >-

          {{
            'PASS'

            if
            (
              (sap_system_result.rc | default(1) | int) == 0
              and
              'GREEN' in (sap_system_result.stdout | default(''))
            )

            else
            'FAIL'
          }}

      when:
        - sap_enabled
        - sap_system_result is defined


    # ============================================================
    # 32. SAP DISABLED
    # ============================================================

    - name: Set SAP status when disabled
      ansible.builtin.set_fact:

        sap_status: "N/A"

        sap_system_status: "N/A"

      when: not sap_enabled


    # ============================================================
    # 33. SAPCONTROL MISSING
    # ============================================================

    - name: Set SAP status when SAPCONTROL is missing
      ansible.builtin.set_fact:

        sap_status: "FAIL"

        sap_system_status: "FAIL"

      when:
        - sap_enabled
        - sapcontrol_file is defined
        - not sapcontrol_file.stat.exists


    # ============================================================
    # 34. SSL CERTIFICATE CHECK
    # ============================================================

    - name: Check SSL certificate expiry
      ansible.builtin.shell: |

        set -o pipefail

        expiry=$(
          echo |
          openssl s_client \
            -connect "{{ item.host }}:{{ item.port }}" \
            -servername "{{ item.host }}" \
            2>/dev/null |
          openssl x509 \
            -noout \
            -enddate \
            2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then

          echo "ERROR"

        else

          echo "$expiry"

        fi

      args:
        executable: /bin/bash

      loop: "{{ certificate_endpoints }}"

      register: certificate_results

      changed_when: false

      failed_when: false

      when: certificate_enabled


    # ============================================================
    # 35. CERTIFICATE DAYS REMAINING
    # ============================================================

    - name: Calculate certificate expiry days
      ansible.builtin.shell: |

        expiry="{{ item.stdout | trim }}"

        if [ -z "$expiry" ] || [ "$expiry" = "ERROR" ]; then

          echo "ERROR"

          exit 0

        fi

        expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null)

        if [ -z "$expiry_epoch" ]; then

          echo "ERROR"

          exit 0

        fi

        now_epoch=$(date +%s)

        days=$(( (expiry_epoch - now_epoch) / 86400 ))

        echo "$days"

      args:
        executable: /bin/bash

      loop: "{{ certificate_results.results | default([]) }}"

      register: certificate_days_results

      changed_when: false

      failed_when: false

      when: certificate_enabled


    # ============================================================
    # 36. CERTIFICATE STATUS
    # ============================================================

    - name: Determine certificate status
      ansible.builtin.set_fact:

        certificate_status: >-

          {%- set ns = namespace(status='PASS') -%}

          {%- for cert in certificate_days_results.results | default([]) -%}

            {%- set days = cert.stdout | default('ERROR') | trim -%}

            {%- if days == 'ERROR' or days == '' -%}

              {%- set ns.status = 'FAIL' -%}

            {%- elif (days | int) <= (certificate_critical_days | int) -%}

              {%- set ns.status = 'FAIL' -%}

            {%- elif (days | int) <= (certificate_warning_days | int) -%}

              {%- if ns.status != 'FAIL' -%}

                {%- set ns.status = 'WARNING' -%}

              {%- endif -%}

            {%- endif -%}

          {%- endfor -%}

          {{ ns.status }}

      when: certificate_enabled


    # ============================================================
    # 37. CERTIFICATE DISABLED
    # ============================================================

    - name: Set certificate status when disabled
      ansible.builtin.set_fact:

        certificate_status: "N/A"

      when: not certificate_enabled


    # ============================================================
    # 38. BUILD CLEAN CERTIFICATE REPORT
    # ============================================================

    - name: Build clean certificate report
      ansible.builtin.set_fact:

        clean_certificate_report: >-

          {%- set ns = namespace(lines=[]) -%}

          {%- for cert in certificate_results.results | default([]) -%}

            {%- set cert_name = cert.item.name | default('Unknown') -%}

            {%- set cert_host = cert.item.host | default('Unknown') -%}

            {%- set cert_port = cert.item.port | default('Unknown') -%}

            {%- set expiry = cert.stdout | default('UNKNOWN') | trim -%}

            {%- set days = 'UNKNOWN' -%}

            {%- for d in certificate_days_results.results | default([]) -%}

              {%- if d.item.item.name | default('') == cert_name -%}

                {%- set days = d.stdout | default('UNKNOWN') | trim -%}

              {%- endif -%}

            {%- endfor -%}

            {%- if days == 'ERROR' or days == 'UNKNOWN' or days == '' -%}

              {%- set status = 'FAIL' -%}

            {%- elif (days | int) <= (certificate_critical_days | int) -%}

              {%- set status = 'FAIL' -%}

            {%- elif (days | int) <= (certificate_warning_days | int) -%}

              {%- set status = 'WARNING' -%}

            {%- else -%}

              {%- set status = 'PASS' -%}

            {%- endif -%}

            {%- set _ = ns.lines.append(
              'Name           : ' ~ cert_name
            ) -%}

            {%- set _ = ns.lines.append(
              'Host           : ' ~ cert_host
            ) -%}

            {%- set _ = ns.lines.append(
              'Port           : ' ~ (cert_port | string)
            ) -%}

            {%- set _ = ns.lines.append(
              'Expiry         : ' ~ expiry
            ) -%}

            {%- set _ = ns.lines.append(
              'Days Remaining : ' ~ days
            ) -%}

            {%- set _ = ns.lines.append(
              'Status         : ' ~ status
            ) -%}

          {%- endfor -%}

          {{ ns.lines }}


    # ============================================================
    # 39. BUILD CLEAN SERVICE REPORT
    # ============================================================

    - name: Build clean service report
      ansible.builtin.set_fact:

        clean_service_report: >-

          {%- set ns = namespace(lines=[]) -%}

          {%- for svc in important_service_details.results | default([]) -%}

            {%- set fields = svc.stdout.split('|') -%}

            {%- if fields | length >= 4 -%}

              {%- set _ = ns.lines.append(
                fields[0] ~
                ' : ' ~
                fields[1] ~
                ' | Enabled: ' ~
                fields[2] ~
                ' | PID: ' ~
                fields[3]
              ) -%}

            {%- endif -%}

          {%- endfor -%}

          {{ ns.lines }}


    # ============================================================
    # 40. NETWORK STATUS
    # ============================================================

    - name: Build clean network report
      ansible.builtin.set_fact:

        network_rx_gb: >-
          {{
            (
              (network_rx_bytes | int)
              /
              1024
              /
              1024
              /
              1024
            )
            | float
            | round(2)
          }}

        network_tx_gb: >-
          {{
            (
              (network_tx_bytes | int)
              /
              1024
              /
              1024
              /
              1024
            )
            | float
            | round(2)
          }}


    # ============================================================
    # 41. OVERALL HEALTH
    # ============================================================

    - name: Determine overall health
      ansible.builtin.set_fact:

        overall_status: >-

          {{
            'FAIL'

            if
            (
              ping_result.failed
              or
              ssh_result.failed
              or
              cpu_status == 'FAIL'
              or
              memory_status == 'FAIL'
              or
              disk_status == 'FAIL'
              or
              network_status == 'FAIL'
              or
              important_services_status == 'FAIL'
              or
              (
                sap_enabled
                and
                sap_status == 'FAIL'
              )
              or
              (
                sap_enabled
                and
                sap_system_status == 'FAIL'
              )
              or
              (
                certificate_enabled
                and
                certificate_status == 'FAIL'
              )
            )

            else

            'WARNING'

            if
            (
              cpu_status == 'WARNING'
              or
              memory_status == 'WARNING'
              or
              disk_status == 'WARNING'
              or
              (
                certificate_enabled
                and
                certificate_status == 'WARNING'
              )
            )

            else

            'PASS'
          }}


    # ============================================================
    # 42. FINAL CLEAN AWX REPORT
    #
    # This is the ONLY detailed debug report.
    # It prevents AWX from displaying the raw registered variables.
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:

        msg:

          - ""

          - "============================================================"

          - "              LINUX SERVER HEALTH CHECK"

          - "============================================================"

          - "Server        : {{ server_ip }}"

          - "Hostname      : {{ ansible_hostname }}"

          - "Inventory     : {{ inventory_hostname }}"

          - >-
            OS            :
            {{ ansible_distribution }}
            {{ ansible_distribution_version }}

          - "Kernel        : {{ ansible_kernel }}"

          - "Architecture  : {{ ansible_architecture }}"

          - "============================================================"

          - "[ AVAILABILITY ]"

          - "------------------------------------------------------------"

          - >-
            Ansible Ping  :
            {{ 'PASS' if not ping_result.failed else 'FAIL' }}

          - >-
            SSH Port 22   :
            {{ 'PASS' if not ssh_result.failed else 'FAIL' }}

          - >-
            Uptime        :
            {{ uptime_days }} days
            {{ uptime_hours }} hours
            {{ uptime_minutes }} minutes

          - "============================================================"

          - "[ CPU ]"

          - "------------------------------------------------------------"

          - "CPU Model     : {{ cpu_model }}"

          - "CPU Quantity  : {{ cpu_cores | int }} cores"

          - "CPU Threads   : {{ cpu_threads | int }}"

          - >-
            CPU Usage     :
            {{ cpu_usage | float | round(2) }} %

          - >-
            Load 1m       :
            {{ load_1m | float | round(2) }}

          - >-
            Load 5m       :
            {{ load_5m | float | round(2) }}

          - >-
            Load 15m      :
            {{ load_15m | float | round(2) }}

          - "CPU Status    : {{ cpu_status }}"

          - "============================================================"

          - "[ MEMORY ]"

          - "------------------------------------------------------------"

          - >-
            Total         :
            {{ memory_total_mb | int }} MB

          - >-
            Used          :
            {{ memory_used_mb | int }} MB

          - >-
            Available     :
            {{ memory_available_mb | int }} MB

          - >-
            Usage         :
            {{ memory_used_percent | float | round(2) }} %

          - "Memory Status : {{ memory_status }}"

          - "============================================================"

          - "[ DISK ]"

          - "------------------------------------------------------------"

          - >-
            Root Total    :
            {{
              (
                (root_disk_total_kb | int)
                / 1024
                / 1024
              )
              | float
              | round(2)
            }} GB

          - >-
            Root Used     :
            {{
              (
                (root_disk_used_kb | int)
                / 1024
                / 1024
              )
              | float
              | round(2)
            }} GB

          - >-
            Root Free     :
            {{
              (
                (root_disk_free_kb | int)
                / 1024
                / 1024
              )
              | float
              | round(2)
            }} GB

          - >-
            Root Usage    :
            {{ disk_usage | float | round(2) }} %

          - "Disk Status   : {{ disk_status }}"

          - "============================================================"

          - "[ FILESYSTEMS ]"

          - "------------------------------------------------------------"

          - >-
            {{
              disk_report
              | map(
                  attribute='mount'
                )
              | list
              | join(', ')
            }}

          - "============================================================"

          - "[ NETWORK ]"

          - "------------------------------------------------------------"

          - "Interface     : {{ server_interface }}"

          - "IP Address    : {{ server_ip }}"

          - "Gateway       : {{ server_gateway }}"

          - "RX Traffic    : {{ network_rx_gb }} GB"

          - "TX Traffic    : {{ network_tx_gb }} GB"

          - "Network Status: {{ network_status }}"

          - "============================================================"

          - "[ USERS ]"

          - "------------------------------------------------------------"

          - "Linux Users   : {{ linux_user_count | int }}"

          - "Logged In     : {{ logged_in_user_count | int }}"

          - >-
            Logged Users  :
            {{
              logged_in_users.stdout_lines
              if (logged_in_users.stdout_lines | length > 0)
              else ['None']
            }}

          - "============================================================"

          - "[ SERVICES ]"

          - "------------------------------------------------------------"

          - "Running Count : {{ running_service_count | int }}"

          - "Important Services:"

          - "{{ clean_service_report }}"

          - "Service Status: {{ important_services_status }}"

          - "============================================================"

          - "[ SAP ]"

          - "------------------------------------------------------------"

          - "SAP Enabled   : {{ sap_enabled }}"

          - "SAP SID       : {{ sap_sid if sap_enabled else 'N/A' }}"

          - "SAP Instance  : {{ sap_instance_number if sap_enabled else 'N/A' }}"

          - >-
            SAP Process  :
            {{ sap_status | default('N/A') }}

          - >-
            SAP System   :
            {{ sap_system_status | default('N/A') }}

          - "============================================================"

          - "[ CERTIFICATES ]"

          - "------------------------------------------------------------"

          - "Certificate Status: {{ certificate_status }}"

          - "Warning Days      : {{ certificate_warning_days }}"

          - "Critical Days     : {{ certificate_critical_days }}"

          - "{{ clean_certificate_report }}"

          - "============================================================"

          - "[ OVERALL HEALTH ]"

          - "------------------------------------------------------------"

          - "OVERALL STATUS : {{ overall_status }}"

          - "============================================================"

          - ""
