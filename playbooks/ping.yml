---
- name: Linux Server Complete Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:
    cpu_warning: 80
    cpu_critical: 90

    memory_warning: 80
    memory_critical: 90

    disk_warning: 80
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 7

    ssh_port: 22

    # Change these if required
    certificate_host: "{{ ansible_host | default(inventory_hostname) }}"
    certificate_port: 443

    # SAP detection
    sap_enabled: true

  tasks:

    # ============================================================
    # BASIC INFORMATION
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false

    - name: Collect hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Collect OS information
      ansible.builtin.shell: |
        . /etc/os-release
        echo "${PRETTY_NAME}"
      args:
        executable: /bin/bash
      register: os_result
      changed_when: false

    - name: Collect kernel
      ansible.builtin.command: uname -r
      register: kernel_result
      changed_when: false

    - name: Collect architecture
      ansible.builtin.command: uname -m
      register: architecture_result
      changed_when: false


    # ============================================================
    # SSH
    # ============================================================

    - name: Check SSH port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ssh_port }}"
        timeout: 5
        state: started
      delegate_to: localhost
      become: false
      register: ssh_port_result
      changed_when: false
      failed_when: false

    - name: Check SSH service
      ansible.builtin.shell: |
        systemctl is-active ssh 2>/dev/null ||
        systemctl is-active sshd 2>/dev/null ||
        echo inactive
      args:
        executable: /bin/bash
      register: ssh_service_result
      changed_when: false
      failed_when: false


    # ============================================================
    # UPTIME
    # ============================================================

    - name: Get uptime seconds
      ansible.builtin.shell: |
        awk '{print int($1)}' /proc/uptime
      args:
        executable: /bin/bash
      register: uptime_result
      changed_when: false

    - name: Convert uptime to integer
      ansible.builtin.set_fact:
        uptime_seconds: "{{ uptime_result.stdout | default('0') | trim | int }}"

    - name: Format uptime
      ansible.builtin.set_fact:
        uptime_formatted: >-
          {{
            (uptime_seconds // 86400) | int
          }} days
          {{
            ((uptime_seconds % 86400) // 3600) | int
          }} hours
          {{
            ((uptime_seconds % 3600) // 60) | int
          }} minutes


    # ============================================================
    # CPU
    # ============================================================

    - name: Collect CPU count
      ansible.builtin.shell: |
        nproc
      args:
        executable: /bin/bash
      register: cpu_count_result
      changed_when: false

    - name: Collect CPU usage
      ansible.builtin.shell: |
        top -bn2 | grep "Cpu(s)" | tail -1 |
        awk '{print 100 - $8}'
      args:
        executable: /bin/bash
      register: cpu_usage_result
      changed_when: false

    - name: Set CPU values
      ansible.builtin.set_fact:
        cpu_count: "{{ cpu_count_result.stdout | default('0') | trim | int }}"
        cpu_usage: "{{ cpu_usage_result.stdout | default('0') | trim | float }}"

    - name: Determine CPU status
      ansible.builtin.set_fact:
        cpu_status: >-
          {{
            'FAIL'
            if (cpu_usage | float) >= (cpu_critical | float)
            else
            'WARNING'
            if (cpu_usage | float) >= (cpu_warning | float)
            else
            'PASS'
          }}


    # ============================================================
    # MEMORY
    # ============================================================

    - name: Collect memory information
      ansible.builtin.shell: |
        free -m | awk '/^Mem:/ {
          total=$2;
          used=$3;
          available=$7;
          if (total > 0)
            usage=(used/total)*100;
          else
            usage=0;
          printf "%d %.2f %.2f\n", total, used, usage
        }'
      args:
        executable: /bin/bash
      register: memory_result
      changed_when: false

    - name: Set memory values
      ansible.builtin.set_fact:
        memory_total_mb: "{{ (memory_result.stdout.split()[0] | default('0')) | int }}"
        memory_used_mb: "{{ (memory_result.stdout.split()[1] | default('0')) | int }}"
        memory_usage: "{{ (memory_result.stdout.split()[2] | default('0')) | float }}"

    - name: Determine memory status
      ansible.builtin.set_fact:
        memory_status: >-
          {{
            'FAIL'
            if (memory_usage | float) >= (memory_critical | float)
            else
            'WARNING'
            if (memory_usage | float) >= (memory_warning | float)
            else
            'PASS'
          }}


    # ============================================================
    # DISK
    # ============================================================

    - name: Collect root disk information
      ansible.builtin.shell: |
        df -Pk / | awk 'NR==2 {
          gsub("%","",$5);
          print $2, $3, $4, $5
        }'
      args:
        executable: /bin/bash
      register: disk_result
      changed_when: false

    - name: Set disk values
      ansible.builtin.set_fact:
        disk_total_kb: "{{ (disk_result.stdout.split()[0] | default('0')) | int }}"
        disk_used_kb: "{{ (disk_result.stdout.split()[1] | default('0')) | int }}"
        disk_available_kb: "{{ (disk_result.stdout.split()[2] | default('0')) | int }}"
        disk_usage: "{{ (disk_result.stdout.split()[3] | default('0')) | float }}"

    - name: Calculate disk quantities
      ansible.builtin.set_fact:
        disk_total_gb: "{{ ((disk_total_kb | float) / 1024 / 1024) | round(2) }}"
        disk_used_gb: "{{ ((disk_used_kb | float) / 1024 / 1024) | round(2) }}"
        disk_available_gb: "{{ ((disk_available_kb | float) / 1024 / 1024) | round(2) }}"

    - name: Determine disk status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'FAIL'
            if (disk_usage | float) >= (disk_critical | float)
            else
            'WARNING'
            if (disk_usage | float) >= (disk_warning | float)
            else
            'PASS'
          }}


    # ============================================================
    # NETWORK
    # ============================================================

    - name: Collect network interfaces
      ansible.builtin.shell: |
        ip -br addr
      args:
        executable: /bin/bash
      register: network_interfaces_result
      changed_when: false

    - name: Collect network statistics
      ansible.builtin.shell: |
        awk '
        BEGIN {
          rx=0;
          tx=0;
        }
        /^[[:space:]]*[a-zA-Z0-9_.:-]+:/ &&
        $1 !~ /^(lo|docker|cni|flannel|veth)/ {
          gsub(":","",$1);
          rx += $2;
          tx += $10;
        }
        END {
          printf "%.0f %.0f\n", rx, tx
        }' /proc/net/dev
      args:
        executable: /bin/bash
      register: network_stats_result
      changed_when: false
      failed_when: false

    - name: Set network values
      ansible.builtin.set_fact:
        network_rx_bytes: "{{ (network_stats_result.stdout.split()[0] | default('0')) | int }}"
        network_tx_bytes: "{{ (network_stats_result.stdout.split()[1] | default('0')) | int }}"

    - name: Calculate network traffic
      ansible.builtin.set_fact:
        network_rx_gb: "{{ ((network_rx_bytes | float) / 1024 / 1024 / 1024) | round(2) }}"
        network_tx_gb: "{{ ((network_tx_bytes | float) / 1024 / 1024 / 1024) | round(2) }}"


    # ============================================================
    # LOGGED-IN USERS
    # ============================================================

    - name: Get logged in users
      ansible.builtin.shell: |
        who
      args:
        executable: /bin/bash
      register: logged_users_result
      changed_when: false
      failed_when: false

    - name: Count logged in users
      ansible.builtin.shell: |
        who | wc -l
      args:
        executable: /bin/bash
      register: logged_users_count_result
      changed_when: false
      failed_when: false

    - name: Set logged in user values
      ansible.builtin.set_fact:
        logged_users_count: "{{ logged_users_count_result.stdout | default('0') | trim | int }}"
        logged_users: "{{ logged_users_result.stdout_lines | default([]) }}"


    # ============================================================
    # ALL LINUX USERS
    # ============================================================

    - name: Get Linux users
      ansible.builtin.shell: |
        awk -F: '{print $1}' /etc/passwd
      args:
        executable: /bin/bash
      register: linux_users_result
      changed_when: false

    - name: Set Linux user list
      ansible.builtin.set_fact:
        linux_users: "{{ linux_users_result.stdout_lines | default([]) }}"


    # ============================================================
    # RUNNING SERVICES
    # ============================================================

    - name: Get running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager |
        awk '{print $1}'
      args:
        executable: /bin/bash
      register: running_services_result
      changed_when: false
      failed_when: false

    - name: Count running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager |
        wc -l
      args:
        executable: /bin/bash
      register: running_services_count_result
      changed_when: false
      failed_when: false

    - name: Set service values
      ansible.builtin.set_fact:
        running_services_count: "{{ running_services_count_result.stdout | default('0') | trim | int }}"
        running_services: "{{ running_services_result.stdout_lines | default([]) }}"


    # ============================================================
    # FAILED SERVICES
    # ============================================================

    - name: Get failed services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=failed \
          --no-legend \
          --no-pager |
        awk '{print $1}'
      args:
        executable: /bin/bash
      register: failed_services_result
      changed_when: false
      failed_when: false

    - name: Count failed services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=failed \
          --no-legend \
          --no-pager |
        wc -l
      args:
        executable: /bin/bash
      register: failed_services_count_result
      changed_when: false
      failed_when: false

    - name: Set failed service values
      ansible.builtin.set_fact:
        failed_services_count: "{{ failed_services_count_result.stdout | default('0') | trim | int }}"
        failed_services: "{{ failed_services_result.stdout_lines | default([]) }}"


    # ============================================================
    # SERVICE DETAILS / COMMANDS
    # ============================================================

    - name: Collect service process information
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,pcpu,pmem,etime,comm,args --sort=-pcpu | head -31
      args:
        executable: /bin/bash
      register: process_result
      changed_when: false
      failed_when: false


    # ============================================================
    # SSH PROCESS
    # ============================================================

    - name: Collect SSH processes
      ansible.builtin.shell: |
        ps -ef | grep '[s]shd'
      args:
        executable: /bin/bash
      register: ssh_process_result
      changed_when: false
      failed_when: false


    # ============================================================
    # SAP SERVICES
    # ============================================================

    - name: Detect SAPControl
      ansible.builtin.shell: |
        find /usr/sap -type f -name sapcontrol 2>/dev/null | head -1
      args:
        executable: /bin/bash
      register: sapcontrol_result
      changed_when: false
      failed_when: false

    - name: Set SAPControl path
      ansible.builtin.set_fact:
        sapcontrol_path: "{{ sapcontrol_result.stdout | default('') | trim }}"

    - name: Get SAP processes
      ansible.builtin.shell: |
        if [ -n "{{ sapcontrol_path }}" ]; then
          "{{ sapcontrol_path }}" -nr 00 -function GetProcessList
        else
          echo "SAPCONTROL_NOT_FOUND"
        fi
      args:
        executable: /bin/bash
      register: sap_process_result
      changed_when: false
      failed_when: false

    - name: Determine SAP status
      ansible.builtin.set_fact:
        sap_status: >-
          {{
            'NOT_CONFIGURED'
            if (sapcontrol_path | length == 0)
            else
            'PASS'
            if ('GREEN' in (sap_process_result.stdout | default('')))
            else
            'WARNING'
          }}


    # ============================================================
    # SSL CERTIFICATE
    # ============================================================

    # IMPORTANT:
    # We deliberately do NOT use item.name here.
    # This avoids the previous "dict object has no attribute name"
    # failure when a certificate item is None.

    - name: Check HTTPS certificate expiry
      ansible.builtin.shell: |
        set -o pipefail

        expiry=$(
          echo |
          timeout 10 openssl s_client \
            -connect "{{ certificate_host }}:{{ certificate_port }}" \
            -servername "{{ certificate_host }}" \
            2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then
          echo "ERROR"
        else
          echo "$expiry"
        fi
      args:
        executable: /bin/bash
      register: certificate_expiry_result
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Initialize certificate values
      ansible.builtin.set_fact:
        certificate_expiry: "{{ certificate_expiry_result.stdout | default('ERROR') | trim }}"
        certificate_days_remaining: -1
        certificate_status: "UNKNOWN"

    - name: Calculate certificate expiry
      ansible.builtin.shell: |
        expiry="{{ certificate_expiry }}"

        if [ "$expiry" = "ERROR" ] || [ -z "$expiry" ]; then
          echo "-1"
        else
          expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
          now_epoch=$(date +%s)

          if [ "$expiry_epoch" -gt 0 ]; then
            echo $(( (expiry_epoch - now_epoch) / 86400 ))
          else
            echo "-1"
          fi
        fi
      args:
        executable: /bin/bash
      register: certificate_days_result
      changed_when: false
      failed_when: false

    - name: Set certificate days
      ansible.builtin.set_fact:
        certificate_days_remaining: "{{ certificate_days_result.stdout | default('-1') | trim | int }}"

    - name: Determine certificate status
      ansible.builtin.set_fact:
        certificate_status: >-
          {{
            'PASS'
            if (certificate_days_remaining | int) > (certificate_warning_days | int)
            else
            'WARNING'
            if (certificate_days_remaining | int) >= (certificate_critical_days | int)
            else
            'FAIL'
          }}
      when: (certificate_days_remaining | int) >= 0

    - name: Set certificate status when unavailable
      ansible.builtin.set_fact:
        certificate_status: "UNKNOWN"
      when: (certificate_days_remaining | int) < 0


    # ============================================================
    # OVERALL HEALTH
    # ============================================================

    - name: Calculate overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'FAIL'
            if
              (cpu_status == 'FAIL') or
              (memory_status == 'FAIL') or
              (disk_status == 'FAIL') or
              (certificate_status == 'FAIL') or
              (failed_services_count | int > 0)
            else
            'WARNING'
            if
              (cpu_status == 'WARNING') or
              (memory_status == 'WARNING') or
              (disk_status == 'WARNING') or
              (certificate_status == 'WARNING') or
              (certificate_status == 'UNKNOWN') or
              (sap_status == 'WARNING')
            else
            'PASS'
          }}


    # ============================================================
    # CLEAN AWX REPORT
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - "Server              : {{ ansible_host | default(inventory_hostname) }}"
          - "Hostname            : {{ hostname_result.stdout | default('N/A') | trim }}"
          - "OS                  : {{ os_result.stdout | default('N/A') | trim }}"
          - "Kernel              : {{ kernel_result.stdout | default('N/A') | trim }}"
          - "Architecture        : {{ architecture_result.stdout | default('N/A') | trim }}"
          - "Overall Health      : {{ overall_health }}"
          - "======================================================================"
          - ""
          - "[ AVAILABILITY ]"
          - "----------------------------------------------------------------------"
          - "Ansible Ping        : {{ 'PASS' if ping_result.ping is defined else 'FAIL' }}"
          - "SSH Port 22         : {{ 'PASS' if ssh_port_result is succeeded else 'FAIL' }}"
          - "SSH Service         : {{ 'PASS' if (ssh_service_result.stdout | default('')) | trim == 'active' else 'FAIL' }}"
          - "Uptime              : {{ uptime_formatted }}"
          - ""
          - "[ CPU ]"
          - "----------------------------------------------------------------------"
          - "CPU Quantity        : {{ cpu_count }}"
          - "CPU Usage           : {{ cpu_usage | float | round(2) }} %"
          - "CPU Threshold       : Warning={{ cpu_warning }}% Critical={{ cpu_critical }}%"
          - "CPU Status          : {{ cpu_status }}"
          - ""
          - "[ MEMORY ]"
          - "----------------------------------------------------------------------"
          - "Memory Total        : {{ memory_total_mb }} MB"
          - "Memory Used         : {{ memory_used_mb }} MB"
          - "Memory Usage        : {{ memory_usage | float | round(2) }} %"
          - "Memory Threshold    : Warning={{ memory_warning }}% Critical={{ memory_critical }}%"
          - "Memory Status       : {{ memory_status }}"
          - ""
          - "[ DISK - ROOT ]"
          - "----------------------------------------------------------------------"
          - "Disk Total          : {{ disk_total_gb }} GB"
          - "Disk Used           : {{ disk_used_gb }} GB"
          - "Disk Available      : {{ disk_available_gb }} GB"
          - "Disk Usage          : {{ disk_usage | float | round(2) }} %"
          - "Disk Threshold      : Warning={{ disk_warning }}% Critical={{ disk_critical }}%"
          - "Disk Status         : {{ disk_status }}"
          - ""
          - "[ NETWORK ]"
          - "----------------------------------------------------------------------"
          - "RX Traffic Total    : {{ network_rx_gb }} GB"
          - "TX Traffic Total    : {{ network_tx_gb }} GB"
          - ""
          - "Network Interfaces :"
          - "{{ network_interfaces_result.stdout | default('N/A') }}"
          - ""
          - "[ USERS ]"
          - "----------------------------------------------------------------------"
          - "Logged-in Users     : {{ logged_users_count }}"
          - "Logged-in Sessions  :"
          - "{{ logged_users | default([]) | join('\n') }}"
          - ""
          - "Linux User Count    : {{ linux_users | length }}"
          - ""
          - "[ SERVICES ]"
          - "----------------------------------------------------------------------"
          - "Running Services    : {{ running_services_count }}"
          - "Failed Services     : {{ failed_services_count }}"
          - ""
          - "Failed Service List :"
          - "{{ failed_services | default([]) | join('\n') if (failed_services | length > 0) else 'None' }}"
          - ""
          - "[ SERVICE / PROCESS USAGE ]"
          - "----------------------------------------------------------------------"
          - "{{ process_result.stdout | default('N/A') }}"
          - ""
          - "[ SSH PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ ssh_process_result.stdout | default('None') }}"
          - ""
          - "[ SAP ]"
          - "----------------------------------------------------------------------"
          - "SAP Status          : {{ sap_status }}"
          - "SAPControl          : {{ sapcontrol_path if (sapcontrol_path | length > 0) else 'Not Found' }}"
          - "SAP Process Output  :"
          - "{{ sap_process_result.stdout | default('N/A') }}"
          - ""
          - "[ SSL CERTIFICATE ]"
          - "----------------------------------------------------------------------"
          - "Certificate Host     : {{ certificate_host }}"
          - "Certificate Port     : {{ certificate_port }}"
          - "Expiry Date         : {{ certificate_expiry }}"
          - "Days Remaining      : {{ certificate_days_remaining }}"
          - "Certificate Status  : {{ certificate_status }}"
          - ""
          - "[ SUMMARY ]"
          - "----------------------------------------------------------------------"
          - "CPU                 : {{ cpu_status }}"
          - "Memory              : {{ memory_status }}"
          - "Disk                : {{ disk_status }}"
          - "SSH                 : {{ 'PASS' if ssh_port_result is succeeded else 'FAIL' }}"
          - "Services            : {{ 'FAIL' if (failed_services_count | int > 0) else 'PASS' }}"
          - "SAP                 : {{ sap_status }}"
          - "Certificate         : {{ certificate_status }}"
          - "======================================================================"
          - "                    END HEALTH CHECK"
          - "======================================================================"


    # ============================================================
    # MACHINE-READABLE RESULT
    # ============================================================

    - name: Set health check facts
      ansible.builtin.set_fact:
        health_check_result:
          server: "{{ ansible_host | default(inventory_hostname) }}"
          hostname: "{{ hostname_result.stdout | default('N/A') | trim }}"
          overall_health: "{{ overall_health }}"
          cpu:
            quantity: "{{ cpu_count | int }}"
            usage_percent: "{{ cpu_usage | float | round(2) }}"
            status: "{{ cpu_status }}"
          memory:
            total_mb: "{{ memory_total_mb | int }}"
            used_mb: "{{ memory_used_mb | int }}"
            usage_percent: "{{ memory_usage | float | round(2) }}"
            status: "{{ memory_status }}"
          disk:
            total_gb: "{{ disk_total_gb | float | round(2) }}"
            used_gb: "{{ disk_used_gb | float | round(2) }}"
            available_gb: "{{ disk_available_gb | float | round(2) }}"
            usage_percent: "{{ disk_usage | float | round(2) }}"
            status: "{{ disk_status }}"
          network:
            rx_gb: "{{ network_rx_gb | float | round(2) }}"
            tx_gb: "{{ network_tx_gb | float | round(2) }}"
          ssh:
            port: "{{ 'PASS' if ssh_port_result is succeeded else 'FAIL' }}"
            service: "{{ 'PASS' if (ssh_service_result.stdout | default('')) | trim == 'active' else 'FAIL' }}"
          users:
            logged_in: "{{ logged_users_count | int }}"
            total_linux_users: "{{ linux_users | length }}"
          services:
            running: "{{ running_services_count | int }}"
            failed: "{{ failed_services_count | int }}"
          sap:
            status: "{{ sap_status }}"
          certificate:
            host: "{{ certificate_host }}"
            port: "{{ certificate_port }}"
            expiry: "{{ certificate_expiry }}"
            days_remaining: "{{ certificate_days_remaining | int }}"
            status: "{{ certificate_status }}"

    - name: Display machine readable health result
      ansible.builtin.debug:
        var: health_check_result
