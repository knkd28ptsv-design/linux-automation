---
- name: Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ============================================================
    # THRESHOLDS
    # ============================================================

    cpu_warning: 80
    cpu_critical: 90

    memory_warning: 80
    memory_critical: 90

    disk_warning: 80
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 15

    # ============================================================
    # SERVICES TO CHECK
    # Add/remove services according to your environment
    # ============================================================

    service_checks:
      - ssh
      - nginx
      - docker
      - containerd
      - kubelet

    # ============================================================
    # SSL CERTIFICATES TO CHECK
    # Add additional entries if required
    # ============================================================

    certificate_checks:
      - name: "Local HTTPS"
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 443

    # ============================================================
    # SAP
    # Set sap_enabled: true if SAP is installed
    # ============================================================

    sap_enabled: true

  tasks:

    # ============================================================
    # 1. ANSIBLE CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false

    # ============================================================
    # 2. SSH PORT
    # ============================================================

    - name: Check SSH port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: 5
        state: started
      delegate_to: localhost
      become: false
      register: ssh_check
      changed_when: false
      ignore_errors: true

    # ============================================================
    # 3. HOST INFORMATION
    # ============================================================

    - name: Collect hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Collect OS information
      ansible.builtin.shell: |
        . /etc/os-release
        echo "${PRETTY_NAME}"
      args:
        executable: /bin/bash
      register: os_result
      changed_when: false

    - name: Collect kernel
      ansible.builtin.command: uname -r
      register: kernel_result
      changed_when: false

    - name: Collect architecture
      ansible.builtin.command: uname -m
      register: arch_result
      changed_when: false

    # ============================================================
    # 4. UPTIME
    # ============================================================

    - name: Collect uptime
      ansible.builtin.shell: |
        uptime -p
      args:
        executable: /bin/bash
      register: uptime_result
      changed_when: false

    # ============================================================
    # 5. CPU USAGE
    # ============================================================

    - name: Collect CPU usage
      ansible.builtin.shell: |
        top -bn1 | awk '/Cpu\(s\)/ {
          usage=100-$8;
          printf "%.2f\n", usage
        }'
      args:
        executable: /bin/bash
      register: cpu_usage_raw
      changed_when: false

    - name: Convert CPU usage to number
      ansible.builtin.set_fact:
        cpu_usage: "{{ cpu_usage_raw.stdout | trim | float }}"

    - name: Determine CPU status
      ansible.builtin.set_fact:
        cpu_status: >-
          {{
            'FAIL'
            if (cpu_usage | float) >= (cpu_critical | float)
            else
            'WARNING'
            if (cpu_usage | float) >= (cpu_warning | float)
            else
            'PASS'
          }}

    # ============================================================
    # 6. CPU LOAD
    # ============================================================

    - name: Collect CPU load
      ansible.builtin.shell: |
        awk '{print $1,$2,$3}' /proc/loadavg
      args:
        executable: /bin/bash
      register: load_result
      changed_when: false

    - name: Set CPU load
      ansible.builtin.set_fact:
        cpu_load_1: "{{ load_result.stdout.split()[0] | float }}"
        cpu_load_5: "{{ load_result.stdout.split()[1] | float }}"
        cpu_load_15: "{{ load_result.stdout.split()[2] | float }}"

    # ============================================================
    # 7. MEMORY
    # ============================================================

    - name: Collect memory usage
      ansible.builtin.shell: |
        free -m | awk '/^Mem:/ {
          total=$2;
          used=$3;
          available=$7;

          if (total > 0)
            usage=(used/total)*100;
          else
            usage=0;

          printf "%d %.2f %d\n", total, usage, available
        }'
      args:
        executable: /bin/bash
      register: memory_raw
      changed_when: false

    - name: Set memory values
      ansible.builtin.set_fact:
        memory_total_mb: "{{ memory_raw.stdout.split()[0] | int }}"
        memory_usage: "{{ memory_raw.stdout.split()[1] | float }}"
        memory_available_mb: "{{ memory_raw.stdout.split()[2] | int }}"

    - name: Determine memory status
      ansible.builtin.set_fact:
        memory_status: >-
          {{
            'FAIL'
            if (memory_usage | float) >= (memory_critical | float)
            else
            'WARNING'
            if (memory_usage | float) >= (memory_warning | float)
            else
            'PASS'
          }}

    # ============================================================
    # 8. ROOT DISK
    # ============================================================

    - name: Collect root disk usage
      ansible.builtin.shell: |
        df -Pk / | awk 'NR==2 {
          total=$2;
          used=$3;
          available=$4;
          usage=$5;
          gtotal=total/1024/1024;
          gused=used/1024/1024;
          gavail=available/1024/1024;

          printf "%d %d %d %.2f %.2f %.2f %.2f\n",
          total,used,available,usage,gtotal,gused,gavail
        }'
      args:
        executable: /bin/bash
      register: disk_raw
      changed_when: false

    - name: Set disk values
      ansible.builtin.set_fact:
        root_disk_total_kb: "{{ disk_raw.stdout.split()[0] | int }}"
        root_disk_used_kb: "{{ disk_raw.stdout.split()[1] | int }}"
        root_disk_available_kb: "{{ disk_raw.stdout.split()[2] | int }}"
        root_disk_usage: "{{ disk_raw.stdout.split()[3] | float }}"
        root_disk_total_gb: "{{ disk_raw.stdout.split()[4] | float }}"
        root_disk_used_gb: "{{ disk_raw.stdout.split()[5] | float }}"
        root_disk_available_gb: "{{ disk_raw.stdout.split()[6] | float }}"

    - name: Determine disk status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'FAIL'
            if (root_disk_usage | float) >= (disk_critical | float)
            else
            'WARNING'
            if (root_disk_usage | float) >= (disk_warning | float)
            else
            'PASS'
          }}

    # ============================================================
    # 9. ALL DISK FILESYSTEMS
    # ============================================================

    - name: Collect filesystem usage
      ansible.builtin.shell: |
        df -P -x tmpfs -x devtmpfs | tail -n +2
      args:
        executable: /bin/bash
      register: filesystem_result
      changed_when: false

    # ============================================================
    # 10. NETWORK INTERFACES
    # ============================================================

    - name: Collect network interface status
      ansible.builtin.shell: |
        ip -brief address
      args:
        executable: /bin/bash
      register: network_interfaces
      changed_when: false

    # ============================================================
    # 11. NETWORK TRAFFIC
    # ============================================================

    - name: Collect network traffic
      ansible.builtin.shell: |
        awk '
        NR > 2 {
          gsub(":", "", $1);
          if ($1 != "lo") {
            rx += $2;
            tx += $10;
          }
        }
        END {
          printf "%.2f %.2f\n", rx/1024/1024, tx/1024/1024
        }' /proc/net/dev
      args:
        executable: /bin/bash
      register: network_traffic_raw
      changed_when: false

    - name: Set network traffic
      ansible.builtin.set_fact:
        network_rx_mb: "{{ network_traffic_raw.stdout.split()[0] | float }}"
        network_tx_mb: "{{ network_traffic_raw.stdout.split()[1] | float }}"

    # ============================================================
    # 12. LOGGED-IN USERS
    # ============================================================

    - name: Get logged-in users
      ansible.builtin.shell: |
        who
      args:
        executable: /bin/bash
      register: logged_users_raw
      changed_when: false

    - name: Count logged-in users
      ansible.builtin.shell: |
        who | wc -l
      args:
        executable: /bin/bash
      register: logged_user_count_raw
      changed_when: false

    - name: Set logged user count
      ansible.builtin.set_fact:
        logged_user_count: "{{ logged_user_count_raw.stdout | trim | int }}"

    # ============================================================
    # 13. ALL LINUX USERS
    # ============================================================

    - name: Get Linux users
      ansible.builtin.shell: |
        awk -F: '$3 >= 1000 && $1 != "nobody" {print $1}' /etc/passwd
      args:
        executable: /bin/bash
      register: linux_users_raw
      changed_when: false

    # ============================================================
    # 14. SERVICE STATUS
    # ============================================================

    - name: Check configured services
      ansible.builtin.shell: |
        if systemctl list-unit-files --type=service 2>/dev/null |
           awk '{print $1}' |
           grep -qx "{{ item }}.service"; then

          systemctl is-active "{{ item }}" 2>/dev/null || true

        else

          echo "NOT_INSTALLED"

        fi
      args:
        executable: /bin/bash
      loop: "{{ service_checks }}"
      register: service_status_raw
      changed_when: false

    # ============================================================
    # 15. RUNNING SERVICES
    # ============================================================

    - name: Collect running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-pager \
          --no-legend |
          awk '{print $1}'
      args:
        executable: /bin/bash
      register: running_services_raw
      changed_when: false

    # ============================================================
    # 16. FAILED SERVICES
    # ============================================================

    - name: Collect failed services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=failed \
          --no-pager \
          --no-legend |
          awk '{print $1}'
      args:
        executable: /bin/bash
      register: failed_services_raw
      changed_when: false

    # ============================================================
    # 17. TOP CPU PROCESSES
    # ============================================================

    - name: Collect top CPU processes
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem,args --sort=-%cpu | head -n 11
      args:
        executable: /bin/bash
      register: top_cpu_processes
      changed_when: false

    # ============================================================
    # 18. TOP MEMORY PROCESSES
    # ============================================================

    - name: Collect top memory processes
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem,args --sort=-%mem | head -n 11
      args:
        executable: /bin/bash
      register: top_memory_processes
      changed_when: false

    # ============================================================
    # 19. RECENT SYSTEM CHANGES
    # ============================================================

    - name: Collect recent package changes
      ansible.builtin.shell: |
        if [ -f /var/log/dpkg.log ]; then
          grep -E ' install | upgrade | remove ' /var/log/dpkg.log |
          tail -n 10
        elif command -v rpm >/dev/null 2>&1; then
          rpm -qa --last | head -n 10
        else
          echo "No package change log available"
        fi
      args:
        executable: /bin/bash
      register: package_changes_raw
      changed_when: false

    # ============================================================
    # 20. SAP DETECTION
    # ============================================================

    - name: Check for SAPControl
      ansible.builtin.shell: |
        if command -v sapcontrol >/dev/null 2>&1; then
          echo "FOUND"
        elif [ -x /usr/sap/hostctrl/exe/sapcontrol ]; then
          echo "FOUND"
        else
          echo "NOT_FOUND"
        fi
      args:
        executable: /bin/bash
      register: sapcontrol_check
      changed_when: false
      when: sap_enabled | bool

    # ============================================================
    # 21. SAP PROCESSES
    # ============================================================

    - name: Collect SAP processes
      ansible.builtin.shell: |
        ps -ef |
        grep -Ei 'sapstartsrv|disp\+work|msg_server|enserver|sapwebdisp' |
        grep -v grep || true
      args:
        executable: /bin/bash
      register: sap_processes_raw
      changed_when: false
      when:
        - sap_enabled | bool
        - sapcontrol_check.stdout | default('NOT_FOUND') | trim == 'FOUND'

    # ============================================================
    # 22. SAP SYSTEM DETAILS
    # ============================================================

    - name: Collect SAP system details
      ansible.builtin.shell: |
        sapcontrol -nr 00 -function GetProcessList 2>/dev/null || true
      args:
        executable: /bin/bash
      register: sap_process_list_raw
      changed_when: false
      when:
        - sap_enabled | bool
        - sapcontrol_check.stdout | default('NOT_FOUND') | trim == 'FOUND'

    # ============================================================
    # 23. SSL CERTIFICATE EXPIRY
    # ============================================================

    - name: Check SSL certificate expiry
      ansible.builtin.shell: |
        set -o pipefail

        expiry=$(
          echo |
          timeout 10 openssl s_client \
            -connect "{{ item.host }}:{{ item.port }}" \
            -servername "{{ item.host }}" \
            2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then
          echo "ERROR"
        else
          echo "$expiry"
        fi
      args:
        executable: /bin/bash
      loop: "{{ certificate_checks }}"
      register: certificate_raw
      changed_when: false
      failed_when: false

    # ============================================================
    # 24. CERTIFICATE EXPIRY DAYS
    # ============================================================

    - name: Calculate certificate expiry days
      ansible.builtin.shell: |
        expiry="{{ item.stdout | trim }}"

        if [ "$expiry" = "ERROR" ] || [ -z "$expiry" ]; then
          echo "ERROR"
        else
          expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
          now_epoch=$(date +%s)

          if [ "$expiry_epoch" -eq 0 ]; then
            echo "ERROR"
          else
            echo $(( (expiry_epoch - now_epoch) / 86400 ))
          fi
        fi
      args:
        executable: /bin/bash
      loop: "{{ certificate_raw.results }}"
      register: certificate_days_raw
      changed_when: false
      failed_when: false

    # ============================================================
    # 25. CERTIFICATE STATUS
    # ============================================================

    - name: Build certificate status
      ansible.builtin.set_fact:
        certificate_status_list: >-
          {{
            certificate_status_list | default([]) +
            [{
              'name': item.0.item.name | default('Unknown Certificate'),
              'host': item.0.item.host | default('Unknown'),
              'port': item.0.item.port | default(0),
              'expiry': item.0.stdout | default('ERROR') | trim,
              'days': (
                item.1.stdout | trim | int
                if (item.1.stdout | trim) is match('^-?[0-9]+$')
                else -1
              ),
              'status':
                (
                  'FAIL'
                  if (
                    (item.1.stdout | trim) is match('^-?[0-9]+$')
                    and (item.1.stdout | trim | int) <= (certificate_critical_days | int)
                  )
                  else
                  'WARNING'
                  if (
                    (item.1.stdout | trim) is match('^-?[0-9]+$')
                    and (item.1.stdout | trim | int) <= (certificate_warning_days | int)
                  )
                  else
                  'PASS'
                  if (item.1.stdout | trim) is match('^[0-9]+$')
                  else
                  'UNKNOWN'
                )
            }]
          }}
      loop: "{{ certificate_raw.results | zip(certificate_days_raw.results) | list }}"
      no_log: false

    # ============================================================
    # 26. SERVICE STATUS SUMMARY
    # ============================================================

    - name: Build service status summary
      ansible.builtin.set_fact:
        service_status_list: >-
          {{
            service_status_list | default([]) +
            [{
              'service': item.item,
              'status': item.stdout | trim
            }]
          }}
      loop: "{{ service_status_raw.results }}"

    # ============================================================
    # 27. DETERMINE SERVICE HEALTH
    # ============================================================

    - name: Determine service health
      ansible.builtin.set_fact:
        service_health: >-
          {{
            'FAIL'
            if (
              service_status_list
              | selectattr('status', 'equalto', 'failed')
              | list
              | length > 0
            )
            else
            'WARNING'
            if (
              service_status_list
              | selectattr('status', 'equalto', 'NOT_INSTALLED')
              | list
              | length > 0
            )
            else
            'PASS'
          }}

    # ============================================================
    # 28. DETERMINE OVERALL HEALTH
    # ============================================================

    - name: Determine overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'FAIL'
            if (
              cpu_status == 'FAIL'
              or memory_status == 'FAIL'
              or disk_status == 'FAIL'
              or service_health == 'FAIL'
              or (
                certificate_status_list
                | selectattr('status', 'equalto', 'FAIL')
                | list
                | length > 0
              )
            )
            else
            'WARNING'
            if (
              cpu_status == 'WARNING'
              or memory_status == 'WARNING'
              or disk_status == 'WARNING'
              or service_health == 'WARNING'
              or (
                certificate_status_list
                | selectattr('status', 'equalto', 'WARNING')
                | list
                | length > 0
              )
            )
            else
            'PASS'
          }}

    # ============================================================
    # 29. CLEAN AWX REPORT
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - "Server              : {{ inventory_hostname }}"
          - "Hostname            : {{ hostname_result.stdout | trim }}"
          - "OS                  : {{ os_result.stdout | trim }}"
          - "Kernel              : {{ kernel_result.stdout | trim }}"
          - "Architecture        : {{ arch_result.stdout | trim }}"
          - "Overall Health      : {{ overall_health }}"
          - "======================================================================"

          - ""
          - "[ AVAILABILITY ]"
          - "----------------------------------------------------------------------"
          - "Ansible Ping        : {{ 'PASS' if ping_result is succeeded else 'FAIL' }}"
          - "SSH Port 22         : {{ 'PASS' if ssh_check is succeeded else 'FAIL' }}"
          - "Uptime              : {{ uptime_result.stdout | trim }}"

          - ""
          - "[ CPU ]"
          - "----------------------------------------------------------------------"
          - "CPU Cores           : {{ ansible_processor_vcpus | default('N/A') }}"
          - "CPU Usage           : {{ '%.2f' | format(cpu_usage | float) }} %"
          - "CPU Status          : {{ cpu_status }}"
          - "Load Average        : {{ cpu_load_1 }} / {{ cpu_load_5 }} / {{ cpu_load_15 }}"
          - "Load (1/5/15 min)   : 1 / 5 / 15 minutes"

          - ""
          - "[ MEMORY ]"
          - "----------------------------------------------------------------------"
          - "Memory Total        : {{ memory_total_mb }} MB"
          - "Memory Usage        : {{ '%.2f' | format(memory_usage | float) }} %"
          - "Memory Available    : {{ memory_available_mb }} MB"
          - "Memory Status       : {{ memory_status }}"

          - ""
          - "[ DISK - ROOT ]"
          - "----------------------------------------------------------------------"
          - "Disk Total          : {{ '%.2f' | format(root_disk_total_gb | float) }} GB"
          - "Disk Used           : {{ '%.2f' | format(root_disk_used_gb | float) }} GB"
          - "Disk Available      : {{ '%.2f' | format(root_disk_available_gb | float) }} GB"
          - "Disk Usage          : {{ '%.2f' | format(root_disk_usage | float) }} %"
          - "Disk Status         : {{ disk_status }}"

          - ""
          - "[ FILESYSTEM USAGE ]"
          - "----------------------------------------------------------------------"
          - "{{ filesystem_result.stdout }}"

          - ""
          - "[ NETWORK ]"
          - "----------------------------------------------------------------------"
          - "RX Traffic          : {{ '%.2f' | format(network_rx_mb | float) }} MB"
          - "TX Traffic          : {{ '%.2f' | format(network_tx_mb | float) }} MB"
          - ""
          - "Network Interfaces:"
          - "{{ network_interfaces.stdout }}"

          - ""
          - "[ LOGGED-IN USERS ]"
          - "----------------------------------------------------------------------"
          - "Logged-in Count     : {{ logged_user_count }}"
          - "{{ logged_users_raw.stdout | default('No users currently logged in') }}"

          - ""
          - "[ LINUX USERS ]"
          - "----------------------------------------------------------------------"
          - "{{ linux_users_raw.stdout | default('No regular users found') }}"

          - ""
          - "[ SERVICE STATUS ]"
          - "----------------------------------------------------------------------"
          - "Service Health      : {{ service_health }}"
          - >-
            {{
              service_status_list
              | map(attribute='service')
              | zip(service_status_list | map(attribute='status'))
              | map('join', ' : ')
              | list
              | join('\n')
            }}

          - ""
          - "[ FAILED SERVICES ]"
          - "----------------------------------------------------------------------"
          - >-
            {{
              failed_services_raw.stdout
              if (failed_services_raw.stdout | trim | length > 0)
              else 'NONE'
            }}

          - ""
          - "[ RUNNING SERVICES ]"
          - "----------------------------------------------------------------------"
          - "Running Service Count: {{ running_services_raw.stdout_lines | length }}"
          - >-
            {{
              running_services_raw.stdout_lines
              | join(', ')
            }}

          - ""
          - "[ TOP CPU PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ top_cpu_processes.stdout }}"

          - ""
          - "[ TOP MEMORY PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ top_memory_processes.stdout }}"

          - ""
          - "[ RECENT PACKAGE CHANGES ]"
          - "----------------------------------------------------------------------"
          - "{{ package_changes_raw.stdout | default('No package changes found') }}"

          - ""
          - "[ SAP STATUS ]"
          - "----------------------------------------------------------------------"
          - >-
            {{
              'SAP CHECK DISABLED'
              if not (sap_enabled | bool)
              else
              'SAPCONTROL NOT FOUND - SAP STATUS NOT AVAILABLE'
              if (sapcontrol_check.stdout | default('NOT_FOUND') | trim != 'FOUND')
              else
              'SAPCONTROL AVAILABLE'
            }}

          - ""
          - "SAP Processes:"
          - >-
            {{
              sap_processes_raw.stdout
              if (
                sap_enabled | bool
                and sapcontrol_check.stdout | default('NOT_FOUND') | trim == 'FOUND'
              )
              else
              'N/A'
            }}

          - ""
          - "SAP Process List:"
          - >-
            {{
              sap_process_list_raw.stdout
              if (
                sap_enabled | bool
                and sapcontrol_check.stdout | default('NOT_FOUND') | trim == 'FOUND'
              )
              else
              'N/A'
            }}

          - ""
          - "[ SSL CERTIFICATES ]"
          - "----------------------------------------------------------------------"
          - >-
            {{
              certificate_status_list
              | map(attribute='name')
              | list
              | join(', ')
              if certificate_status_list | length > 0
              else 'No certificates configured'
            }}

          - >-
            {{
              certificate_status_list
              | map(attribute='name')
              | zip(certificate_status_list | map(attribute='expiry'))
              | map('join', ' : ')
              | list
              | join('\n')
            }}

          - ""
          - "[ CERTIFICATE STATUS ]"
          - "----------------------------------------------------------------------"
          - >-
            {{
              certificate_status_list
              | map(attribute='name')
              | zip(certificate_status_list | map(attribute='days'))
              | map('join', ' : ')
              | list
              | join(' days\n')
            }}

          - ""
          - "======================================================================"
          - "                    END OF HEALTH CHECK"
          - "======================================================================"
          - ""
          - "PASS = Healthy"
          - "WARNING = Threshold/availability issue"
          - "FAIL = Critical issue"
          - ""
