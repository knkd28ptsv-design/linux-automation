---
- name: Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ============================================================
    # THRESHOLDS
    # ============================================================

    cpu_warning: 70
    cpu_critical: 90

    memory_warning: 70
    memory_critical: 90

    disk_warning: 75
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 15

    # ============================================================
    # SERVICES TO CHECK
    #
    # Add/remove services according to your environment.
    # Example:
    # required_services:
    #   - ssh
    #   - nginx
    #   - docker
    #   - kubelet
    # ============================================================

    required_services:
      - ssh
      - nginx
      - docker
      - kubelet

    # ============================================================
    # SSL CERTIFICATES
    #
    # Change/add certificates here.
    #
    # Example:
    #
    # certificate_targets:
    #   - name: "SAP HTTPS"
    #     host: "10.15.4.90"
    #     port: 443
    #
    # ============================================================

    certificate_targets:
      - name: "Local HTTPS"
        host: "10.15.4.90"
        port: 443

  tasks:

    # ============================================================
    # BASIC SERVER INFORMATION
    # ============================================================

    - name: Collect hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Collect OS information
      ansible.builtin.shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "${PRETTY_NAME:-$NAME}"
        else
          uname -s
        fi
      args:
        executable: /bin/bash
      register: os_result
      changed_when: false

    - name: Collect kernel
      ansible.builtin.command: uname -r
      register: kernel_result
      changed_when: false

    - name: Collect architecture
      ansible.builtin.command: uname -m
      register: architecture_result
      changed_when: false

    # ============================================================
    # ANSIBLE CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ansible_ping
      changed_when: false

    # ============================================================
    # SSH PORT
    # ============================================================

    - name: Check SSH port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: 5
        state: started
      delegate_to: localhost
      register: ssh_port_result
      changed_when: false
      ignore_errors: true

    # ============================================================
    # SSH SERVICE
    # ============================================================

    - name: Check SSH service
      ansible.builtin.shell: |
        if systemctl is-active --quiet ssh 2>/dev/null; then
          echo "RUNNING"
        elif systemctl is-active --quiet sshd 2>/dev/null; then
          echo "RUNNING"
        else
          echo "NOT_RUNNING"
        fi
      args:
        executable: /bin/bash
      register: ssh_service_result
      changed_when: false

    # ============================================================
    # UPTIME
    #
    # IMPORTANT:
    # All arithmetic is performed by shell.
    # This avoids AnsibleUnsafeText/Jinja errors.
    # ============================================================

    - name: Get uptime
      ansible.builtin.shell: |
        awk '{print $1}' /proc/uptime
      args:
        executable: /bin/bash
      register: uptime_raw
      changed_when: false

    - name: Format uptime
      ansible.builtin.shell: |
        uptime_seconds=$(awk -F. '{print $1}' /proc/uptime)

        days=$((uptime_seconds / 86400))
        hours=$(((uptime_seconds % 86400) / 3600))
        minutes=$(((uptime_seconds % 3600) / 60))

        echo "${days} days ${hours} hours ${minutes} minutes"
      args:
        executable: /bin/bash
      register: uptime_formatted
      changed_when: false

    # ============================================================
    # CPU
    #
    # Uses /proc/stat and calculates CPU usage in shell.
    # ============================================================

    - name: Collect CPU information
      ansible.builtin.shell: |
        cpu_count=$(nproc)

        read cpu user nice system idle iowait irq softirq steal guest guest_nice < /proc/stat

        total1=$((user + nice + system + idle + iowait + irq + softirq + steal))
        idle1=$((idle + iowait))

        sleep 1

        read cpu user nice system idle iowait irq softirq steal guest guest_nice < /proc/stat

        total2=$((user + nice + system + idle + iowait + irq + softirq + steal))
        idle2=$((idle + iowait))

        total_diff=$((total2 - total1))
        idle_diff=$((idle2 - idle1))

        if [ "$total_diff" -gt 0 ]; then
          usage=$(awk -v t="$total_diff" -v i="$idle_diff" \
            'BEGIN {printf "%.2f", (100 * (t-i) / t)}')
        else
          usage="0.00"
        fi

        echo "COUNT=${cpu_count}"
        echo "USAGE=${usage}"
      args:
        executable: /bin/bash
      register: cpu_result
      changed_when: false

    - name: Set CPU values
      ansible.builtin.set_fact:
        cpu_count: "{{ cpu_result.stdout | regex_search('COUNT=([0-9]+)', '\\1') | first | default('0') }}"
        cpu_usage: "{{ cpu_result.stdout | regex_search('USAGE=([0-9.]+)', '\\1') | first | default('0.00') }}"

    - name: Determine CPU status
      ansible.builtin.shell: |
        usage="{{ cpu_usage }}"

        if awk "BEGIN {exit !($usage >= {{ cpu_critical }})}"; then
          echo "FAIL"
        elif awk "BEGIN {exit !($usage >= {{ cpu_warning }})}"; then
          echo "WARNING"
        else
          echo "PASS"
        fi
      args:
        executable: /bin/bash
      register: cpu_status_result
      changed_when: false

    # ============================================================
    # MEMORY
    # ============================================================

    - name: Collect memory information
      ansible.builtin.shell: |
        total_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
        available_kb=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)

        used_kb=$((total_kb - available_kb))

        if [ "$total_kb" -gt 0 ]; then
          usage=$(awk -v u="$used_kb" -v t="$total_kb" \
            'BEGIN {printf "%.2f", (100*u/t)}')
        else
          usage="0.00"
        fi

        total_gb=$(awk -v t="$total_kb" \
          'BEGIN {printf "%.2f", t/1024/1024}')

        used_gb=$(awk -v u="$used_kb" \
          'BEGIN {printf "%.2f", u/1024/1024}')

        available_gb=$(awk -v a="$available_kb" \
          'BEGIN {printf "%.2f", a/1024/1024}')

        echo "TOTAL_GB=${total_gb}"
        echo "USED_GB=${used_gb}"
        echo "AVAILABLE_GB=${available_gb}"
        echo "USAGE=${usage}"
      args:
        executable: /bin/bash
      register: memory_result
      changed_when: false

    - name: Set memory values
      ansible.builtin.set_fact:
        memory_total_gb: "{{ memory_result.stdout | regex_search('TOTAL_GB=([0-9.]+)', '\\1') | first | default('0.00') }}"
        memory_used_gb: "{{ memory_result.stdout | regex_search('USED_GB=([0-9.]+)', '\\1') | first | default('0.00') }}"
        memory_available_gb: "{{ memory_result.stdout | regex_search('AVAILABLE_GB=([0-9.]+)', '\\1') | first | default('0.00') }}"
        memory_usage: "{{ memory_result.stdout | regex_search('USAGE=([0-9.]+)', '\\1') | first | default('0.00') }}"

    - name: Determine memory status
      ansible.builtin.shell: |
        usage="{{ memory_usage }}"

        if awk "BEGIN {exit !($usage >= {{ memory_critical }})}"; then
          echo "FAIL"
        elif awk "BEGIN {exit !($usage >= {{ memory_warning }})}"; then
          echo "WARNING"
        else
          echo "PASS"
        fi
      args:
        executable: /bin/bash
      register: memory_status_result
      changed_when: false

    # ============================================================
    # DISK
    # ============================================================

    - name: Collect root disk information
      ansible.builtin.shell: |
        df -P -B1 / | awk '
        NR==2 {
          total=$2
          used=$3
          available=$4
          percent=$5
          gtotal=total/1024/1024/1024
          gused=used/1024/1024/1024
          gavail=available/1024/1024/1024
          sub("%","",percent)

          printf "TOTAL_GB=%.2f\n",gtotal
          printf "USED_GB=%.2f\n",gused
          printf "AVAILABLE_GB=%.2f\n",gavail
          printf "USAGE=%.2f\n",percent
        }'
      args:
        executable: /bin/bash
      register: disk_result
      changed_when: false

    - name: Set disk values
      ansible.builtin.set_fact:
        disk_total_gb: "{{ disk_result.stdout | regex_search('TOTAL_GB=([0-9.]+)', '\\1') | first | default('0.00') }}"
        disk_used_gb: "{{ disk_result.stdout | regex_search('USED_GB=([0-9.]+)', '\\1') | first | default('0.00') }}"
        disk_available_gb: "{{ disk_result.stdout | regex_search('AVAILABLE_GB=([0-9.]+)', '\\1') | first | default('0.00') }}"
        disk_usage: "{{ disk_result.stdout | regex_search('USAGE=([0-9.]+)', '\\1') | first | default('0.00') }}"

    - name: Determine disk status
      ansible.builtin.shell: |
        usage="{{ disk_usage }}"

        if awk "BEGIN {exit !($usage >= {{ disk_critical }})}"; then
          echo "FAIL"
        elif awk "BEGIN {exit !($usage >= {{ disk_warning }})}"; then
          echo "WARNING"
        else
          echo "PASS"
        fi
      args:
        executable: /bin/bash
      register: disk_status_result
      changed_when: false

    # ============================================================
    # ALL FILESYSTEMS
    # ============================================================

    - name: Collect filesystem usage
      ansible.builtin.shell: |
        df -hP \
        --exclude-type=tmpfs \
        --exclude-type=devtmpfs \
        --exclude-type=overlay \
        --exclude-type=squashfs \
        2>/dev/null
      args:
        executable: /bin/bash
      register: filesystem_result
      changed_when: false

    # ============================================================
    # NETWORK TRAFFIC
    #
    # Reads /proc/net/dev twice with a 1-second interval.
    # Calculates RX/TX Mbps.
    # ============================================================

    - name: Collect network traffic
      ansible.builtin.shell: |
        get_total() {
          awk '
          NR > 2 {
            gsub(":", "", $1)
            if ($1 != "lo") {
              rx += $2
              tx += $10
            }
          }
          END {
            printf "%.0f %.0f\n", rx, tx
          }' /proc/net/dev
        }

        read rx1 tx1 < <(get_total)

        sleep 1

        read rx2 tx2 < <(get_total)

        rx_diff=$((rx2-rx1))
        tx_diff=$((tx2-tx1))

        if [ "$rx_diff" -lt 0 ]; then rx_diff=0; fi
        if [ "$tx_diff" -lt 0 ]; then tx_diff=0; fi

        rx_mbps=$(awk -v b="$rx_diff" 'BEGIN {printf "%.2f", b*8/1000000}')
        tx_mbps=$(awk -v b="$tx_diff" 'BEGIN {printf "%.2f", b*8/1000000}')

        echo "RX_MBPS=${rx_mbps}"
        echo "TX_MBPS=${tx_mbps}"
      args:
        executable: /bin/bash
      register: network_traffic_result
      changed_when: false

    - name: Set network traffic values
      ansible.builtin.set_fact:
        network_rx_mbps: "{{ network_traffic_result.stdout | regex_search('RX_MBPS=([0-9.]+)', '\\1') | first | default('0.00') }}"
        network_tx_mbps: "{{ network_traffic_result.stdout | regex_search('TX_MBPS=([0-9.]+)', '\\1') | first | default('0.00') }}"

    # ============================================================
    # NETWORK INTERFACES
    # ============================================================

    - name: Collect network interfaces
      ansible.builtin.shell: |
        ip -brief address
      args:
        executable: /bin/bash
      register: interfaces_result
      changed_when: false

    # ============================================================
    # LOGGED-IN USERS
    # ============================================================

    - name: Collect logged-in users
      ansible.builtin.shell: |
        if who | grep -q .; then
          who
        else
          echo "No users currently logged in"
        fi
      args:
        executable: /bin/bash
      register: logged_users_result
      changed_when: false

    # ============================================================
    # LINUX USERS
    # ============================================================

    - name: Collect Linux users
      ansible.builtin.shell: |
        getent passwd | awk -F: '{print $1}'
      args:
        executable: /bin/bash
      register: linux_users_result
      changed_when: false

    # ============================================================
    # REQUIRED SERVICES
    # ============================================================

    - name: Check required services
      ansible.builtin.shell: |
        service_name="{{ item }}"

        if systemctl list-unit-files 2>/dev/null | awk '{print $1}' | grep -qx "${service_name}.service"; then

          if systemctl is-active --quiet "${service_name}.service"; then
            echo "${service_name}: RUNNING"
          else
            echo "${service_name}: STOPPED"
          fi

        else

          echo "${service_name}: NOT_INSTALLED"

        fi
      args:
        executable: /bin/bash
      loop: "{{ required_services }}"
      register: service_check_result
      changed_when: false

    # ============================================================
    # ALL RUNNING SERVICES
    # ============================================================

    - name: Collect running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-pager \
          --no-legend \
          2>/dev/null |
        awk '{print $1}'
      args:
        executable: /bin/bash
      register: running_services_result
      changed_when: false

    # ============================================================
    # TOP CPU PROCESSES
    # ============================================================

    - name: Collect top CPU processes
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -11
      args:
        executable: /bin/bash
      register: top_cpu_processes_result
      changed_when: false

    # ============================================================
    # TOP MEMORY PROCESSES
    # ============================================================

    - name: Collect top memory processes
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem --sort=-%mem | head -11
      args:
        executable: /bin/bash
      register: top_memory_processes_result
      changed_when: false

    # ============================================================
    # CURRENT COMMANDS / PROCESSES
    # ============================================================

    - name: Collect active process commands
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,%cpu,%mem,lstart,cmd --sort=-%cpu | head -21
      args:
        executable: /bin/bash
      register: process_commands_result
      changed_when: false

    # ============================================================
    # RECENT SYSTEM CHANGES
    # ============================================================

    - name: Collect recent system changes
      ansible.builtin.shell: |
        if command -v journalctl >/dev/null 2>&1; then
          journalctl --since "1 hour ago" \
            --no-pager \
            -p warning..alert \
            2>/dev/null |
          tail -20
        else
          echo "systemd journal not available"
        fi
      args:
        executable: /bin/bash
      register: recent_changes_result
      changed_when: false

    # ============================================================
    # SAP DETECTION
    # ============================================================

    - name: Check SAPCONTROL availability
      ansible.builtin.shell: |
        if command -v sapcontrol >/dev/null 2>&1; then
          echo "AVAILABLE"
        elif find /usr/sap -type f -name sapcontrol 2>/dev/null | head -1 | grep -q .; then
          echo "AVAILABLE"
        else
          echo "NOT_AVAILABLE"
        fi
      args:
        executable: /bin/bash
      register: sapcontrol_check
      changed_when: false

    - name: Collect SAP processes
      ansible.builtin.shell: |
        if pgrep -af 'sapstartsrv|disp\+work|msg_server|enserver|sapwebdisp|hdbnameserver|hdbindexserver' >/dev/null 2>&1; then
          pgrep -af 'sapstartsrv|disp\+work|msg_server|enserver|sapwebdisp|hdbnameserver|hdbindexserver'
        else
          echo "No SAP processes detected"
        fi
      args:
        executable: /bin/bash
      register: sap_process_result
      changed_when: false

    # ============================================================
    # SAP SYSTEM DETAILS
    # ============================================================

    - name: Find SAP system instances
      ansible.builtin.shell: |
        if [ -d /usr/sap ]; then
          find /usr/sap -maxdepth 2 -type d 2>/dev/null |
          grep -E '/usr/sap/[^/]+/[A-Z][A-Z][A-Z][0-9][0-9]' |
          head -20
        else
          echo "N/A"
        fi
      args:
        executable: /bin/bash
      register: sap_instances_result
      changed_when: false

    # ============================================================
    # SSL CERTIFICATES
    #
    # This is deliberately handled entirely in shell to avoid
    # undefined dictionary/name errors.
    # ============================================================

    - name: Check SSL certificates
      ansible.builtin.shell: |
        target_name="{{ item.name | default('Unnamed certificate') }}"
        target_host="{{ item.host | default(ansible_host | default(inventory_hostname)) }}"
        target_port="{{ item.port | default(443) }}"

        expiry=$(
          timeout 10 openssl s_client \
            -connect "${target_host}:${target_port}" \
            -servername "${target_host}" \
            </dev/null 2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then
          echo "NAME=${target_name}"
          echo "HOST=${target_host}"
          echo "PORT=${target_port}"
          echo "EXPIRY=ERROR"
          echo "DAYS=ERROR"
          echo "STATUS=FAIL"
          exit 0
        fi

        expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
        current_epoch=$(date +%s)

        if [ "$expiry_epoch" -le 0 ]; then
          days="ERROR"
          status="FAIL"
        else
          days=$(( (expiry_epoch-current_epoch) / 86400 ))

          if [ "$days" -le {{ certificate_critical_days }} ]; then
            status="FAIL"
          elif [ "$days" -le {{ certificate_warning_days }} ]; then
            status="WARNING"
          else
            status="PASS"
          fi
        fi

        echo "NAME=${target_name}"
        echo "HOST=${target_host}"
        echo "PORT=${target_port}"
        echo "EXPIRY=${expiry}"
        echo "DAYS=${days}"
        echo "STATUS=${status}"
      args:
        executable: /bin/bash
      loop: "{{ certificate_targets | default([]) }}"
      register: certificate_results
      changed_when: false
      delegate_to: localhost
      ignore_errors: true

    # ============================================================
    # CERTIFICATE STATUS SUMMARY
    # ============================================================

    - name: Determine certificate overall status
      ansible.builtin.shell: |
        status="PASS"

        {% for item in certificate_results.results | default([]) %}
        result="{{ item.stdout | default('') }}"

        if echo "$result" | grep -q '^STATUS=FAIL'; then
          status="FAIL"
        elif echo "$result" | grep -q '^STATUS=WARNING' && [ "$status" != "FAIL" ]; then
          status="WARNING"
        fi
        {% endfor %}

        echo "$status"
      args:
        executable: /bin/bash
      register: certificate_overall_result
      changed_when: false

    # ============================================================
    # OVERALL HEALTH
    #
    # Again, comparisons happen in shell, not Jinja.
    # ============================================================

    - name: Determine overall health
      ansible.builtin.shell: |
        overall="PASS"

        set_status() {
          new_status="$1"

          if [ "$new_status" = "FAIL" ]; then
            overall="FAIL"
          elif [ "$new_status" = "WARNING" ] && [ "$overall" = "PASS" ]; then
            overall="WARNING"
          fi
        }

        set_status "{{ cpu_status_result.stdout | default('FAIL') }}"
        set_status "{{ memory_status_result.stdout | default('FAIL') }}"
        set_status "{{ disk_status_result.stdout | default('FAIL') }}"

        if [ "{{ ansible_ping.ping | default('') }}" != "pong" ]; then
          set_status "FAIL"
        fi

        if [ "{{ ssh_service_result.stdout | default('NOT_RUNNING') }}" != "RUNNING" ]; then
          set_status "FAIL"
        fi

        if [ "{{ ssh_port_result.failed | default(false) | string }}" = "True" ]; then
          set_status "FAIL"
        fi

        set_status "{{ certificate_overall_result.stdout | default('PASS') }}"

        {% for item in service_check_result.results | default([]) %}
        service_output="{{ item.stdout | default('') }}"

        if echo "$service_output" | grep -q ': STOPPED'; then
          set_status "WARNING"
        fi
        {% endfor %}

        echo "$overall"
      args:
        executable: /bin/bash
      register: overall_health_result
      changed_when: false

    # ============================================================
    # CLEAN REPORT
    # ============================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - "Server              : {{ inventory_hostname }}"
          - "Hostname            : {{ hostname_result.stdout | default('N/A') }}"
          - "OS                  : {{ os_result.stdout | default('N/A') }}"
          - "Kernel              : {{ kernel_result.stdout | default('N/A') }}"
          - "Architecture        : {{ architecture_result.stdout | default('N/A') }}"
          - "Overall Health      : {{ overall_health_result.stdout | default('UNKNOWN') }}"
          - "======================================================================"
          - ""
          - "[ AVAILABILITY ]"
          - "----------------------------------------------------------------------"
          - "Ansible Ping        : {{ 'PASS' if ansible_ping.ping | default('') == 'pong' else 'FAIL' }}"
          - "SSH Port 22         : {{ 'PASS' if not ssh_port_result.failed | default(true) else 'FAIL' }}"
          - "SSH Service         : {{ ssh_service_result.stdout | default('UNKNOWN') }}"
          - "Uptime              : {{ uptime_formatted.stdout | default('N/A') }}"
          - ""
          - "[ CPU ]"
          - "----------------------------------------------------------------------"
          - "CPU Count           : {{ cpu_count | default('0') }}"
          - "CPU Usage           : {{ cpu_usage | default('0.00') }} %"
          - "CPU Status          : {{ cpu_status_result.stdout | default('UNKNOWN') }}"
          - ""
          - "[ MEMORY ]"
          - "----------------------------------------------------------------------"
          - "Memory Total        : {{ memory_total_gb | default('0.00') }} GB"
          - "Memory Used         : {{ memory_used_gb | default('0.00') }} GB"
          - "Memory Available    : {{ memory_available_gb | default('0.00') }} GB"
          - "Memory Usage        : {{ memory_usage | default('0.00') }} %"
          - "Memory Status       : {{ memory_status_result.stdout | default('UNKNOWN') }}"
          - ""
          - "[ DISK - ROOT ]"
          - "----------------------------------------------------------------------"
          - "Disk Total          : {{ disk_total_gb | default('0.00') }} GB"
          - "Disk Used           : {{ disk_used_gb | default('0.00') }} GB"
          - "Disk Available      : {{ disk_available_gb | default('0.00') }} GB"
          - "Disk Usage          : {{ disk_usage | default('0.00') }} %"
          - "Disk Status         : {{ disk_status_result.stdout | default('UNKNOWN') }}"
          - ""
          - "[ FILESYSTEMS ]"
          - "----------------------------------------------------------------------"
          - "{{ filesystem_result.stdout | default('N/A') }}"
          - ""
          - "[ NETWORK TRAFFIC ]"
          - "----------------------------------------------------------------------"
          - "RX Traffic          : {{ network_rx_mbps | default('0.00') }} Mbps"
          - "TX Traffic          : {{ network_tx_mbps | default('0.00') }} Mbps"
          - ""
          - "[ NETWORK INTERFACES ]"
          - "----------------------------------------------------------------------"
          - "{{ interfaces_result.stdout | default('N/A') }}"
          - ""
          - "[ LOGGED-IN USERS ]"
          - "----------------------------------------------------------------------"
          - "{{ logged_users_result.stdout | default('No users currently logged in') }}"
          - ""
          - "[ REQUIRED SERVICES ]"
          - "----------------------------------------------------------------------"
          - "{% for item in service_check_result.results | default([]) %}{{ item.stdout | default('N/A') }}{% if not loop.last %} | {% endif %}{% endfor %}"
          - ""
          - "[ RUNNING SERVICES ]"
          - "----------------------------------------------------------------------"
          - "{{ running_services_result.stdout | default('N/A') }}"
          - ""
          - "[ TOP CPU PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ top_cpu_processes_result.stdout | default('N/A') }}"
          - ""
          - "[ TOP MEMORY PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ top_memory_processes_result.stdout | default('N/A') }}"
          - ""
          - "[ ACTIVE COMMANDS / PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "{{ process_commands_result.stdout | default('N/A') }}"
          - ""
          - "[ RECENT SYSTEM WARNINGS / CHANGES ]"
          - "----------------------------------------------------------------------"
          - "{{ recent_changes_result.stdout | default('No recent warnings') }}"
          - ""
          - "[ SAP ]"
          - "----------------------------------------------------------------------"
          - "SAPControl         : {{ sapcontrol_check.stdout | default('N/A') }}"
          - "SAP Instances      :"
          - "{{ sap_instances_result.stdout | default('N/A') }}"
          - ""
          - "SAP Processes      :"
          - "{{ sap_process_result.stdout | default('N/A') }}"
          - ""
          - "[ SSL CERTIFICATES ]"
          - "----------------------------------------------------------------------"
