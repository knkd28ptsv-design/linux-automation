---
- name: Complete Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true

  vars:

    # ============================================================
    # HEALTH THRESHOLDS
    # ============================================================

    cpu_warning: 80
    cpu_critical: 90

    memory_warning: 80
    memory_critical: 90

    disk_warning: 80
    disk_critical: 90

    certificate_warning_days: 30
    certificate_critical_days: 15


    # ============================================================
    # REQUIRED LINUX SERVICES
    # ============================================================

    required_services:
      - ssh


    # ============================================================
    # SAP CONFIGURATION
    #
    # Non-SAP server:
    # sap_enabled: false
    #
    # SAP server:
    # sap_enabled: true
    # sap_sid: "PRD"
    # sap_instance_number: "00"
    # ============================================================

    sap_enabled: false

    sap_sid: "PRD"

    sap_instance_number: "00"


    # ============================================================
    # SSL CERTIFICATE CHECK
    #
    # Add all HTTPS endpoints that need monitoring.
    # ============================================================

    certificate_enabled: true

    certificate_endpoints:

      - name: "Local HTTPS"
        host: "10.15.4.90"
        port: 443


  tasks:

    # ============================================================
    # 1. ANSIBLE CONNECTIVITY
    # ============================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false


    # ============================================================
    # 2. SERVER IP
    # ============================================================

    - name: Get server IP address
      ansible.builtin.set_fact:

        server_ip: >-
          {{ ansible_default_ipv4.address | default(inventory_hostname) }}


    # ============================================================
    # 3. SSH PORT
    # ============================================================

    - name: Check SSH port 22
      ansible.builtin.wait_for:

        host: "{{ server_ip }}"

        port: 22

        timeout: 5

        state: started

      delegate_to: localhost

      become: false

      register: ssh_result

      changed_when: false

      failed_when: false


    # ============================================================
    # 4. UPTIME
    # ============================================================

    - name: Calculate server uptime
      ansible.builtin.set_fact:

        uptime_seconds: "{{ ansible_uptime_seconds | int }}"

        uptime_days: >-
          {{ ((ansible_uptime_seconds | int) / 86400) | int }}

        uptime_hours: >-
          {{ (((ansible_uptime_seconds | int) % 86400) / 3600) | int }}

        uptime_minutes: >-
          {{ (((ansible_uptime_seconds | int) % 3600) / 60) | int }}


    # ============================================================
    # 5. CPU QUANTITY
    # ============================================================

    - name: Get CPU quantity
      ansible.builtin.set_fact:

        cpu_cores: "{{ ansible_processor_vcpus | int }}"

        cpu_threads: "{{ ansible_processor_nproc | int }}"

        cpu_model: >-
          {{ ansible_processor[2] | default('Unknown') }}


    # ============================================================
    # 6. CPU USAGE
    # ============================================================

    - name: Collect CPU usage
      ansible.builtin.shell: |

        read -r _ user nice system idle iowait irq softirq steal guest guest_nice < /proc/stat

        total1=$((user+nice+system+idle+iowait+irq+softirq+steal))

        idle1=$((idle+iowait))

        sleep 1

        read -r _ user nice system idle iowait irq softirq steal guest guest_nice < /proc/stat

        total2=$((user+nice+system+idle+iowait+irq+softirq+steal))

        idle2=$((idle+iowait))

        total_delta=$((total2-total1))

        idle_delta=$((idle2-idle1))

        if [ "$total_delta" -gt 0 ]; then

          awk -v total="$total_delta" -v idle="$idle_delta" \
          'BEGIN {
            printf "%.2f", (1 - idle/total) * 100
          }'

        else

          echo "0.00"

        fi

      args:
        executable: /bin/bash

      register: cpu_usage_result

      changed_when: false


    - name: Set CPU usage as numeric value
      ansible.builtin.set_fact:

        cpu_usage: "{{ cpu_usage_result.stdout | trim | float }}"


    # ============================================================
    # 7. CPU LOAD
    # ============================================================

    - name: Get CPU load
      ansible.builtin.set_fact:

        load_1m: "{{ ansible_loadavg['1m'] | float }}"

        load_5m: "{{ ansible_loadavg['5m'] | float }}"

        load_15m: "{{ ansible_loadavg['15m'] | float }}"


    # ============================================================
    # 8. CPU STATUS
    # ============================================================

    - name: Determine CPU status
      ansible.builtin.set_fact:

        cpu_status: >-

          {{
            'FAIL'

            if (cpu_usage | float) >= (cpu_critical | float)

            else

            'WARNING'

            if (cpu_usage | float) >= (cpu_warning | float)

            else

            'PASS'
          }}


    # ============================================================
    # 9. MEMORY INFORMATION
    # ============================================================

    - name: Calculate memory information
      ansible.builtin.set_fact:

        memory_total_mb: >-
          {{ ansible_memtotal_mb | int }}

        memory_available_mb: >-
          {{
            ansible_memory_mb.real.available
            | default(ansible_memory_mb.real.free)
            | int
          }}

        memory_used_mb: >-
          {{
            (
              (ansible_memtotal_mb | int)
              -
              (
                ansible_memory_mb.real.available
                | default(ansible_memory_mb.real.free)
                | int
              )
            )
            | int
          }}

        memory_used_percent: >-
          {{
            (
              (
                (ansible_memtotal_mb | float)
                -
                (
                  ansible_memory_mb.real.available
                  | default(ansible_memory_mb.real.free)
                  | float
                )
              )
              /
              (ansible_memtotal_mb | float)
              *
              100
            )
            | float
            | round(2)
          }}


    # ============================================================
    # 10. MEMORY STATUS
    # ============================================================

    - name: Determine memory status
      ansible.builtin.set_fact:

        memory_status: >-

          {{
            'FAIL'

            if (memory_used_percent | float) >= (memory_critical | float)

            else

            'WARNING'

            if (memory_used_percent | float) >= (memory_warning | float)

            else

            'PASS'
          }}


    # ============================================================
    # 11. ROOT DISK USAGE
    # ============================================================

    - name: Get root disk usage
      ansible.builtin.shell: |

        df -Pk / |
        awk 'NR==2 {
          gsub("%","",$5);
          printf "%s|%s|%s|%s\n",$2,$3,$4,$5
        }'

      args:
        executable: /bin/bash

      register: root_disk_result

      changed_when: false


    # ============================================================
    # 12. SET ROOT DISK VALUES
    #
    # Explicitly convert everything to numeric values.
    # ============================================================

    - name: Set root disk values
      ansible.builtin.set_fact:

        root_disk_total_kb: >-
          {{ root_disk_result.stdout.split('|')[0] | trim | int }}

        root_disk_used_kb: >-
          {{ root_disk_result.stdout.split('|')[1] | trim | int }}

        root_disk_free_kb: >-
          {{ root_disk_result.stdout.split('|')[2] | trim | int }}

        disk_usage: >-
          {{ root_disk_result.stdout.split('|')[3] | trim | float }}


    # ============================================================
    # 13. DISK STATUS
    # ============================================================

    - name: Determine disk status
      ansible.builtin.set_fact:

        disk_status: >-

          {{
            'FAIL'

            if (disk_usage | float) >= (disk_critical | float)

            else

            'WARNING'

            if (disk_usage | float) >= (disk_warning | float)

            else

            'PASS'
          }}


    # ============================================================
    # 14. ALL FILESYSTEM DISK INFORMATION
    # ============================================================

    - name: Get all filesystem disk usage
      ansible.builtin.shell: |

        df -P \
          -x tmpfs \
          -x devtmpfs \
          -x overlay |
        awk 'NR > 1 {
          gsub("%","",$5);
          print $1 "|" $2 "|" $3 "|" $4 "|" $5 "|" $6
        }'

      args:
        executable: /bin/bash

      register: disk_result

      changed_when: false


    # ============================================================
    # 15. BUILD DISK REPORT
    # ============================================================

    - name: Build disk report
      ansible.builtin.set_fact:

        disk_report: >-

          {%- set disks = [] -%}

          {%- for line in disk_result.stdout_lines -%}

            {%- set fields = line.split('|') -%}

            {%- if fields | length >= 6 -%}

              {%- set item = {
                'filesystem': fields[0],
                'total_kb': fields[1] | int,
                'used_kb': fields[2] | int,
                'free_kb': fields[3] | int,
                'usage_percent': fields[4] | float,
                'mount': fields[5]
              } -%}

              {%- set _ = disks.append(item) -%}

            {%- endif -%}

          {%- endfor -%}

          {{ disks }}


    # ============================================================
    # 16. NETWORK INTERFACES
    # ============================================================

    - name: Get network interfaces
      ansible.builtin.command:

        cmd: ip -br addr

      register: network_interfaces

      changed_when: false


    # ============================================================
    # 17. NETWORK TRAFFIC
    # ============================================================

    - name: Get network traffic
      ansible.builtin.shell: |

        awk '

        NR > 2 {

          gsub(":", "", $1);

          if ($1 != "lo") {

            rx += $2;

            tx += $10;

          }

        }

        END {

          print rx+0, tx+0

        }' /proc/net/dev

      args:
        executable: /bin/bash

      register: network_traffic

      changed_when: false


    # ============================================================
    # 18. SET NETWORK VALUES
    # ============================================================

    - name: Set network traffic values
      ansible.builtin.set_fact:

        network_rx_bytes: >-
          {{ network_traffic.stdout.split()[0] | default('0') | trim | int }}

        network_tx_bytes: >-
          {{ network_traffic.stdout.split()[1] | default('0') | trim | int }}


    # ============================================================
    # 19. DEFAULT ROUTE
    # ============================================================

    - name: Get default route
      ansible.builtin.command:

        cmd: ip route show default

      register: default_route

      changed_when: false

      failed_when: false


    # ============================================================
    # 20. NETWORK STATUS
    # ============================================================

    - name: Determine network status
      ansible.builtin.set_fact:

        network_status: >-

          {{
            'PASS'

            if
            (
              ansible_default_ipv4.address is defined
              and
              (default_route.stdout | trim | length) > 0
            )

            else

            'FAIL'
          }}


    # ============================================================
    # 21. LOGGED-IN USERS
    # ============================================================

    - name: Get currently logged-in users
      ansible.builtin.shell: |

        who

      args:
        executable: /bin/bash

      register: logged_in_users

      changed_when: false

      failed_when: false


    # ============================================================
    # 22. LOGGED-IN USER COUNT
    # ============================================================

    - name: Count logged-in users
      ansible.builtin.shell: |

        who | wc -l

      args:
        executable: /bin/bash

      register: logged_user_count

      changed_when: false

      failed_when: false


    - name: Set logged-in user count
      ansible.builtin.set_fact:

        logged_in_user_count: >-
          {{ logged_user_count.stdout | trim | int }}


    # ============================================================
    # 23. ALL LINUX USERS
    # ============================================================

    - name: Get Linux users
      ansible.builtin.getent:

        database: passwd

      register: linux_users


    - name: Calculate Linux user count
      ansible.builtin.set_fact:

        linux_user_count: >-
          {{ ansible_facts.getent_passwd | length | int }}


    # ============================================================
    # 24. RUNNING SYSTEMD SERVICES
    # ============================================================

    - name: Get running systemd services
      ansible.builtin.shell: |

        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager

      args:
        executable: /bin/bash

      register: running_services

      changed_when: false


    # ============================================================
    # 25. SERVICE COMMAND / PID / START TIME
    # ============================================================

    - name: Get running service details
      ansible.builtin.shell: |

        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager |
        awk '{print $1}' |
        while read service
        do

          pid=$(systemctl show "$service" -p MainPID --value)

          command=$(systemctl show "$service" -p ExecStart --value)

          active_since=$(systemctl show "$service" -p ActiveEnterTimestamp --value)

          echo "$service|$pid|$command|$active_since"

        done

      args:
        executable: /bin/bash

      register: service_details

      changed_when: false


    # ============================================================
    # 26. REQUIRED SERVICES
    # ============================================================

    - name: Check required Linux services
      ansible.builtin.command:

        cmd: "systemctl is-active {{ item }}"

      loop: "{{ required_services }}"

      register: required_service_results

      changed_when: false

      failed_when: false


    # ============================================================
    # 27. REQUIRED SERVICE STATUS
    # ============================================================

    - name: Determine required service status
      ansible.builtin.set_fact:

        services_status: >-

          {{
            'PASS'

            if
            (
              required_service_results.results
              |
              selectattr('stdout', 'equalto', 'active')
              |
              list
              |
              length
              ==
              required_services | length
            )

            else

            'FAIL'
          }}


    # ============================================================
    # 28. SAPCONTROL CHECK
    # ============================================================

    - name: Check SAPCONTROL executable
      ansible.builtin.stat:

        path:
          "/usr/sap/{{ sap_sid }}/SYS/exe/uc/linuxx86_64/sapcontrol"

      register: sapcontrol_file

      when: sap_enabled


    # ============================================================
    # 29. SAP PROCESS LIST
    # ============================================================

    - name: Get SAP process list
      ansible.builtin.command:

        cmd: >
          /usr/sap/{{ sap_sid }}/SYS/exe/uc/linuxx86_64/sapcontrol
          -nr {{ sap_instance_number }}
          -function GetProcessList

      register: sap_process_result

      changed_when: false

      failed_when: false

      when:
        - sap_enabled
        - sapcontrol_file.stat.exists


    # ============================================================
    # 30. SAP PROCESS STATUS
    # ============================================================

    - name: Determine SAP process status
      ansible.builtin.set_fact:

        sap_status: >-

          {{
            'PASS'

            if
            (
              (sap_process_result.rc | default(1) | int) == 0
              and
              'GREEN' in (sap_process_result.stdout | default(''))
            )

            else

            'FAIL'
          }}

      when:
        - sap_enabled
        - sap_process_result is defined


    # ============================================================
    # 31. SAP INSTANCE LIST
    # ============================================================

    - name: Get SAP system instance list
      ansible.builtin.command:

        cmd: >
          /usr/sap/{{ sap_sid }}/SYS/exe/uc/linuxx86_64/sapcontrol
          -nr {{ sap_instance_number }}
          -function GetSystemInstanceList

      register: sap_system_result

      changed_when: false

      failed_when: false

      when:
        - sap_enabled
        - sapcontrol_file.stat.exists


    # ============================================================
    # 32. SAP SYSTEM STATUS
    # ============================================================

    - name: Determine SAP system status
      ansible.builtin.set_fact:

        sap_system_status: >-

          {{
            'PASS'

            if
            (
              (sap_system_result.rc | default(1) | int) == 0
              and
              'GREEN' in (sap_system_result.stdout | default(''))
            )

            else

            'FAIL'
          }}

      when:
        - sap_enabled
        - sap_system_result is defined


    # ============================================================
    # 33. SAP DISABLED
    # ============================================================

    - name: Set SAP status when disabled
      ansible.builtin.set_fact:

        sap_status: "N/A"

        sap_system_status: "N/A"

      when: not sap_enabled


    # ============================================================
    # 34. SAPCONTROL MISSING
    # ============================================================

    - name: Set SAP status when SAPCONTROL is missing
      ansible.builtin.set_fact:

        sap_status: "FAIL"

        sap_system_status: "FAIL"

      when:
        - sap_enabled
        - sapcontrol_file is defined
        - not sapcontrol_file.stat.exists


    # ============================================================
    # 35. SSL CERTIFICATE EXPIRY
    # ============================================================

    - name: Check SSL certificate expiry
      ansible.builtin.shell: |

        set -o pipefail

        expiry=$(
          echo |
          openssl s_client \
            -connect "{{ item.host }}:{{ item.port }}" \
            -servername "{{ item.host }}" \
            2>/dev/null |
          openssl x509 -noout -enddate 2>/dev/null |
          cut -d= -f2
        )

        if [ -z "$expiry" ]; then

          echo "ERROR"

        else

          echo "$expiry"

        fi

      args:
        executable: /bin/bash

      loop: "{{ certificate_endpoints }}"

      register: certificate_results

      changed_when: false

      failed_when: false

      when: certificate_enabled


    # ============================================================
    # 36. CERTIFICATE DAYS REMAINING
    # ============================================================

    - name: Calculate certificate expiry days
      ansible.builtin.shell: |

        expiry="{{ item.stdout | trim }}"

        if [ -z "$expiry" ] || [ "$expiry" = "ERROR" ]; then

          echo "ERROR"

          exit 0

        fi

        expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null)

        if [ -z "$expiry_epoch" ]; then

          echo "ERROR"

          exit 0

        fi

        now_epoch=$(date +%s)

        days=$(( (expiry_epoch - now_epoch) / 86400 ))

        echo "$days"

      args:
        executable: /bin/bash

      loop: "{{ certificate_results.results | default([]) }}"

      register: certificate_days_results

      changed_when: false

      failed_when: false

      when: certificate_enabled


    # ============================================================
    # 37. CERTIFICATE STATUS
    # ============================================================

    - name: Determine certificate status
      ansible.builtin.set_fact:

        certificate_status: >-

          {%- set ns = namespace(status='PASS') -%}

          {%- for cert in certificate_days_results.results | default([]) -%}

            {%- set days = cert.stdout | default('ERROR') | trim -%}

            {%- if days == 'ERROR' or days == '' -%}

              {%- set ns.status = 'FAIL' -%}

            {%- elif (days | int) <= (certificate_critical_days | int) -%}

              {%- set ns.status = 'FAIL' -%}

            {%- elif (days | int) <= (certificate_warning_days | int) -%}

              {%- if ns.status != 'FAIL' -%}

                {%- set ns.status = 'WARNING' -%}

              {%- endif -%}

            {%- endif -%}

          {%- endfor -%}

          {{ ns.status }}

      when: certificate_enabled


    # ============================================================
    # 38. CERTIFICATE DISABLED
    # ============================================================

    - name: Set certificate status when disabled
      ansible.builtin.set_fact:

        certificate_status: "N/A"

      when: not certificate_enabled


    # ============================================================
    # 39. OVERALL HEALTH
    # ============================================================

    - name: Determine overall health
      ansible.builtin.set_fact:

        overall_status: >-

          {{
            'FAIL'

            if
            (
              ping_result.failed
              or
              ssh_result.failed
              or
              cpu_status == 'FAIL'
              or
              memory_status == 'FAIL'
              or
              disk_status == 'FAIL'
              or
              network_status == 'FAIL'
              or
              (uptime_seconds | int) <= 0
              or
              services_status == 'FAIL'
              or
              (
                sap_enabled
                and
                sap_status == 'FAIL'
              )
              or
              (
                sap_enabled
                and
                sap_system_status == 'FAIL'
              )
              or
              (
                certificate_enabled
                and
                certificate_status == 'FAIL'
              )
            )

            else

            'WARNING'

            if
            (
              cpu_status == 'WARNING'
              or
              memory_status == 'WARNING'
              or
              disk_status == 'WARNING'
              or
              (
                certificate_enabled
                and
                certificate_status == 'WARNING'
              )
            )

            else

            'PASS'
          }}


    # ============================================================
    # 40. MAIN HEALTH REPORT
    # ============================================================

    - name: Display main health report
      ansible.builtin.debug:

        msg:

          - "===================================================================="

          - "                 LINUX SERVER HEALTH REPORT"

          - "===================================================================="

          - "SERVER INFORMATION"

          - "Hostname             : {{ ansible_hostname }}"

          - "Inventory Host       : {{ inventory_hostname }}"

          - "IP Address           : {{ server_ip }}"

          - "Operating System     : {{ ansible_distribution }} {{ ansible_distribution_version }}"

          - "Kernel               : {{ ansible_kernel }}"

          - "Architecture         : {{ ansible_architecture }}"

          - "===================================================================="

          - "SERVER AVAILABILITY"

          - "Ansible Ping         : {{ 'PASS' if not ping_result.failed else 'FAIL' }}"

          - "SSH Port 22          : {{ 'PASS' if not ssh_result.failed else 'FAIL' }}"

          - "Uptime               : {{ uptime_days }} days {{ uptime_hours }} hours {{ uptime_minutes }} minutes"

          - "===================================================================="

          - "CPU"

          - "CPU Model            : {{ cpu_model }}"

          - "CPU Cores            : {{ cpu_cores | int }}"

          - "CPU Threads          : {{ cpu_threads | int }}"

          - "CPU Usage            : {{ (cpu_usage | float) | round(2) }} %"

          - "CPU Status           : {{ cpu_status }}"

          - "Load 1 Minute        : {{ (load_1m | float) | round(2) }}"

          - "Load 5 Minutes       : {{ (load_5m | float) | round(2) }}"

          - "Load 15 Minutes      : {{ (load_15m | float) | round(2) }}"

          - "===================================================================="

          - "MEMORY"

          - "Memory Total         : {{ memory_total_mb | int }} MB"

          - "Memory Used          : {{ memory_used_mb | int }} MB"

          - "Memory Available     : {{ memory_available_mb | int }} MB"

          - "Memory Usage         : {{ (memory_used_percent | float) | round(2) }} %"

          - "Memory Status        : {{ memory_status }}"

          - "===================================================================="

          - "ROOT DISK"

          - "Disk Total           : {{ (((root_disk_total_kb | int) / 1024 / 1024) | round(2)) }} GB"

          - "Disk Used            : {{ (((root_disk_used_kb | int) / 1024 / 1024) | round(2)) }} GB"

          - "Disk Free            : {{ (((root_disk_free_kb | int) / 1024 / 1024) | round(2)) }} GB"

          - "Disk Usage           : {{ ((disk_usage | float) | round(2)) }} %"

          - "Disk Status          : {{ disk_status }}"

          - "===================================================================="

          - "NETWORK"

          - "Network Status       : {{ network_status }}"

          - "Default Gateway      : {{ ansible_default_ipv4.gateway | default('N/A') }}"

          - "RX Total             : {{ (((network_rx_bytes | int) / 1024 / 1024 / 1024) | round(2)) }} GB"

          - "TX Total             : {{ (((network_tx_bytes | int) / 1024 / 1024 / 1024) | round(2)) }} GB"

          - "===================================================================="

          - "USERS"

          - "Linux User Count     : {{ linux_user_count | int }}"

          - "Currently Logged In  : {{ logged_in_user_count | int }}"

          - "===================================================================="

          - "LINUX SERVICES"

          - "Required Services    : {{ required_services | join(', ') }}"

          - "Required Service     : {{ services_status }}"

          - "Running Services     : {{ running_services.stdout_lines | length }}"

          - "===================================================================="

          - "SAP"

          - "SAP Enabled          : {{ sap_enabled }}"

          - "SAP SID              : {{ sap_sid if sap_enabled else 'N/A' }}"

          - "SAP Instance         : {{ sap_instance_number if sap_enabled else 'N/A' }}"

          - "SAP Process Status   : {{ sap_status | default('N/A') }}"

          - "SAP System Status    : {{ sap_system_status | default('N/A') }}"

          - "===================================================================="

          - "CERTIFICATES"

          - "Certificate Status   : {{ certificate_status }}"

          - "Warning Days         : {{ certificate_warning_days }}"

          - "Critical Days        : {{ certificate_critical_days }}"

          - "===================================================================="

          - "OVERALL STATUS       : {{ overall_status }}"

          - "===================================================================="


    # ============================================================
    # 41. ALL FILESYSTEM DETAILS
    # ============================================================

    - name: Display all filesystem details
      ansible.builtin.debug:

        msg:

          - "Filesystem          : {{ item.filesystem }}"

          - "Mount Point         : {{ item.mount }}"

          - "Total               : {{ (((item.total_kb | int) / 1024 / 1024) | round(2)) }} GB"

          - "Used                : {{ (((item.used_kb | int) / 1024 / 1024) | round(2)) }} GB"

          - "Free                : {{ (((item.free_kb | int) / 1024 / 1024) | round(2)) }} GB"

          - "Usage               : {{ ((item.usage_percent | float) | round(2)) }} %"

      loop: "{{ disk_report }}"


    # ============================================================
    # 42. LOGGED-IN USERS
    # ============================================================

    - name: Display currently logged-in users
      ansible.builtin.debug:

        msg:

          - "Currently logged-in users:"

          - >-
            {{
              logged_in_users.stdout_lines
              if (logged_in_users.stdout_lines | length > 0)
              else
              ['None']
            }}


    # ============================================================
    # 43. ALL LINUX USERS
    # ============================================================

    - name: Display Linux users
      ansible.builtin.debug:

        msg:

          - "Linux users:"

          - "{{ ansible_facts.getent_passwd.keys() | list | sort }}"


    # ============================================================
    # 44. RUNNING SERVICE DETAILS
    # ============================================================

    - name: Display running service details
      ansible.builtin.debug:

        msg: "{{ item }}"

      loop: "{{ service_details.stdout_lines }}"


    # ============================================================
    # 45. REQUIRED SERVICE DETAILS
    # ============================================================

    - name: Display required service status
      ansible.builtin.debug:

        msg:

          - "Service: {{ item.item }}"

          - "Status : {{ item.stdout | default('unknown') }}"

          - "RC     : {{ item.rc | default(1) | int }}"

      loop: "{{ required_service_results.results }}"


    # ============================================================
    # 46. NETWORK INTERFACE DETAILS
    # ============================================================

    - name: Display network interfaces
      ansible.builtin.debug:

        msg:

          - "Network interfaces:"

          - "{{ network_interfaces.stdout_lines }}"


    # ============================================================
    # 47. SAP PROCESS DETAILS
    # ============================================================

    - name: Display SAP process details
      ansible.builtin.debug:

        msg:

          - "SAP Process List:"

          - "{{ sap_process_result.stdout_lines | default(['N/A']) }}"

      when:
        - sap_enabled
        - sap_process_result is defined


    # ============================================================
    # 48. SAP SYSTEM DETAILS
    # ============================================================

    - name: Display SAP system details
      ansible.builtin.debug:

        msg:

          - "SAP System Instance List:"

          - "{{ sap_system_result.stdout_lines | default(['N/A']) }}"

      when:
        - sap_enabled
        - sap_system_result is defined


    # ============================================================
    # 49. CERTIFICATE DETAILS
    # ============================================================

    - name: Display certificate details
      ansible.builtin.debug:

        msg:

          - "=============================================================="

          - >-
            Certificate Name :
            {{ item.0.item.name | default('Unknown') }}

          - >-
            Certificate Host :
            {{ item.0.item.host | default('Unknown') }}

          - >-
            Certificate Port :
            {{ item.0.item.port | default('Unknown') }}

          - >-
            Expiry Date :
            {{ item.0.stdout | default('UNKNOWN') | trim }}

          - >-
            Days Remaining :
            {{ item.1.stdout | default('UNKNOWN') | trim }}

          - "=============================================================="

      loop: >-
        {{
          certificate_results.results
          | default([])
          | zip(
              certificate_days_results.results
              | default([])
            )
          | list
        }}

      when:
        - certificate_enabled
        - certificate_results is defined
        - certificate_days_results is defined
