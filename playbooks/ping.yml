- name: Linux Server Health Check
  hosts: all
  gather_facts: true
  become: true
  become_method: sudo
  become_user: root

  vars:
    cpu_warning: 80
    cpu_critical: 90
    memory_warning: 80
    memory_critical: 90
    disk_warning: 80
    disk_critical: 90

    # Add services here if you want them specifically monitored.
    # Example:
    # health_check_services:
    #   - sshd
    #   - chronyd
    #   - sapstartsrv
    health_check_services: []

  tasks:

    # ================================================================
    # AVAILABILITY
    # ================================================================

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false

    - name: Check SSH port from AWX
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        state: started
        timeout: 5
      delegate_to: localhost
      become: false
      register: ssh_port_result
      changed_when: false
      failed_when: false

    - name: Check SSH service
      ansible.builtin.command: systemctl is-active sshd
      register: ssh_service_result
      changed_when: false
      failed_when: false

    # ================================================================
    # UPTIME
    # ================================================================

    - name: Collect uptime seconds
      ansible.builtin.shell: |
        awk '{print int($1)}' /proc/uptime
      args:
        executable: /bin/bash
      register: uptime_raw
      changed_when: false
      failed_when: false

    - name: Convert uptime to integer
      ansible.builtin.set_fact:
        uptime_seconds: "{{ uptime_raw.stdout | default('0') | trim | int }}"

    - name: Format uptime
      ansible.builtin.set_fact:
        uptime_formatted: >-
          {{ (uptime_seconds | int // 86400) }} days
          {{ ((uptime_seconds | int % 86400) // 3600) }} hours
          {{ ((uptime_seconds | int % 3600) // 60) }} minutes

    # ================================================================
    # CPU
    # ================================================================

    - name: Collect CPU usage
      ansible.builtin.shell: |
        vmstat 1 2 | awk 'NR==4 {
          used=100-$15;
          if (used < 0) used=0;
          if (used > 100) used=100;
          printf "%.2f\n", used;
        }'
      args:
        executable: /bin/bash
      register: cpu_raw
      changed_when: false
      failed_when: false

    - name: Set CPU usage
      ansible.builtin.set_fact:
        cpu_usage: "{{ cpu_raw.stdout | default('0') | trim | float }}"

    - name: Set CPU quantity
      ansible.builtin.set_fact:
        cpu_count: "{{ ansible_processor_vcpus | default(ansible_processor_count | default(0)) | int }}"

    - name: Determine CPU status
      ansible.builtin.set_fact:
        cpu_status: >-
          {{
            'FAIL'
            if (cpu_usage | float) >= (cpu_critical | float)
            else 'WARNING'
            if (cpu_usage | float) >= (cpu_warning | float)
            else 'PASS'
          }}

    # ================================================================
    # MEMORY
    # ================================================================

    - name: Collect memory usage
      ansible.builtin.shell: |
        free -m | awk '/^Mem:/ {
          if ($2 > 0)
            printf "%d %.2f\n", $2, (($2-$7)/$2)*100;
          else
            print "0 0.00";
        }'
      args:
        executable: /bin/bash
      register: memory_raw
      changed_when: false
      failed_when: false

    - name: Set memory quantity and usage
      ansible.builtin.set_fact:
        memory_total_mb: "{{ memory_raw.stdout.split()[0] | default('0') | int }}"
        memory_usage: "{{ memory_raw.stdout.split()[1] | default('0') | float }}"

    - name: Determine memory status
      ansible.builtin.set_fact:
        memory_status: >-
          {{
            'FAIL'
            if (memory_usage | float) >= (memory_critical | float)
            else 'WARNING'
            if (memory_usage | float) >= (memory_warning | float)
            else 'PASS'
          }}

    # ================================================================
    # DISK
    # ================================================================

    - name: Collect filesystem disk usage
      ansible.builtin.shell: |
        df -P -k -x tmpfs -x devtmpfs |
        awk 'NR>1 {
          gsub("%","",$5);
          printf "%s|%d|%d|%d|%d\n",$6,$2,$3,$4,$5
        }'
      args:
        executable: /bin/bash
      register: disk_raw
      changed_when: false
      failed_when: false

    - name: Initialize disk facts
      ansible.builtin.set_fact:
        disk_total_gb: 0
        disk_used_gb: 0
        disk_free_gb: 0
        disk_status: "PASS"
        disk_report: []

    - name: Build disk report
      ansible.builtin.set_fact:
        disk_total_gb: >-
          {{
            (disk_total_gb | float) +
            ((item.split('|')[1] | int) / 1024 / 1024)
          }}

        disk_used_gb: >-
          {{
            (disk_used_gb | float) +
            ((item.split('|')[2] | int) / 1024 / 1024)
          }}

        disk_free_gb: >-
          {{
            (disk_free_gb | float) +
            ((item.split('|')[3] | int) / 1024 / 1024)
          }}

        disk_report: >-
          {{
            disk_report + [{
              'mount': item.split('|')[0],
              'total_gb': ((item.split('|')[1] | int) / 1024 / 1024) | round(2),
              'used_gb': ((item.split('|')[2] | int) / 1024 / 1024) | round(2),
              'free_gb': ((item.split('|')[3] | int) / 1024 / 1024) | round(2),
              'usage_pct': (item.split('|')[4] | float) | round(2)
            }]
          }}
      loop: "{{ disk_raw.stdout_lines | default([]) }}"
      when: item | trim | length > 0

    - name: Determine disk status
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'FAIL'
            if (
              disk_report
              | selectattr('usage_pct', 'ge', disk_critical | float)
              | list
              | length > 0
            )
            else 'WARNING'
            if (
              disk_report
              | selectattr('usage_pct', 'ge', disk_warning | float)
              | list
              | length > 0
            )
            else 'PASS'
          }}

    - name: Initialize root filesystem details
      ansible.builtin.set_fact:
        root_disk_total_gb: 0
        root_disk_used_gb: 0
        root_disk_free_gb: 0

    - name: Set root filesystem details
      ansible.builtin.set_fact:
        root_disk_total_gb: "{{ item.total_gb | float }}"
        root_disk_used_gb: "{{ item.used_gb | float }}"
        root_disk_free_gb: "{{ item.free_gb | float }}"
      loop: "{{ disk_report | default([]) }}"
      when: item.mount | default('') == '/'

    # ================================================================
    # NETWORK
    # ================================================================

    # IMPORTANT:
    # Interface information and RX/TX counters are collected together.
    # This avoids the previous HTML |first problem.

    - name: Collect network interface and traffic details
      ansible.builtin.shell: |
        while IFS='|' read -r iface rx tx; do
          [ -z "$iface" ] && continue

          state=$(ip -o -br link show "$iface" 2>/dev/null | awk '{print $2}')

          addresses=$(
            ip -o -br addr show "$iface" 2>/dev/null |
            awk '{for(i=3;i<=NF;i++) printf "%s%s", (i==3?"":" "), $i}'
          )

          printf '%s|%s|%s|%s|%s\n' \
            "$iface" \
            "${state:-UNKNOWN}" \
            "${addresses:-}" \
            "$rx" \
            "$tx"

        done < <(
          awk -F'[: ]+' '
            NR>2 && $2!="" {
              printf "%s|%s|%s\n",$2,$3,$11
            }
          ' /proc/net/dev
        )
      args:
        executable: /bin/bash
      register: network_combined_raw
      changed_when: false
      failed_when: false

    - name: Initialize network reports
      ansible.builtin.set_fact:
        network_report: []
        network_traffic_report: []

    - name: Build network report with traffic counters
      ansible.builtin.set_fact:
        network_report: >-
          {{
            network_report + [{
              'interface': item.split('|')[0],
              'state': item.split('|')[1] | default('UNKNOWN'),
              'addresses': item.split('|')[2] | default(''),
              'rx_mb': ((item.split('|')[3] | int) / 1024 / 1024) | round(2),
              'tx_mb': ((item.split('|')[4] | int) / 1024 / 1024) | round(2)
            }]
          }}
      loop: "{{ network_combined_raw.stdout_lines | default([]) }}"
      when:
        - item.split('|') | length >= 5
        - item.split('|')[0] | trim | length > 0

    - name: Build network traffic report
      ansible.builtin.set_fact:
        network_traffic_report: >-
          {{
            network_traffic_report + [{
              'interface': item.interface,
              'rx_mb': item.rx_mb,
              'tx_mb': item.tx_mb
            }]
          }}
      loop: "{{ network_report | default([]) }}"
      when: network_report | default([]) | length > 0

    # ================================================================
    # USERS
    # ================================================================

    - name: Collect logged in users
      ansible.builtin.command: who
      register: logged_users_raw
      changed_when: false
      failed_when: false

    - name: Count logged in users
      ansible.builtin.set_fact:
        logged_user_count: "{{ logged_users_raw.stdout_lines | default([]) | length }}"

    # ================================================================
    # SERVICES
    # ================================================================

    - name: Collect all running services
      ansible.builtin.shell: |
        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager |
        awk '{print $1 "|" $4}'
      args:
        executable: /bin/bash
      register: running_services_raw
      changed_when: false
      failed_when: false

    - name: Initialize running service report
      ansible.builtin.set_fact:
        running_service_report: []

    - name: Build running service report
      ansible.builtin.set_fact:
        running_service_report: >-
          {{
            running_service_report + [{
              'service': item.split('|')[0],
              'status': item.split('|')[1] | default('running')
            }]
          }}
      loop: "{{ running_services_raw.stdout_lines | default([]) }}"
      when: item | trim | length > 0

    - name: Collect running service details and resource usage
      ansible.builtin.shell: |
        set -o pipefail

        systemctl list-units \
          --type=service \
          --state=running \
          --no-legend \
          --no-pager |
        awk '{print $1}' |
        while read -r svc; do

          [ -z "$svc" ] && continue

          pid=$(systemctl show "$svc" -p MainPID --value 2>/dev/null)
          restarts=$(systemctl show "$svc" -p NRestarts --value 2>/dev/null)
          active_since=$(systemctl show "$svc" -p ActiveEnterTimestamp --value 2>/dev/null)

          if [ "${pid:-0}" -gt 0 ] 2>/dev/null; then

            psline=$(
              ps -p "$pid" \
                -o %cpu=,%mem=,comm=,args= 2>/dev/null |
              sed 's/^[[:space:]]*//'
            )

            cpu=$(printf '%s\n' "$psline" | awk '{print $1}')
            mem=$(printf '%s\n' "$psline" | awk '{print $2}')
            cmd=$(printf '%s\n' "$psline" | cut -d' ' -f3-)

          else

            cpu="0.00"
            mem="0.00"
            cmd="N/A"

          fi

          printf '%s|%s|%s|%s|%s|%s|%s\n' \
            "$svc" \
            "${pid:-0}" \
            "${cpu:-0.00}" \
            "${mem:-0.00}" \
            "${restarts:-0}" \
            "${active_since:-N/A}" \
            "${cmd:-N/A}"

        done
      args:
        executable: /bin/bash
      register: running_service_details_raw
      changed_when: false
      failed_when: false

    - name: Initialize service usage report
      ansible.builtin.set_fact:
        service_usage_report: []

    - name: Build service usage report
      ansible.builtin.set_fact:
        service_usage_report: >-
          {{
            service_usage_report + [{
              'service': item.split('|')[0],
              'pid': item.split('|')[1] | int,
              'cpu_pct': item.split('|')[2] | float,
              'mem_pct': item.split('|')[3] | float,
              'restarts': item.split('|')[4] | int,
              'active_since': item.split('|')[5] | default('N/A'),
              'command': item.split('|')[6] | default('N/A')
            }]
          }}
      loop: "{{ running_service_details_raw.stdout_lines | default([]) }}"
      when: item.split('|') | length >= 7

    - name: Check configured services
      ansible.builtin.command: systemctl is-active "{{ item }}"
      register: configured_service_results
      changed_when: false
      failed_when: false
      loop: "{{ health_check_services | default([]) }}"

    - name: Initialize configured service report
      ansible.builtin.set_fact:
        configured_service_report: []

    - name: Build configured service status
      ansible.builtin.set_fact:
        configured_service_report: >-
          {{
            configured_service_report + [{
              'service': item.item,
              'status': item.stdout | default('inactive') | trim
            }]
          }}
      loop: "{{ configured_service_results.results | default([]) }}"
      when: item.item is defined

    - name: Determine configured service health
      ansible.builtin.set_fact:
        service_status: >-
          {{
            'FAIL'
            if (
              configured_service_report | default([])
              | selectattr('status', 'ne', 'active')
              | list
              | length > 0
            )
            else 'PASS'
          }}

    # ================================================================
    # TOP PROCESSES
    # ================================================================

    - name: Collect top processes by CPU
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,%cpu,%mem,comm,args \
          --sort=-%cpu \
          --no-headers |
        head -20
      args:
        executable: /bin/bash
      register: top_cpu_processes
      changed_when: false
      failed_when: false

    - name: Collect top processes by memory
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,%cpu,%mem,comm,args \
          --sort=-%mem \
          --no-headers |
        head -20
      args:
        executable: /bin/bash
      register: top_memory_processes
      changed_when: false
      failed_when: false

    # ================================================================
    # SAP
    # ================================================================

    - name: Collect SAP processes
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,%cpu,%mem,comm,args --no-headers |
        grep -E 'sapstartsrv|disp\+work|gwrd|icman|msg_server|enserver|jlaunch|hdbnameserver|hdbindexserver' |
        grep -v grep || true
      args:
        executable: /bin/bash
      register: sap_processes_raw
      changed_when: false
      failed_when: false

    - name: Determine SAP status
      ansible.builtin.set_fact:
        sap_detected: "{{ (sap_processes_raw.stdout | default('') | trim | length) > 0 }}"
        sap_status: >-
          {{
            'PASS'
            if (sap_processes_raw.stdout | default('') | trim | length) > 0
            else 'N/A'
          }}

    - name: Discover SAP instance information
      ansible.builtin.shell: |
        ps -eo user,pid,args --no-headers |
        grep -E 'sapstartsrv|disp\+work|gwrd|icman|msg_server' |
        grep -v grep || true
      args:
        executable: /bin/bash
      register: sap_instances_raw
      changed_when: false
      failed_when: false
      when: sap_detected | default(false)

    # ================================================================
    # FINAL HEALTH CALCULATION
    # ================================================================

    - name: Set SSH status
      ansible.builtin.set_fact:
        ssh_status: >-
          {{
            'PASS'
            if (
              (ssh_port_result.failed | default(false) | bool) == false
              and
              (ssh_service_result.stdout | default('') | trim) == 'active'
            )
            else 'FAIL'
          }}

    - name: Determine overall health and failure reasons
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'FAIL'
            if (
              cpu_status == 'FAIL'
              or memory_status == 'FAIL'
              or disk_status == 'FAIL'
              or ssh_status == 'FAIL'
              or service_status == 'FAIL'
            )
            else 'WARNING'
            if (
              cpu_status == 'WARNING'
              or memory_status == 'WARNING'
              or disk_status == 'WARNING'
            )
            else 'PASS'
          }}

        health_failure_reasons: >-
          {{
            []
            + (['CPU usage is critical']
               if cpu_status == 'FAIL' else [])
            + (['Memory usage is critical']
               if memory_status == 'FAIL' else [])
            + (['Disk usage is critical']
               if disk_status == 'FAIL' else [])
            + (['SSH service or port is unavailable']
               if ssh_status == 'FAIL' else [])
            + (['Configured service is not active']
               if service_status == 'FAIL' else [])
          }}

    # ================================================================
    # CONSOLE REPORT
    # ================================================================

    - name: Display clean Linux health report
      ansible.builtin.debug:
        msg:
          - ""
          - "======================================================================"
          - "                    LINUX SERVER HEALTH CHECK"
          - "======================================================================"
          - "Server              : {{ ansible_host | default(inventory_hostname) }}"
          - "Hostname            : {{ ansible_hostname | default(inventory_hostname) }}"
          - "OS                  : {{ ansible_distribution | default('N/A') }} {{ ansible_distribution_version | default('') }}"
          - "Kernel              : {{ ansible_kernel | default('N/A') }}"
          - "Architecture        : {{ ansible_architecture | default('N/A') }}"
          - "Overall Health      : {{ overall_health }}"
          - "======================================================================"
          - ""
          - "[ AVAILABILITY ]"
          - "----------------------------------------------------------------------"
          - "Ansible Ping        : {{ 'PASS' if (ping_result.ping | default('') == 'pong') else 'FAIL' }}"
          - "SSH Port {{ ansible_port | default(22) }}         : {{ 'PASS' if not (ssh_port_result.failed | default(false) | bool) else 'FAIL' }}"
          - "SSH Service         : {{ ssh_status }}"
          - "Uptime              : {{ uptime_formatted }}"
          - ""
          - "[ CPU ]"
          - "----------------------------------------------------------------------"
          - "CPU Quantity        : {{ cpu_count | int }} vCPU"
          - "CPU Usage           : {{ '%.2f' | format(cpu_usage | float) }} %"
          - "CPU Warning         : {{ cpu_warning }} %"
          - "CPU Critical        : {{ cpu_critical }} %"
          - "CPU Status          : {{ cpu_status }}"
          - ""
          - "[ MEMORY ]"
          - "----------------------------------------------------------------------"
          - "Memory Total        : {{ '%.2f' | format((memory_total_mb | int) / 1024) }} GB"
          - "Memory Usage        : {{ '%.2f' | format(memory_usage | float) }} %"
          - "Memory Status       : {{ memory_status }}"
          - ""
          - "[ DISK ]"
          - "----------------------------------------------------------------------"
          - "Disk Total          : {{ '%.2f' | format(disk_total_gb | float) }} GB"
          - "Disk Used           : {{ '%.2f' | format(disk_used_gb | float) }} GB"
          - "Disk Free           : {{ '%.2f' | format(disk_free_gb | float) }} GB"
          - "Root Disk Total     : {{ '%.2f' | format(root_disk_total_gb | float) }} GB"
          - "Root Disk Used      : {{ '%.2f' | format(root_disk_used_gb | float) }} GB"
          - "Root Disk Free      : {{ '%.2f' | format(root_disk_free_gb | float) }} GB"
          - "Disk Status         : {{ disk_status }}"
          - ""
          - "Filesystem Details:"
          - "{{ disk_report | default([]) }}"
          - ""
          - "[ NETWORK ]"
          - "----------------------------------------------------------------------"
          - "Interfaces          : {{ network_report | default([]) | length }}"
          - "Network Traffic     : RX/TX counters collected"
          - "Interface Details   :"
          - "{{ network_report | default([]) }}"
          - ""
          - "[ USERS ]"
          - "----------------------------------------------------------------------"
          - "Logged-in Users     : {{ logged_user_count }}"
          - "{{ logged_users_raw.stdout | default('No users logged in') }}"
          - ""
          - "[ SERVICES ]"
          - "----------------------------------------------------------------------"
          - "Configured Services : {{ (health_check_services | default([])) | join(', ') if (health_check_services | default([]) | length > 0) else 'None configured' }}"
          - "Service Status      : {{ service_status }}"
          - "Running Services    : {{ running_service_report | default([]) | length }}"
          - "Running Service List:"
          - "{{ (running_service_report | default([]) | map(attribute='service') | list | join(', ')) if (running_service_report | default([]) | length > 0) else 'None detected' }}"
          - "Service Usage / Command:"
          - "{{ service_usage_report | default([]) }}"
          - ""
          - "[ TOP PROCESSES ]"
          - "----------------------------------------------------------------------"
          - "Top CPU Processes:"
          - "{{ top_cpu_processes.stdout | default('N/A') }}"
          - ""
          - "Top Memory Processes:"
          - "{{ top_memory_processes.stdout | default('N/A') }}"
          - ""
          - "[ SAP ]"
          - "----------------------------------------------------------------------"
          - "SAP Status          : {{ sap_status }}"
          - "SAP Processes:"
          - "{{ sap_processes_raw.stdout | default('No SAP processes detected') }}"
          - ""
          - "[ HEALTH SUMMARY ]"
          - "----------------------------------------------------------------------"
          - "Overall Health      : {{ overall_health }}"
          - "Failure Reasons     : {{ health_failure_reasons | default([]) | join('; ') if (health_failure_reasons | default([]) | length > 0) else 'None' }}"
          - "======================================================================"
          - ""

    # ================================================================
    # DETAILED DEBUG
    # ================================================================

    - name: Display detailed disk report
      ansible.builtin.debug:
        msg: "{{ item.mount }} | Total: {{ item.total_gb }} GB | Used: {{ item.used_gb }} GB | Free: {{ item.free_gb }} GB | Usage: {{ item.usage_pct }}%"
      loop: "{{ disk_report | default([]) }}"
      loop_control:
        label: "{{ item.mount }}"
      when: disk_report | default([]) | length > 0

    - name: Display configured service report
      ansible.builtin.debug:
        msg: "{{ item.service }} | Status: {{ item.status }}"
      loop: "{{ configured_service_report | default([]) }}"
      loop_control:
        label: "{{ item.service }}"
      when: configured_service_report | default([]) | length > 0

    - name: Display SAP instance details
      ansible.builtin.debug:
        msg: "{{ sap_instances_raw.stdout | default('No SAP instance information available') }}"
      when: sap_detected | default(false)

    # ================================================================
    # REPORT DIRECTORY
    # ================================================================

    - name: Create health report directory
      ansible.builtin.file:
        path: /tmp/ansible_health_reports
        state: directory
        mode: "0755"
      changed_when: false

    # ================================================================
    # STRUCTURED JSON DATA
    # ================================================================

    - name: Build structured health report
      ansible.builtin.set_fact:
        health_report:
          server: "{{ ansible_host | default(inventory_hostname) }}"
          hostname: "{{ ansible_hostname | default(inventory_hostname) }}"
          os: "{{ ansible_distribution | default('N/A') }} {{ ansible_distribution_version | default('') }}"
          kernel: "{{ ansible_kernel | default('N/A') }}"
          architecture: "{{ ansible_architecture | default('N/A') }}"
          report_time: "{{ ansible_date_time.iso8601 | default('N/A') }}"
          overall_health: "{{ overall_health | default('UNKNOWN') }}"
          failure_reasons: "{{ health_failure_reasons | default([]) }}"

          availability:
            ansible_ping: "{{ 'PASS' if (ping_result.ping | default('') == 'pong') else 'FAIL' }}"
            ssh_port: "{{ 'PASS' if not (ssh_port_result.failed | default(false) | bool) else 'FAIL' }}"
            ssh_service: "{{ ssh_status | default('UNKNOWN') }}"
            uptime: "{{ uptime_formatted | default('N/A') }}"

          cpu:
            quantity_vcpu: "{{ cpu_count | default(0) | int }}"
            usage_percent: "{{ cpu_usage | default(0) | float | round(2) }}"
            status: "{{ cpu_status | default('UNKNOWN') }}"

          memory:
            total_gb: "{{ ((memory_total_mb | default(0) | int) / 1024) | round(2) }}"
            usage_percent: "{{ memory_usage | default(0) | float | round(2) }}"
            status: "{{ memory_status | default('UNKNOWN') }}"

          disk:
            total_gb: "{{ disk_total_gb | default(0) | float | round(2) }}"
            used_gb: "{{ disk_used_gb | default(0) | float | round(2) }}"
            free_gb: "{{ disk_free_gb | default(0) | float | round(2) }}"
            status: "{{ disk_status | default('UNKNOWN') }}"
            filesystems: "{{ disk_report | default([]) }}"

          network:
            interfaces: "{{ network_report | default([]) }}"
            traffic: "{{ network_traffic_report | default([]) }}"

          users:
            count: "{{ logged_user_count | default(0) | int }}"
            details: "{{ logged_users_raw.stdout | default('No users logged in') }}"

          services:
            configured_status: "{{ service_status | default('UNKNOWN') }}"
            configured: "{{ configured_service_report | default([]) }}"
            running_count: "{{ running_service_report | default([]) | length }}"
            running: "{{ running_service_report | default([]) }}"
            usage: "{{ service_usage_report | default([]) }}"

          sap:
            status: "{{ sap_status | default('N/A') }}"
            processes: "{{ sap_processes_raw.stdout | default('No SAP processes detected') }}"
            instances: "{{ sap_instances_raw.stdout | default('No SAP instance information available') }}"

          top_processes:
            cpu: "{{ top_cpu_processes.stdout | default('N/A') }}"
            memory: "{{ top_memory_processes.stdout | default('N/A') }}"

    # ================================================================
    # JSON REPORT
    # ================================================================

    - name: Write JSON health report
      ansible.builtin.copy:
        dest: "/tmp/ansible_health_reports/{{ inventory_hostname }}_health_report.json"
        mode: "0644"
        content: "{{ health_report | to_nice_json(indent=2) }}"
      changed_when: false

    # ================================================================
    # CSV REPORT
    # ================================================================

    - name: Write CSV health report
      ansible.builtin.copy:
        dest: "/tmp/ansible_health_reports/{{ inventory_hostname }}_health_report.csv"
        mode: "0644"
        content: |
          Server,Hostname,OS,Kernel,Architecture,Overall Health,CPU vCPU,CPU Usage %,CPU Status,Memory Total GB,Memory Usage %,Memory Status,Disk Total GB,Disk Used GB,Disk Free GB,Disk Status,SSH Status,SAP Status,Running Services,Logged-in Users,Uptime,Failure Reasons
          "{{ ansible_host | default(inventory_hostname) }}","{{ ansible_hostname | default(inventory_hostname) }}","{{ ansible_distribution | default('N/A') }} {{ ansible_distribution_version | default('') }}","{{ ansible_kernel | default('N/A') }}","{{ ansible_architecture | default('N/A') }}","{{ overall_health | default('UNKNOWN') }}","{{ cpu_count | default(0) | int }}","{{ cpu_usage | default(0) | float | round(2) }}","{{ cpu_status | default('UNKNOWN') }}","{{ ((memory_total_mb | default(0) | int) / 1024) | round(2) }}","{{ memory_usage | default(0) | float | round(2) }}","{{ memory_status | default('UNKNOWN') }}","{{ disk_total_gb | default(0) | float | round(2) }}","{{ disk_used_gb | default(0) | float | round(2) }}","{{ disk_free_gb | default(0) | float | round(2) }}","{{ disk_status | default('UNKNOWN') }}","{{ ssh_status | default('UNKNOWN') }}","{{ sap_status | default('N/A') }}","{{ running_service_report | default([]) | length }}","{{ logged_user_count | default(0) | int }}","{{ uptime_formatted | default('N/A') }}","{{ health_failure_reasons | default([]) | join('; ') }}"

      changed_when: false

    # ================================================================
    # HTML REPORT
    # ================================================================

    - name: Write HTML health report
      ansible.builtin.copy:
        dest: "/tmp/ansible_health_reports/{{ inventory_hostname }}_health_report.html"
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">

          <title>
            Linux Health Report - {{ ansible_hostname | default(inventory_hostname) }}
          </title>

          <style>
          body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            margin: 30px;
          }

          h1 {
            margin-bottom: 5px;
          }

          .meta {
            color: #555;
            margin-bottom: 20px;
          }

          .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
          }

          table {
            border-collapse: collapse;
            width: 100%;
            background: #fff;
            margin: 12px 0 25px;
          }

          th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
          }

          th {
            background: #eef1f4;
          }

          .PASS {
            color: #16803c;
            font-weight: bold;
          }

          .WARNING {
            color: #b06a00;
            font-weight: bold;
          }

          .FAIL {
            color: #c62828;
            font-weight: bold;
          }

          pre {
            white-space: pre-wrap;
            background: #fafafa;
            padding: 12px;
            border: 1px solid #eee;
          }
          </style>

          </head>

          <body>

          <h1>Linux Server Health Check</h1>

          <div class="meta">
            <b>Server:</b>
            {{ ansible_host | default(inventory_hostname) }}

            |

            <b>Hostname:</b>
            {{ ansible_hostname | default(inventory_hostname) }}

            |

            <b>OS:</b>
            {{ ansible_distribution | default('N/A') }}
            {{ ansible_distribution_version | default('') }}

            |

            <b>Report Time:</b>
            {{ ansible_date_time.iso8601 | default('N/A') }}
          </div>

          <!-- ====================================================== -->
          <!-- OVERALL HEALTH -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>
              Overall Health:
              <span class="{{ overall_health }}">
                {{ overall_health }}
              </span>
            </h2>

            <b>Failure Reasons:</b>

            {% if health_failure_reasons | default([]) | length > 0 %}

            <ul>
            {% for r in health_failure_reasons %}
              <li>{{ r }}</li>
            {% endfor %}
            </ul>

            {% else %}

            <span class="PASS">None</span>

            {% endif %}

          </div>

          <!-- ====================================================== -->
          <!-- AVAILABILITY -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Availability</h2>

            <table>

              <tr>
                <th>Check</th>
                <th>Status</th>
                <th>Details</th>
              </tr>

              <tr>
                <td>Ansible Ping</td>

                <td class="{{ 'PASS' if ping_result.ping | default('') == 'pong' else 'FAIL' }}">
                  {{ 'PASS' if ping_result.ping | default('') == 'pong' else 'FAIL' }}
                </td>

                <td></td>
              </tr>

              <tr>

                <td>SSH Port</td>

                <td class="{{ 'PASS' if not (ssh_port_result.failed | default(false) | bool) else 'FAIL' }}">
                  {{ 'PASS' if not (ssh_port_result.failed | default(false) | bool) else 'FAIL' }}
                </td>

                <td>
                  Port {{ ansible_port | default(22) }}
                </td>

              </tr>

              <tr>

                <td>SSH Service</td>

                <td class="{{ ssh_status }}">
                  {{ ssh_status }}
                </td>

                <td></td>

              </tr>

              <tr>

                <td>Uptime</td>

                <td class="PASS">
                  PASS
                </td>

                <td>
                  {{ uptime_formatted }}
                </td>

              </tr>

            </table>

          </div>

          <!-- ====================================================== -->
          <!-- CPU -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>CPU</h2>

            <table>

              <tr>
                <th>Quantity</th>
                <th>Usage</th>
                <th>Warning</th>
                <th>Critical</th>
                <th>Status</th>
              </tr>

              <tr>

                <td>
                  {{ cpu_count }} vCPU
                </td>

                <td>
                  {{ '%.2f' | format(cpu_usage | float) }}%
                </td>

                <td>
                  {{ cpu_warning }}%
                </td>

                <td>
                  {{ cpu_critical }}%
                </td>

                <td class="{{ cpu_status }}">
                  {{ cpu_status }}
                </td>

              </tr>

            </table>

          </div>

          <!-- ====================================================== -->
          <!-- MEMORY -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Memory</h2>

            <table>

              <tr>
                <th>Total</th>
                <th>Usage</th>
                <th>Status</th>
              </tr>

              <tr>

                <td>
                  {{ '%.2f' | format((memory_total_mb | int) / 1024) }} GB
                </td>

                <td>
                  {{ '%.2f' | format(memory_usage | float) }}%
                </td>

                <td class="{{ memory_status }}">
                  {{ memory_status }}
                </td>

              </tr>

            </table>

          </div>

          <!-- ====================================================== -->
          <!-- DISK -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Disk</h2>

            <table>

              <tr>
                <th>Mount</th>
                <th>Total GB</th>
                <th>Used GB</th>
                <th>Free GB</th>
                <th>Usage %</th>
                <th>Status</th>
              </tr>

              {% for d in disk_report | default([]) %}

              {% set ds =
                'FAIL'
                if d.usage_pct | float >= disk_critical | float
                else 'WARNING'
                if d.usage_pct | float >= disk_warning | float
                else 'PASS'
              %}

              <tr>

                <td>{{ d.mount }}</td>
                <td>{{ d.total_gb }}</td>
                <td>{{ d.used_gb }}</td>
                <td>{{ d.free_gb }}</td>
                <td>{{ d.usage_pct }}%</td>

                <td class="{{ ds }}">
                  {{ ds }}
                </td>

              </tr>

              {% endfor %}

              <tr>

                <th>Total</th>

                <th>
                  {{ '%.2f' | format(disk_total_gb | float) }}
                </th>

                <th>
                  {{ '%.2f' | format(disk_used_gb | float) }}
                </th>

                <th>
                  {{ '%.2f' | format(disk_free_gb | float) }}
                </th>

                <th></th>

                <th class="{{ disk_status }}">
                  {{ disk_status }}
                </th>

              </tr>

            </table>

          </div>

          <!-- ====================================================== -->
          <!-- NETWORK -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Network</h2>

            <table>

              <tr>
                <th>Interface</th>
                <th>State</th>
                <th>Addresses</th>
                <th>RX MB</th>
                <th>TX MB</th>
              </tr>

              {% for n in network_report | default([]) %}

              <tr>

                <td>
                  {{ n.interface }}
                </td>

                <td>
                  {{ n.state }}
                </td>

                <td>
                  {{ n.addresses | default('') }}
                </td>

                <td>
                  {{ n.rx_mb | default(0) }}
                </td>

                <td>
                  {{ n.tx_mb | default(0) }}
                </td>

              </tr>

              {% endfor %}

            </table>

          </div>

          <!-- ====================================================== -->
          <!-- USERS -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Users</h2>

            <p>
              <b>Logged-in users:</b>
              {{ logged_user_count }}
            </p>

            <pre>{{ logged_users_raw.stdout | default('No users logged in') }}</pre>

          </div>

          <!-- ====================================================== -->
          <!-- SERVICES -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Services</h2>

            <p>

              <b>Configured service status:</b>

              <span class="{{ service_status }}">
                {{ service_status }}
              </span>

            </p>

            <p>
              <b>Running services:</b>
              {{ running_service_report | default([]) | length }}
            </p>

            <table>

              <tr>

                <th>Service</th>
                <th>PID</th>
                <th>CPU %</th>
                <th>Memory %</th>
                <th>Restarts</th>
                <th>Command</th>

              </tr>

              {% for s in service_usage_report | default([]) %}

              <tr>

                <td>{{ s.service }}</td>
                <td>{{ s.pid }}</td>
                <td>{{ s.cpu_pct }}</td>
                <td>{{ s.mem_pct }}</td>
                <td>{{ s.restarts }}</td>
                <td>{{ s.command }}</td>

              </tr>

              {% endfor %}

            </table>

          </div>

          <!-- ====================================================== -->
          <!-- SAP -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>SAP</h2>

            <p>

              <b>Status:</b>

              <span class="{{ sap_status }}">
                {{ sap_status }}
              </span>

            </p>

            <pre>
          {{ sap_processes_raw.stdout | default('No SAP processes detected') }}
            </pre>

          </div>

          <!-- ====================================================== -->
          <!-- TOP PROCESSES -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>Top CPU Processes</h2>

            <pre>
          {{ top_cpu_processes.stdout | default('N/A') }}
            </pre>

            <h2>Top Memory Processes</h2>

            <pre>
          {{ top_memory_processes.stdout | default('N/A') }}
            </pre>

          </div>

          <!-- ====================================================== -->
          <!-- FINAL RESULT -->
          <!-- ====================================================== -->

          <div class="card">

            <h2>
              Final Result:

              <span class="{{ overall_health }}">
                {{ overall_health }}
              </span>
            </h2>

          </div>

          </body>
          </html>

      changed_when: false

    # ================================================================
    # FETCH REPORTS
    # ================================================================

    - name: Fetch JSON health report to AWX
      ansible.builtin.fetch:
        src: "/tmp/ansible_health_reports/{{ inventory_hostname }}_health_report.json"
        dest: "/tmp/awx_health_reports/{{ inventory_hostname }}/"
        flat: true
      changed_when: false

    - name: Fetch CSV health report to AWX
      ansible.builtin.fetch:
        src: "/tmp/ansible_health_reports/{{ inventory_hostname }}_health_report.csv"
        dest: "/tmp/awx_health_reports/{{ inventory_hostname }}/"
        flat: true
      changed_when: false

    - name: Fetch HTML health report to AWX
      ansible.builtin.fetch:
        src: "/tmp/ansible_health_reports/{{ inventory_hostname }}_health_report.html"
        dest: "/tmp/awx_health_reports/{{ inventory_hostname }}/"
        flat: true
      changed_when: false

    # ================================================================
    # AWX JOB OUTPUT
    # ================================================================

    - name: Publish report information to AWX
      ansible.builtin.set_stats:
        data:
          health_report_server: "{{ ansible_host | default(inventory_hostname) }}"
          health_report_overall: "{{ overall_health }}"

          health_report_json: >-
            /tmp/awx_health_reports/{{ inventory_hostname }}/{{ inventory_hostname }}_health_report.json

          health_report_csv: >-
            /tmp/awx_health_reports/{{ inventory_hostname }}/{{ inventory_hostname }}_health_report.csv

          health_report_html: >-
            /tmp/awx_health_reports/{{ inventory_hostname }}/{{ inventory_hostname }}_health_report.html

        per_host: true
        aggregate: true

      changed_when: false
