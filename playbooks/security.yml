---
- name: Linux Security Audit / Penetration Test Assessment
  hosts: all
  gather_facts: true
  become: true
  ignore_unreachable: false

  vars:

    # ============================================================
    # SECURITY THRESHOLDS
    # ============================================================

    max_failed_logins_warning: 10
    max_failed_logins_critical: 50

    disk_warning_percent: 80
    disk_critical_percent: 90

    # Set to true only if you want password SSH authentication
    # to be considered a finding.
    ssh_password_auth_should_be_disabled: true

    # Root SSH login should normally be disabled.
    ssh_root_login_should_be_disabled: true

    # IP forwarding normally should be disabled on general servers.
    # Set false for routers/firewalls/Kubernetes/network nodes.
    ip_forwarding_should_be_disabled: true

    # ============================================================
    # REPORT DIRECTORY
    # ============================================================

    report_base_dir: "/tmp/ansible_security_reports"

  pre_tasks:

    - name: Initialize security report variables
      ansible.builtin.set_fact:

        security_findings: []

        security_warning_count: 0

        security_fail_count: 0

        security_pass_count: 0

        report_status: "PASS"

    - name: Test Ansible connectivity
      ansible.builtin.ping:
      register: ping_result
      changed_when: false

  tasks:

    # ============================================================
    # BASIC SYSTEM INFORMATION
    # ============================================================

    - name: Collect hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Collect kernel
      ansible.builtin.command: uname -r
      register: kernel_result
      changed_when: false

    - name: Collect architecture
      ansible.builtin.command: uname -m
      register: architecture_result
      changed_when: false

    - name: Collect operating system
      ansible.builtin.shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "${PRETTY_NAME:-Unknown}"
        else
          echo "Unknown"
        fi
      args:
        executable: /bin/bash
      register: os_result
      changed_when: false

    # ============================================================
    # SSH SECURITY
    # ============================================================

    - name: Check SSH configuration
      ansible.builtin.shell: |
        if command -v sshd >/dev/null 2>&1; then
          sshd -T 2>/dev/null
        elif [ -x /usr/sbin/sshd ]; then
          /usr/sbin/sshd -T 2>/dev/null
        else
          echo "SSHD_NOT_FOUND"
        fi
      args:
        executable: /bin/bash
      register: ssh_config
      changed_when: false
      failed_when: false

    - name: Determine SSH root login setting
      ansible.builtin.shell: |
        echo "{{ ssh_config.stdout }}" |
        awk '$1=="permitrootlogin"{print $2}' |
        tail -1
      register: ssh_root_login
      changed_when: false

    - name: Determine SSH password authentication
      ansible.builtin.shell: |
        echo "{{ ssh_config.stdout }}" |
        awk '$1=="passwordauthentication"{print $2}' |
        tail -1
      register: ssh_password_auth
      changed_when: false

    - name: Determine SSH protocol
      ansible.builtin.shell: |
        echo "{{ ssh_config.stdout }}" |
        awk '$1=="protocol"{print $2}' |
        tail -1
      register: ssh_protocol
      changed_when: false

    - name: Check SSH service
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl is-active sshd 2>/dev/null ||
          systemctl is-active ssh 2>/dev/null ||
          echo "inactive"
        else
          echo "unknown"
        fi
      register: ssh_service
      changed_when: false
      failed_when: false

    # ============================================================
    # LISTENING PORTS
    # ============================================================

    - name: Collect listening TCP ports
      ansible.builtin.shell: |
        if command -v ss >/dev/null 2>&1; then
          ss -lntup
        elif command -v netstat >/dev/null 2>&1; then
          netstat -lntup
        else
          echo "NO_SOCKET_TOOL"
        fi
      register: listening_ports
      changed_when: false
      failed_when: false

    # ============================================================
    # FIREWALL
    # ============================================================

    - name: Check firewalld
      ansible.builtin.shell: |
        if command -v firewall-cmd >/dev/null 2>&1; then
          firewall-cmd --state 2>/dev/null
        else
          echo "NOT_INSTALLED"
        fi
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: Check ufw
      ansible.builtin.shell: |
        if command -v ufw >/dev/null 2>&1; then
          ufw status 2>/dev/null | head -1
        else
          echo "NOT_INSTALLED"
        fi
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Check nftables
      ansible.builtin.shell: |
        if command -v nft >/dev/null 2>&1; then
          nft list ruleset 2>/dev/null | head -50
        else
          echo "NOT_INSTALLED"
        fi
      register: nftables_status
      changed_when: false
      failed_when: false

    # ============================================================
    # USERS
    # ============================================================

    - name: Collect logged-in users
      ansible.builtin.shell: |
        who 2>/dev/null || true
      register: logged_users
      changed_when: false
      failed_when: false

    - name: Collect UID 0 accounts
      ansible.builtin.shell: |
        awk -F: '$3 == 0 {print $1}' /etc/passwd
      register: uid_zero_users
      changed_when: false

    - name: Collect sudo group users
      ansible.builtin.shell: |
        if getent group sudo >/dev/null 2>&1; then
          getent group sudo
        else
          echo "NO_SUDO_GROUP"
        fi
      register: sudo_group_users
      changed_when: false
      failed_when: false

    - name: Collect wheel group users
      ansible.builtin.shell: |
        if getent group wheel >/dev/null 2>&1; then
          getent group wheel
        else
          echo "NO_WHEEL_GROUP"
        fi
      register: wheel_group_users
      changed_when: false
      failed_when: false

    # ============================================================
    # FAILED LOGIN ATTEMPTS
    # ============================================================

    - name: Collect failed login count
      ansible.builtin.shell: |
        if command -v faillog >/dev/null 2>&1; then
          faillog -a 2>/dev/null |
          awk 'NR>2 && $1!="Login" {count++} END {print count+0}'
        elif command -v lastb >/dev/null 2>&1; then
          lastb 2>/dev/null |
          grep -v "^$" |
          grep -v "^btmp" |
          wc -l
        else
          echo "0"
        fi
      register: failed_login_count
      changed_when: false
      failed_when: false

    # ============================================================
    # PASSWORD / ACCOUNT SECURITY
    # ============================================================

    - name: Find accounts with empty passwords
      ansible.builtin.shell: |
        awk -F: '($2 == "") {print $1}' /etc/shadow 2>/dev/null || true
      register: empty_password_accounts
      changed_when: false
      failed_when: false

    - name: Find passwordless login shells
      ansible.builtin.shell: |
        awk -F: '
        ($7 ~ /(\/bash|\/sh|\/ksh|\/zsh)$/) {print $1}
        ' /etc/passwd
      register: login_shell_accounts
      changed_when: false

    # ============================================================
    # SUDO CONFIGURATION
    # ============================================================

    - name: Collect sudo configuration
      ansible.builtin.shell: |
        if command -v sudo >/dev/null 2>&1; then
          sudo -n -l 2>/dev/null || true
        fi
      register: sudo_config
      changed_when: false
      failed_when: false

    - name: Check sudoers permissions
      ansible.builtin.stat:
        path: /etc/sudoers
      register: sudoers_stat

    - name: Check sudoers.d permissions
      ansible.builtin.shell: |
        if [ -d /etc/sudoers.d ]; then
          find /etc/sudoers.d -type f -printf '%m %p\n' 2>/dev/null
        fi
      register: sudoers_d_permissions
      changed_when: false
      failed_when: false

    # ============================================================
    # SUID / SGID
    # ============================================================

    - name: Find SUID files
      ansible.builtin.shell: |
        find / -xdev -type f -perm -4000 \
        -printf '%m %u %g %p\n' 2>/dev/null |
        head -200
      register: suid_files
      changed_when: false
      failed_when: false

    - name: Find SGID files
      ansible.builtin.shell: |
        find / -xdev -type f -perm -2000 \
        -printf '%m %u %g %p\n' 2>/dev/null |
        head -200
      register: sgid_files
      changed_when: false
      failed_when: false

    # ============================================================
    # WORLD WRITABLE FILES / DIRECTORIES
    # ============================================================

    - name: Find world writable directories
      ansible.builtin.shell: |
        find / -xdev -type d -perm -0002 \
        ! -path "/proc/*" \
        ! -path "/sys/*" \
        ! -path "/run/*" \
        -printf '%m %u %g %p\n' 2>/dev/null |
        head -200
      register: world_writable_dirs
      changed_when: false
      failed_when: false

    - name: Find world writable files
      ansible.builtin.shell: |
        find / -xdev -type f -perm -0002 \
        ! -path "/proc/*" \
        ! -path "/sys/*" \
        ! -path "/run/*" \
        -printf '%m %u %g %p\n' 2>/dev/null |
        head -200
      register: world_writable_files
      changed_when: false
      failed_when: false

    # ============================================================
    # TEMP DIRECTORY SECURITY
    # ============================================================

    - name: Check /tmp permissions
      ansible.builtin.stat:
        path: /tmp
      register: tmp_stat

    - name: Check /var/tmp permissions
      ansible.builtin.stat:
        path: /var/tmp
      register: vartmp_stat

    # ============================================================
    # IMPORTANT FILE PERMISSIONS
    # ============================================================

    - name: Check /etc/passwd permissions
      ansible.builtin.stat:
        path: /etc/passwd
      register: passwd_stat

    - name: Check /etc/shadow permissions
      ansible.builtin.stat:
        path: /etc/shadow
      register: shadow_stat

    - name: Check /etc/group permissions
      ansible.builtin.stat:
        path: /etc/group
      register: group_stat

    # ============================================================
    # KERNEL SECURITY PARAMETERS
    # ============================================================

    - name: Check IP forwarding
      ansible.builtin.shell: |
        sysctl -n net.ipv4.ip_forward 2>/dev/null || echo "unknown"
      register: ip_forward
      changed_when: false
      failed_when: false

    - name: Check ICMP redirects
      ansible.builtin.shell: |
        sysctl -n net.ipv4.conf.all.accept_redirects 2>/dev/null || echo "unknown"
      register: icmp_redirects
      changed_when: false
      failed_when: false

    - name: Check source routing
      ansible.builtin.shell: |
        sysctl -n net.ipv4.conf.all.accept_source_route 2>/dev/null || echo "unknown"
      register: source_route
      changed_when: false
      failed_when: false

    - name: Check SYN cookies
      ansible.builtin.shell: |
        sysctl -n net.ipv4.tcp_syncookies 2>/dev/null || echo "unknown"
      register: syn_cookies
      changed_when: false
      failed_when: false

    # ============================================================
    # PACKAGE / PATCH STATUS
    # ============================================================

    - name: Collect package information
      ansible.builtin.shell: |
        if command -v rpm >/dev/null 2>&1; then
          rpm -qa 2>/dev/null | wc -l
        elif command -v dpkg >/dev/null 2>&1; then
          dpkg-query -W 2>/dev/null | wc -l
        else
          echo "0"
        fi
      register: package_count
      changed_when: false
      failed_when: false

    - name: Check available package updates
      ansible.builtin.shell: |
        if command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive list-updates 2>/dev/null |
          grep -E '^[vi]' |
          wc -l
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get -s upgrade 2>/dev/null |
          awk '/^[0-9]+ upgraded/ {print $1}'
        else
          echo "0"
        fi
      register: available_updates
      changed_when: false
      failed_when: false

    # ============================================================
    # SERVICES
    # ============================================================

    - name: Collect failed services
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl --failed --no-legend --no-pager 2>/dev/null
        else
          echo "SYSTEMD_NOT_AVAILABLE"
        fi
      register: failed_services
      changed_when: false
      failed_when: false

    - name: Collect running services
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl list-units --type=service --state=running \
          --no-legend --no-pager 2>/dev/null
        else
          echo "SYSTEMD_NOT_AVAILABLE"
        fi
      register: running_services
      changed_when: false
      failed_when: false

    # ============================================================
    # PROCESS SECURITY
    # ============================================================

    - name: Collect root processes
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,%cpu,%mem,comm,args --sort=-%cpu |
        awk '$1=="root" {print}' |
        head -100
      register: root_processes
      changed_when: false

    - name: Collect top CPU processes
      ansible.builtin.shell: |
        ps -eo user,pid,ppid,%cpu,%mem,comm,args --sort=-%cpu |
        head -21
      register: top_cpu_processes
      changed_when: false

    # ============================================================
    # CRON / SCHEDULED JOBS
    # ============================================================

    - name: Collect system cron configuration
      ansible.builtin.shell: |
        {
          echo "=== /etc/crontab ==="
          cat /etc/crontab 2>/dev/null || true

          echo "=== /etc/cron.d ==="
          find /etc/cron.d -type f -maxdepth 1 \
          -print -exec cat {} \; 2>/dev/null || true

          echo "=== cron.daily ==="
          ls -la /etc/cron.daily 2>/dev/null || true

          echo "=== cron.hourly ==="
          ls -la /etc/cron.hourly 2>/dev/null || true

          echo "=== cron.weekly ==="
          ls -la /etc/cron.weekly 2>/dev/null || true

          echo "=== cron.monthly ==="
          ls -la /etc/cron.monthly 2>/dev/null || true
        }
      register: cron_configuration
      changed_when: false
      failed_when: false

    # ============================================================
    # DISK SECURITY
    # ============================================================

    - name: Collect filesystem usage
      ansible.builtin.shell: |
        df -P -k -x tmpfs -x devtmpfs
      register: filesystem_usage
      changed_when: false

    # ============================================================
    # LOGGING / AUDIT
    # ============================================================

    - name: Check auditd
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl is-active auditd 2>/dev/null || echo "inactive"
        else
          echo "unknown"
        fi
      register: auditd_status
      changed_when: false
      failed_when: false

    - name: Check rsyslog
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl is-active rsyslog 2>/dev/null || echo "inactive"
        else
          echo "unknown"
        fi
      register: rsyslog_status
      changed_when: false
      failed_when: false

    # ============================================================
    # BUILD SECURITY FINDINGS
    # ============================================================

    - name: Evaluate SSH root login
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'FAIL',
                'category': 'SSH',
                'finding': 'SSH root login is enabled',
                'value': ssh_root_login.stdout | default('unknown')
              }]
              if ssh_root_login_should_be_disabled and
                 (ssh_root_login.stdout | default('') | lower) in ['yes','without-password','prohibit-password']
              else []
            )
          }}

    - name: Evaluate SSH password authentication
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'SSH',
                'finding': 'SSH password authentication is enabled',
                'value': ssh_password_auth.stdout | default('unknown')
              }]
              if ssh_password_auth_should_be_disabled and
                 (ssh_password_auth.stdout | default('') | lower) == 'yes'
              else []
            )
          }}

    - name: Evaluate SSH protocol
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'FAIL',
                'category': 'SSH',
                'finding': 'Deprecated SSH protocol detected',
                'value': ssh_protocol.stdout | default('unknown')
              }]
              if (ssh_protocol.stdout | default('') | trim) == '1'
              else []
            )
          }}

    - name: Evaluate UID 0 accounts
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Accounts',
                'finding': 'Multiple UID 0 accounts detected',
                'value': uid_zero_users.stdout_lines | default([])
              }]
              if (uid_zero_users.stdout_lines | default([]) | length) > 1
              else []
            )
          }}

    - name: Evaluate empty password accounts
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'FAIL',
                'category': 'Accounts',
                'finding': 'Accounts with empty passwords detected',
                'value': empty_password_accounts.stdout_lines | default([])
              }]
              if (empty_password_accounts.stdout_lines | default([]) | length) > 0
              else []
            )
          }}

    - name: Evaluate failed login attempts
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'FAIL',
                'category': 'Authentication',
                'finding': 'High number of failed login attempts',
                'value': failed_login_count.stdout | default('0')
              }]
              if (failed_login_count.stdout | default('0') | int) >= failed_login_count_critical
              else
              [{
                'severity': 'WARNING',
                'category': 'Authentication',
                'finding': 'Elevated failed login attempts',
                'value': failed_login_count.stdout | default('0')
              }]
              if (failed_login_count.stdout | default('0') | int) >= failed_login_count_warning
              else []
            )
          }}

    - name: Evaluate SUID files
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Filesystem',
                'finding': 'SUID files detected - review for unnecessary privileges',
                'value': suid_files.stdout_lines | default([]) | length
              }]
              if (suid_files.stdout_lines | default([]) | length) > 0
              else []
            )
          }}

    - name: Evaluate world writable directories
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Filesystem',
                'finding': 'World writable directories detected',
                'value': world_writable_dirs.stdout_lines | default([]) | length
              }]
              if (world_writable_dirs.stdout_lines | default([]) | length) > 0
              else []
            )
          }}

    - name: Evaluate IP forwarding
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Network',
                'finding': 'IPv4 forwarding is enabled',
                'value': ip_forward.stdout | default('unknown')
              }]
              if ip_forwarding_should_be_disabled and
                 (ip_forward.stdout | default('') | trim) == '1'
              else []
            )
          }}

    - name: Evaluate failed services
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Services',
                'finding': 'Failed system services detected',
                'value': failed_services.stdout_lines | default([]) | length
              }]
              if (failed_services.stdout_lines | default([]) | length) > 0
              else []
            )
          }}

    - name: Evaluate audit logging
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Logging',
                'finding': 'auditd is not active',
                'value': auditd_status.stdout | default('unknown')
              }]
              if (auditd_status.stdout | default('') | trim) != 'active'
              else []
            )
          }}

    - name: Evaluate package updates
      ansible.builtin.set_fact:
        security_findings: >-
          {{
            security_findings +
            (
              [{
                'severity': 'WARNING',
                'category': 'Patching',
                'finding': 'Package updates are available',
                'value': available_updates.stdout | default('0')
              }]
              if (available_updates.stdout | default('0') | int) > 0
              else []
            )
          }}

    # ============================================================
    # CALCULATE OVERALL STATUS
    # ============================================================

    - name: Count FAIL findings
      ansible.builtin.set_fact:
        security_fail_count: >-
          {{
            security_findings
            | selectattr('severity','equalto','FAIL')
            | list
            | length
          }}

    - name: Count WARNING findings
      ansible.builtin.set_fact:
        security_warning_count: >-
          {{
            security_findings
            | selectattr('severity','equalto','WARNING')
            | list
            | length
          }}

    - name: Calculate overall security status
      ansible.builtin.set_fact:
        report_status: >-
          {{
            'FAIL'
            if (security_fail_count | int) > 0
            else
            'WARNING'
            if (security_warning_count | int) > 0
            else
            'PASS'
          }}

    # ============================================================
    # CREATE REPORT DIRECTORY
    # ============================================================

    - name: Create security report directory
      ansible.builtin.file:
        path: "{{ report_base_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # BUILD JSON REPORT
    # ============================================================

    - name: Build JSON report
      ansible.builtin.set_fact:

        security_report:

          server: "{{ inventory_hostname }}"

          hostname: "{{ hostname_result.stdout | default('unknown') }}"

          operating_system: "{{ os_result.stdout | default('unknown') }}"

          kernel: "{{ kernel_result.stdout | default('unknown') }}"

          architecture: "{{ architecture_result.stdout | default('unknown') }}"

          overall_status: "{{ report_status }}"

          fail_count: "{{ security_fail_count | int }}"

          warning_count: "{{ security_warning_count | int }}"

          ping: "{{ 'PASS' if ping_result is succeeded else 'FAIL' }}"

          ssh:
            service: "{{ ssh_service.stdout | default('unknown') }}"
            root_login: "{{ ssh_root_login.stdout | default('unknown') }}"
            password_authentication: "{{ ssh_password_auth.stdout | default('unknown') }}"
            protocol: "{{ ssh_protocol.stdout | default('unknown') }}"

          network:
            listening_ports: "{{ listening_ports.stdout_lines | default([]) }}"
            ip_forwarding: "{{ ip_forward.stdout | default('unknown') }}"
            icmp_redirects: "{{ icmp_redirects.stdout | default('unknown') }}"
            source_route: "{{ source_route.stdout | default('unknown') }}"
            syn_cookies: "{{ syn_cookies.stdout | default('unknown') }}"

          firewall:
            firewalld: "{{ firewalld_status.stdout | default('unknown') }}"
            ufw: "{{ ufw_status.stdout | default('unknown') }}"
            nftables: "{{ nftables_status.stdout | default('unknown') }}"

          users:
            logged_in: "{{ logged_users.stdout_lines | default([]) }}"
            uid_zero: "{{ uid_zero_users.stdout_lines | default([]) }}"
            sudo: "{{ sudo_group_users.stdout | default('') }}"
            wheel: "{{ wheel_group_users.stdout | default('') }}"
            empty_password_accounts: "{{ empty_password_accounts.stdout_lines | default([]) }}"

          filesystem:
            usage: "{{ filesystem_usage.stdout_lines | default([]) }}"
            suid_files: "{{ suid_files.stdout_lines | default([]) }}"
            sgid_files: "{{ sgid_files.stdout_lines | default([]) }}"
            world_writable_directories: "{{ world_writable_dirs.stdout_lines | default([]) }}"
            world_writable_files: "{{ world_writable_files.stdout_lines | default([]) }}"

          services:
            failed: "{{ failed_services.stdout_lines | default([]) }}"
            running: "{{ running_services.stdout_lines | default([]) }}"

          processes:
            root: "{{ root_processes.stdout_lines | default([]) }}"
            top_cpu: "{{ top_cpu_processes.stdout_lines | default([]) }}"

          cron: "{{ cron_configuration.stdout_lines | default([]) }}"

          logging:
            auditd: "{{ auditd_status.stdout | default('unknown') }}"
            rsyslog: "{{ rsyslog_status.stdout | default('unknown') }}"

          packages:
            installed: "{{ package_count.stdout | default('0') }}"
            available_updates: "{{ available_updates.stdout | default('0') }}"

          findings: "{{ security_findings }}"

    # ============================================================
    # WRITE JSON
    # ============================================================

    - name: Write JSON security report
      ansible.builtin.copy:
        content: "{{ security_report | to_nice_json }}"
        dest: "{{ report_base_dir }}/{{ inventory_hostname }}_security_report.json"
        mode: "0644"

    # ============================================================
    # WRITE CSV
    # ============================================================

    - name: Write CSV security report
      ansible.builtin.copy:
        dest: "{{ report_base_dir }}/{{ inventory_hostname }}_security_report.csv"
        mode: "0644"
        content: |
          Server,Hostname,OS,Overall Status,FAIL Count,WARNING Count,SSH Root Login,SSH Password Authentication,IP Forwarding,Failed Logins,Available Updates,SUID Files,World Writable Directories,Failed Services,Auditd
          "{{ inventory_hostname }}","{{ hostname_result.stdout | default('unknown') }}","{{ os_result.stdout | default('unknown') | replace('"','""') }}","{{ report_status }}","{{ security_fail_count }}","{{ security_warning_count }}","{{ ssh_root_login.stdout | default('unknown') }}","{{ ssh_password_auth.stdout | default('unknown') }}","{{ ip_forward.stdout | default('unknown') }}","{{ failed_login_count.stdout | default('0') }}","{{ available_updates.stdout | default('0') }}","{{ suid_files.stdout_lines | default([]) | length }}","{{ world_writable_dirs.stdout_lines | default([]) | length }}","{{ failed_services.stdout_lines | default([]) | length }}","{{ auditd_status.stdout | default('unknown') }}"

    # ============================================================
    # BUILD HTML
    # ============================================================

    - name: Write HTML security report
      ansible.builtin.copy:
        dest: "{{ report_base_dir }}/{{ inventory_hostname }}_security_report.html"
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>Linux Security Audit - {{ inventory_hostname }}</title>

          <style>
          body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
          }

          h1 {
            color: #222;
          }

          h2 {
            background: #333;
            color: white;
            padding: 10px;
          }

          table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            margin-bottom: 25px;
          }

          th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
          }

          th {
            background: #eee;
          }

          .PASS {
            color: green;
            font-weight: bold;
          }

          .WARNING {
            color: orange;
            font-weight: bold;
          }

          .FAIL {
            color: red;
            font-weight: bold;
          }

          pre {
            background: #111;
            color: #eee;
            padding: 15px;
            overflow-x: auto;
          }
          </style>

          </head>

          <body>

          <h1>Linux Security Audit Report</h1>

          <table>
          <tr><th>Server</th><td>{{ inventory_hostname }}</td></tr>
          <tr><th>Hostname</th><td>{{ hostname_result.stdout | default('unknown') }}</td></tr>
          <tr><th>Operating System</th><td>{{ os_result.stdout | default('unknown') }}</td></tr>
          <tr><th>Kernel</th><td>{{ kernel_result.stdout | default('unknown') }}</td></tr>
          <tr><th>Architecture</th><td>{{ architecture_result.stdout | default('unknown') }}</td></tr>
          <tr>
            <th>Overall Security Status</th>
            <td class="{{ report_status }}">{{ report_status }}</td>
          </tr>
          <tr><th>FAIL Findings</th><td>{{ security_fail_count }}</td></tr>
          <tr><th>WARNING Findings</th><td>{{ security_warning_count }}</td></tr>
          </table>

          <h2>Security Findings</h2>

          <table>
          <tr>
            <th>Severity</th>
            <th>Category</th>
            <th>Finding</th>
            <th>Value</th>
          </tr>

          {% if security_findings | length == 0 %}

          <tr>
            <td colspan="4" class="PASS">
              No security findings detected by this audit.
            </td>
          </tr>

          {% else %}

          {% for finding in security_findings %}

          <tr>
            <td class="{{ finding.severity }}">
              {{ finding.severity }}
            </td>
            <td>{{ finding.category }}</td>
            <td>{{ finding.finding }}</td>
            <td>
              {{ finding.value }}
            </td>
          </tr>

          {% endfor %}

          {% endif %}

          </table>

          <h2>SSH Security</h2>

          <table>
          <tr><th>SSH Service</th><td>{{ ssh_service.stdout | default('unknown') }}</td></tr>
          <tr><th>Root Login</th><td>{{ ssh_root_login.stdout | default('unknown') }}</td></tr>
          <tr><th>Password Authentication</th><td>{{ ssh_password_auth.stdout | default('unknown') }}</td></tr>
          <tr><th>Protocol</th><td>{{ ssh_protocol.stdout | default('unknown') }}</td></tr>
          </table>

          <h2>Network Exposure</h2>

          <pre>{{ listening_ports.stdout | default('') }}</pre>

          <h2>Firewall</h2>

          <pre>
          firewalld:
          {{ firewalld_status.stdout | default('unknown') }}

          UFW:
          {{ ufw_status.stdout | default('unknown') }}

          nftables:
          {{ nftables_status.stdout | default('unknown') }}
          </pre>

          <h2>Users</h2>

          <h3>Logged-in Users</h3>
          <pre>{{ logged_users.stdout | default('None') }}</pre>

          <h3>UID 0 Accounts</h3>
          <pre>{{ uid_zero_users.stdout | default('None') }}</pre>

          <h3>Sudo Group</h3>
          <pre>{{ sudo_group_users.stdout | default('None') }}</pre>

          <h3>Wheel Group</h3>
          <pre>{{ wheel_group_users.stdout | default('None') }}</pre>

          <h2>Filesystem Security</h2>

          <h3>SUID Files</h3>
          <pre>{{ suid_files.stdout | default('None') }}</pre>

          <h3>SGID Files</h3>
          <pre>{{ sgid_files.stdout | default('None') }}</pre>

          <h3>World Writable Directories</h3>
          <pre>{{ world_writable_dirs.stdout | default('None') }}</pre>

          <h3>World Writable Files</h3>
          <pre>{{ world_writable_files.stdout | default('None') }}</pre>

          <h2>Services</h2>

          <h3>Failed Services</h3>
          <pre>{{ failed_services.stdout | default('None') }}</pre>

          <h3>Running Services</h3>
          <pre>{{ running_services.stdout | default('None') }}</pre>

          <h2>Processes</h2>

          <h3>Top CPU Processes</h3>
          <pre>{{ top_cpu_processes.stdout | default('None') }}</pre>

          <h2>Patching</h2>

          <table>
          <tr><th>Installed Packages</th><td>{{ package_count.stdout | default('0') }}</td></tr>
          <tr><th>Available Updates</th><td>{{ available_updates.stdout | default('0') }}</td></tr>
          </table>

          <h2>Logging</h2>

          <table>
          <tr><th>auditd</th><td>{{ auditd_status.stdout | default('unknown') }}</td></tr>
          <tr><th>rsyslog</th><td>{{ rsyslog_status.stdout | default('unknown') }}</td></tr>
          </table>

          <h2>Cron Configuration</h2>

          <pre>{{ cron_configuration.stdout | default('None') }}</pre>

          </body>
          </html>

    # ============================================================
    # DISPLAY SHORT AWX SUMMARY
    # ============================================================

    - name: Display security assessment summary
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - "              LINUX SECURITY ASSESSMENT"
          - "=============================================================="
          - "Server          : {{ inventory_hostname }}"
          - "Hostname        : {{ hostname_result.stdout | default('unknown') }}"
          - "OS              : {{ os_result.stdout | default('unknown') }}"
          - "Overall Status  : {{ report_status }}"
          - "FAIL Findings   : {{ security_fail_count }}"
          - "WARNING Findings: {{ security_warning_count }}"
          - "=============================================================="
          - "JSON Report     : {{ report_base_dir }}/{{ inventory_hostname }}_security_report.json"
          - "CSV Report      : {{ report_base_dir }}/{{ inventory_hostname }}_security_report.csv"
          - "HTML Report     : {{ report_base_dir }}/{{ inventory_hostname }}_security_report.html"
          - "=============================================================="

    # ============================================================
    # PUBLISH INFORMATION TO AWX
    # ============================================================

    - name: Publish security report information
      ansible.builtin.set_stats:
        data:
          security_assessment:
            server: "{{ inventory_hostname }}"
            status: "{{ report_status }}"
            fail_count: "{{ security_fail_count }}"
            warning_count: "{{ security_warning_count }}"
            html_report: "{{ report_base_dir }}/{{ inventory_hostname }}_security_report.html"
            csv_report: "{{ report_base_dir }}/{{ inventory_hostname }}_security_report.csv"
            json_report: "{{ report_base_dir }}/{{ inventory_hostname }}_security_report.json"

  post_tasks:

    - name: Display security assessment completion
      ansible.builtin.debug:
        msg:
          - "Security assessment completed for {{ inventory_hostname }}."
          - "Status: {{ report_status }}"
          - "This playbook performs non-destructive security checks."
